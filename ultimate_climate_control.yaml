      'bed_comfort_quiet', 'bed_eco_fan_only'] and enable_cooling and (current_temp | float(0)) > (comfort_max_temp
      | float(0))) %}cool{% elif last_mode == 'heating' or (last_mode not in ['cooling', 'pre_conditioning', 'bed_comfort_eco',
      'bed_comfort_quiet', 'bed_eco_fan_only'] and enable_heating and (current_temp | float(0)) < (comfort_min_temp
      | float(0))) %}heat{% else %}none{% endif %}"
