              {{ current_temp }}°C • Target: {{ heating_target_temp }}°C\n"
            level: warning
  - conditions:
    - condition: template
      value_template: '{{ enable_pre_conditioning }}'
    # v9.20.0: should_activate already counts an approach in Smart (smart_presence_active)
    # and Auto. What blocked the Office on 04/10 was its 5-minute off-time protection, held
    # armed by the Room Empty branch re-stamping the mode clock every run (fixed there).
    # v9.20.0: never from Manual (an extreme-temperature fall-through there could start it).
    - condition: template
      value_template: '{{ (is_precond_mode | bool) or ((should_activate | bool) and control_mode != ''Manual'') }}'
    - condition: template
      value_template: '{{ (is_precond_mode | bool) or not (precond_trip_blocked | bool) }}'
    # v9.20.0: never straight back in from the run that has just left it. The trip marker is
    # written by the transitions block of that same run, after precond_trip_blocked was
    # rendered, so a time-limit exit (or a manual exit) on the drive home restarted at once.
    - condition: template
      value_template: '{{ not (trigger.id == ''mode_change'' and trigger.from_state is defined and
        trigger.from_state is not none and trigger.from_state.state == ''Pre-conditioning'') }}'
    - condition: template
      value_template: '{# v9.8.1: Re-entry guard - location_check only fires on FIRST entry, not while already in precond mode #}
        {# Without this guard, the block re-fires every periodic_check, resetting timestamps and spamming notifications #}
        {% set location_check = (approaching_home | bool) and not (anyone_home
        | bool) and not (is_precond_mode | bool) %} {% set manual_precond_needs_setup
        = (is_precond_mode | bool) and actual_ac_state == ''off'' %} {{ location_check
        or manual_precond_needs_setup }}

        '
    # v9.17.0: with the Custom trigger the START decision uses the two trigger
    # temperatures instead of the comfort-zone edges (a wide comfort zone meant an
    # already-warm room got no pre-cooling). The target and end conditions are unchanged.
    # v9.20.0: the shared precond_start_due (live sensor, beyond the end point).
    - condition: template
      value_template: '{{ (precond_start_due | bool) or ((is_precond_mode | bool) and actual_ac_state
        == ''off'') }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F50D {{ room_name | upper }} CLIMATE DEBUG: Pre-conditioning
            activated • Reason: Approaching home {% if proximity_sensor %}Distance:
            {{ states(proximity_sensor) }}m{% endif %} • Temperature: {{ current_temp
            }}°C needs adjustment\n"
          level: warning
    # v9.13.1: these three are the pre-conditioning SNAPSHOT. This branch legitimately
    # RE-ENTERS while the mode is already Pre-conditioning (its own
    # manual_precond_needs_setup path), and an unguarded re-entry would overwrite the
    # snapshot with 'Pre-conditioning' itself - trapping the room in pre-conditioning
    # forever - and wipe a recorded arrival time, so the grace period could never expire.
    # Only write them on a genuine ENTRY. The mode_change handler writes the same three
    # from trigger.from_state, which is the authoritative source.
    - if:
      - condition: template
        value_template: '{{ control_mode != ''Pre-conditioning'' and helper_precond_previous_mode
          not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_precond_previous_mode }}'
        data:
          value: '{{ control_mode }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ control_mode != ''Pre-conditioning'' and helper_precond_start
          not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_precond_start }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ control_mode != ''Pre-conditioning'' and helper_precond_arrival
          not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_precond_arrival }}'
        data:
          datetime: '1970-01-01 00:00:00'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_change }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ last_mode != ''pre_conditioning'' and helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_mode }}'
      data:
        value: pre_conditioning
      continue_on_error: true
    # v9.13.1 THE FIX: set the control mode BEFORE any AC command.
    # Switching the AC off->cool fires this automation's own climate_state_change trigger
    # (the global condition filters ceiling-fan changes by context but NOT climate ones),
    # and mode:restart then cancels this run. On 2026-09-03 14:33 that killed Office and
    # Master Bedroom mid-branch: helpers written, AC switched on, mode never set - and
    # 60s later the Smart-mode logic saw an empty house and switched them straight back
    # off. Living Room ran the same branch in the same minute and survived ONLY because
    # its AC was already 'cool', so its command produced no state change and no restart.
    # Setting the mode here fires mode_change and restarts too, but that is harmless and
    # self-healing: the new run re-enters this branch via manual_precond_needs_setup
    # (is_precond_mode and AC still off), this select is then a no-op (selecting the
    # option already active fires nothing), the guards above protect the snapshot, and
    # the AC commands - now the LAST thing in the branch - run with the mode correct.
    - if:
      - condition: template
        value_template: '{{ control_mode_helper not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_select.select_option
        target:
          entity_id: '{{ control_mode_helper }}'
        data:
          option: Pre-conditioning
        continue_on_error: true
    - variables:
        # v9.17.0: judged against the same trigger the start decision used, so a Custom
        # trigger below the comfort-zone edge still picks 'cool' rather than 'heat_cool'.
        precond_hvac_mode: "{% set custom = precond_trigger_mode == 'Custom' %}{% set
          cool_hit = (current_temp >= (precond_cool_trigger_temp | float(24))) if custom
          else (current_temp > comfort_max_temp) %}{% set heat_hit = (current_temp <=
          (precond_heat_trigger_temp | float(18))) if custom else (current_temp < comfort_min_temp)
          %}{% if cool_hit and enable_cooling
          %}\n  cool\n{% elif heat_hit and enable_heating %}\n
          \ heat\n{% elif enable_cooling and enable_heating %}\n  heat_cool\n{% elif
          enable_cooling %}\n  cool\n{% elif enable_heating %}\n  heat\n{% else %}\n
          \ off\n{% endif %}\n"
        precond_fan_mode: "{% if precond_validated_fan_mode == 'Dynamic' %}\n  {{
          new_fan_mode }}\n{% else %}\n  {{ precond_validated_fan_mode }}\n{% endif
          %}\n"
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: '[PRECOND_FAN_DEBUG] {{ room_name | upper }}: • precond_validated_fan_mode
            (from "High" input): {{ precond_validated_fan_mode }} • Is Dynamic mode?:
            {{ precond_validated_fan_mode == ''Dynamic'' }} • new_fan_mode (dynamic
            calc): {{ new_fan_mode }} • FINAL fan_mode being sent to AC: {{ precond_fan_mode
            }} • Device fan_modes: {{ state_attr(climate_list[0], ''fan_modes'') }}

            '
          level: warning
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_expected_hvac }}'
      data:
        value: '{{ precond_hvac_mode }}'
      continue_on_error: true
    - service: input_number.set_value
      target:
        entity_id: '{{ helper_expected_temp }}'
      data:
        value: '{{ adjusted_target }}'
      continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_expected_fan }}'
      data:
        value: '{{ precond_fan_mode }}'
      continue_on_error: true
    # v9.13.1: the AC commands moved to the END of this branch (see THE FIX above) -
    # they fire climate_state_change and restart the run, so every step that has to
    # survive now happens before them.
    # v9.20.0: the "Activated" [EVENT] and both pushes moved to the transitions block
    # (once per real entry; a re-entry used to send them again).
    - service: system_log.write
      data:
        message: "\U0001F321️ {{ room_name | upper }} TEMP SET: Pre-conditioning • AC setpoint
          {{ adjusted_target | round(1) }}°C, fan {{ precond_fan_mode }}, mode {{ precond_hvac_mode
          }} • Room {{ current_temp | round(1) }}°C → goal {{ precond_target }}°C\n"
        level: warning
    # v9.13.1: fan-change timestamp written BEFORE the command it describes - the same
    # "snapshot before service call" pattern the cooling/heating branches already use -
    # because the command below ends this run.
    - if:
      - condition: template
        value_template: '{{ fan_mode_changed and helper_last_fan_change not in [none,
          '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_last_fan_change }}'
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        continue_on_error: true
    - delay:
        milliseconds: 200
    - repeat:
        for_each: '{{ climate_list }}'
        sequence:
        - service: climate.set_temperature
          target:
            entity_id: '{{ repeat.item }}'
          data:
            temperature: '{{ adjusted_target }}'
            hvac_mode: '{{ precond_hvac_mode }}'
          continue_on_error: false
        - delay:
            milliseconds: 500
        - service: climate.set_fan_mode
          target:
            entity_id: '{{ repeat.item }}'
          data:
            fan_mode: '{{ precond_fan_mode }}'
          continue_on_error: false
  # v9.19.1: RETIRED. Legacy 3-tier "LOW COOLING when approaching home": it set the plain
  # target with the LOWEST fan whenever the approach flag was on, overriding both
  # pre-conditioning and the setpoint drive (04/10: Living Room and Master Bedroom both
  # parked at 22 / fan 1 while the automation wanted 18). Approaching rooms are now handled
  # by the pre-conditioning branch (when the room is past its trigger) or wait for arrival.
  # Kept disabled like the other retired branches rather than deleted.
  - conditions:
    - condition: template
      value_template: '{{ false }}'
    - condition: template
      value_template: '{{ (should_activate | bool) and (approaching_home | bool) and
        not (anyone_home | bool) }}'
    - condition: template
      value_template: "{% if last_mode == 'cooling' %}\n  {# Already cooling - continue
        until target reached #}\n  {% if current_temp <= (target_temp - target_overshoot)
        %}\n    False  {# EXIT: Target achieved with overshoot - cooled to {{ (target_temp
        - target_overshoot) | round(1) }}°C (strategy: {{ overshoot_strategy }}) #}\n
        \ {% else %}\n    {{ (should_activate | bool) and enable_cooling and current_temp
        > (target_temp - target_overshoot) }}\n  {% endif %}\n{% else %}\n  {# Not
        cooling - start if comfort max exceeded #}\n  {{ (should_activate | bool)
        and enable_cooling and current_temp > comfort_max_temp }}\n{% endif %}\n"
    - condition: template
      value_template: "{% if last_mode == 'cooling' %}\n  {# Same cooling mode - allow
        escalation, enforce runtime for de-escalation #}\n  {{ (final_escalation_level
        | int(0)) > 0 or (time_in_current_mode | float(0)) > (runtime_min | float(0))
        }}\n{% elif (last_mode == 'off' or actual_ac_state == 'off') and enforce_offtime
        %}\n  {# Starting from OFF - enforce off-time if enabled #}\n  {# Check BOTH
        helper mode AND actual AC state to catch mode change scenarios #}\n  {{ (time_in_current_mode
        | float(0)) > (offtime_min | float(0)) }}\n{% else %}\n  {# Switching from
        heating/eco OR off-time protection disabled #}\n  true\n{% endif %}\n"
    sequence:
    - service: system_log.write
      data:
        message: "{% set current_mode = states(helper_mode) | default('off') %} {%
          set temp_gap = (current_temp - target_temp) | round(1) %} {% set eta_minutes
          = (temp_gap / temp_change_rate) | round(0) if temp_change_rate > 0 else
          99 %} {% set effectiveness = current_effectiveness if dynamic_enabled else
          70 %} {% set escalation = escalation_level if dynamic_enabled else 0 %}
          {% set deescalation = deescalation_level if dynamic_enabled else 0 %} {%
          set temp_gap_adjusted = temp_gap | abs | round(1) %} {% set distance_adjusted
          = temp_gap | abs | round(1) %} {% set esc_display = 'L' ~ escalation if
          escalation > 0 else ('DE-L' ~ deescalation if deescalation > 0 else 'None')
          %} {% set current_fan = state_attr(climate_list[0], 'fan_mode') | default('Auto')
          %}\n{% if current_mode == 'cooling' %}\n  {% if temp_gap <= 0.3 %}\n    \U0001F3AF
          {{ room_name | upper }} LOW COOLING - PRECISION FINISH\n    \U0001F4CA CONTINUE
          MODE: Temperature {{ current_temp }}°C fine-tuning to {{ adjusted_target
          }}°C ({{ temp_gap_adjusted }}°C remaining)\n    ⏱️ ETA: ~{{ eta_minutes
          }}min {% if effectiveness >= 85 %}| ❄️ OPTIMAL EFFICIENCY{% elif effectiveness
          >= 65 %}| ⚙️ GOOD CONTROL ({{ effectiveness }}%){% else %}| \U0001F527 ADJUSTING
          ({{ effectiveness }}% effective){% endif %}\n  {% elif temp_gap <= 1.5 %}\n
          \   ❄️ {{ room_name | upper }} LOW COOLING - GENTLE APPROACH\n    \U0001F4CA
          CONTINUE MODE: Gradually cooling {{ current_temp }}°C → {{ adjusted_target
          }}°C ({{ temp_gap_adjusted }}°C to go)\n    ⏱️ ETA: ~{{ eta_minutes }}min
          | ⚡ Escalation: {{ esc_display }} | Fan: {{ current_fan }}{% if escalation
          > 0 %} | \U0001F53C ESCALATING L{{ escalation }}{% elif deescalation > 0
          %} | \U0001F53D DE-ESCALATING L{{ deescalation }}{% endif %}\n  {% else
          %}\n    ❄️ {{ room_name | upper }} LOW COOLING - PATIENT MODE\n    \U0001F4CA
          CONTINUE MODE: Steady cooling {{ current_temp }}°C → {{ adjusted_target
          }}°C ({{ temp_gap_adjusted }}°C to cool)\n    \U0001F321️ Gentle power until
          comfort | ⚡ Escalation: {{ esc_display }} | Fan: {{ current_fan }} | Effectiveness:
          {{ effectiveness }}%\n  {% endif %}\n{% else %}\n  {% if temp_gap >= 3.0
          %}\n    ❄️ {{ room_name | upper }} LOW COOLING - CAUTIOUS START\n    \U0001F680
          START MODE: Moderate heat {{ current_temp }}°C > {{ comfort_max_temp }}°C
          ({{ distance_adjusted }}°C excess)\n    \U0001F321️ Gentle cooling approach
          | Target: {{ adjusted_target }}°C | ETA: ~{{ eta_minutes }}min\n  {% elif
          temp_gap >= 1.0 %}\n    ❄️ {{ room_name | upper }} LOW COOLING - COMFORT
          ADJUSTMENT\n    \U0001F680 START MODE: Slight warmth {{ current_temp }}°C
          > {{ comfort_max_temp }}°C threshold\n    ⚙️ Gentle cooling → {{ adjusted_target
          }}°C ({{ temp_gap_adjusted }}°C to cool) | ⚡ Escalation: {{ esc_display
          }} | Fan: {{ current_fan }}\n  {% else %}\n    ❄️ {{ room_name | upper }}
          LOW COOLING - MICRO-ADJUST\n    \U0001F680 START MODE: Fine-tuning {{ current_temp
          }}°C > {{ comfort_max_temp }}°C\n    \U0001F3AF Minimal cooling to {{ adjusted_target
          }}°C ({{ temp_gap_adjusted }}°C remaining) | ETA: ~{{ eta_minutes }}min\n
          \ {% endif %}\n{% endif %} • Last Mode: {{ current_mode }}\n"
        level: warning
    - repeat:
        for_each: '{{ climate_list }}'
        sequence:
        - variables:
            current_entity: '{{ repeat.item }}'
            available_modes: '{{ (state_attr(repeat.item, ''hvac_modes'') or []) | list }}'
            # LOW-low-cooling-expected-fallback: MUST stay in sync with the duplicate
            # template in the command repeat below (ends in 'cool', not 'off').
            selected_hvac_mode: "{% set modes = (state_attr(repeat.item, 'hvac_modes') or [])
              | list %} {# For cooling, try cooling-capable modes #} {% if 'cool'
              in modes %}\n  cool\n  {% elif 'Cool' in modes %}\n  Cool\n  {% elif
              enable_heating and 'auto' in modes %}\n  auto\n  {% elif enable_heating
              and 'Auto' in modes %}\n  Auto\n  {% elif enable_heating and 'heat_cool'
              in modes %}\n  heat_cool\n  {% elif enable_heating and 'Heat/Cool' in
              modes %}\n  Heat/Cool\n  {% else %}\n  cool\n{% endif %}\n"
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: '{{ selected_hvac_mode }}'
            continue_on_error: true
    - service: input_number.set_value
      target:
        entity_id: '{{ helper_expected_temp }}'
      data:
        value: '{{ cooling_target_temp }}'
      continue_on_error: true
    - repeat:
        for_each: '{{ climate_list }}'
        sequence:
        - variables:
            current_entity: '{{ repeat.item }}'
            available_fans: '{{ (state_attr(repeat.item, ''fan_modes'') or []) | list }}'
            # LOW-low-cooling-expected-fallback: MUST stay in sync with the duplicate
            # template in the expected-state repeat above (both end in 'cool').
            selected_hvac_mode: "{% set modes = (state_attr(repeat.item, 'hvac_modes') or [])
              | list %} {% if 'cool' in modes %}\n  cool\n{% elif 'Cool' in modes
              %}\n  Cool\n{% elif enable_heating and 'auto' in modes %}\n  auto\n{%
              elif enable_heating and 'Auto' in modes %}\n  Auto\n{% elif enable_heating
              and 'heat_cool' in modes %}\n  heat_cool\n{% elif enable_heating and
              'Heat/Cool' in modes %}\n  Heat/Cool\n{% else %}\n  cool\n{% endif %}\n"
            selected_fan_mode: "{% set fans = (state_attr(repeat.item, 'fan_modes') or [])
              | list %}\n{# Try low speed equivalents in order of preference #} {%
              if 'low' in fans %}\n  low\n  {% elif 'Low' in fans %}\n  Low\n  {%
              elif '1' in fans %}\n  1\n  {% elif 'Level 1' in fans %}\n  Level 1\n
              \ {% elif 'quiet' in fans %}\n  quiet\n  {% elif 'Quiet' in fans %}\n
              \ Quiet\n  {% elif 'eco' in fans %}\n  eco\n  {% elif 'Eco' in fans
              %}\n  Eco\n  {% elif 'auto' in fans %}\n  auto\n  {% elif 'Auto' in
              fans %}\n  Auto\n{# Fallback to available options #}\n  {% elif '2'
              in fans %}\n  2\n  {% elif 'Level 2' in fans %}\n  Level 2\n  {% else
              %}\n  {{ fans[0] if fans else 'Auto' }}\n{% endif %}\n"
        - service: climate.set_temperature
          target:
            entity_id: '{{ current_entity }}'
          data:
            temperature: '{{ cooling_target_temp }}'
            hvac_mode: '{{ selected_hvac_mode }}'
          continue_on_error: false
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_fan }}'
          data:
            value: '{{ selected_fan_mode }}'
          continue_on_error: true
        - delay:
            milliseconds: 500
        - service: climate.set_fan_mode
          target:
            entity_id: '{{ current_entity }}'
          data:
            fan_mode: '{{ selected_fan_mode }}'
          continue_on_error: false
        - delay:
            milliseconds: 500
        # v9.14.0 (bug 3): swing is a fixed input; only send it when the unit differs.
        - if:
          - condition: template
            value_template: '{{ validated_swing_mode != ''none'' and state_attr(current_entity, ''swing_mode'') != validated_swing_mode }}'
          then:
          - service: climate.set_swing_mode
            target:
              entity_id: '{{ current_entity }}'
            data:
              swing_mode: '{{ validated_swing_mode }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F50D SMART ECO - LOW COOLING: {{ repeat.item }} • HVAC
                Mode: {{ selected_hvac_mode }} • Fan Mode: {{ selected_fan_mode }}
                • Temperature: {{ cooling_target_temp }}°C • Reason: Low cooling mode
                for gentle temperature control\n"
              level: debug
    - if:
      - condition: template
        value_template: '{{ fan_mode_changed and helper_last_fan_change not in [none,
          '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_last_fan_change }}'
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: !input helper_last_mode
      data:
        value: cooling
    - if:
      - condition: template
        value_template: '{{ dynamic_enabled and helper_mode_time not in [none, '''',
          ''unavailable'', ''unknown'', []] and helper_mode_time is string and helper_mode_time
          != '''' and (last_mode != ''cooling'' or actual_ac_state == ''off'') }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ bed_comfort_mode != ''off'' }}'
    - condition: template
      value_template: '{{ bed_sensor_manual and is_state(bed_sensor_manual, ''on'')
        }}'
    - condition: template
      value_template: '{% set bed_eco_max = target_temp + bed_eco_return_threshold
        if bed_eco_fan_only_mode in [''enabled'', ''ceiling_fan''] else comfort_max_temp %} {{ current_temp
        >= comfort_min_temp and current_temp <= bed_eco_max }}

        '
    - condition: template
      value_template: '{{ actual_ac_state != ''off'' }}'
    # v9.20.0: a running cooling unit is only relabelled here (the compressor stays on), so
    # the minimum-runtime wait does not apply to it; a young run that missed this window was
    # stopped instead of resting.
    - condition: template
      value_template: '{{ time_in_current_mode | float(0) >= (runtime_min | float(0)) or last_mode == ''cooling'' }}'
    - condition: template
      value_template: '{{ control_mode not in [''Manual'', ''Override''] }}'
    # v9.20.0 (round 4): outside Smart the room must be wanted too (in Auto with nobody home a
    # phantom bed reading relabelled an Away-eco unit as Bed ECO every Minimum Runtime).
    - condition: template
      value_template: '{{ (control_mode != ''Smart'' and (should_activate | bool)) or (control_mode == ''Smart''
        and (smart_presence_active | bool)) }}'
    - condition: template
      value_template: "{% set in_continue_mode = (last_mode == 'cooling' or last_mode
        == 'heating') %} {% set in_bed_fan_only = last_mode == 'bed_eco_fan_only'
        %} {% set in_bed_comfort = last_mode in ['bed_comfort_eco', 'bed_comfort_quiet']
        %} {% set in_comfort_fan_only = last_mode == 'comfort_fan_only' %} {% set
        in_overshoot_fan_only = last_mode == 'stability_fan_only' %}\n{% if in_bed_fan_only
        %}\n  false  {# Don't interrupt bed ECO fan-only mode #}\n{% elif in_bed_comfort
        %}\n  false  {# v7.5.0: Already in bed comfort - don't re-enter, let fan_only handler take over #}\n{% elif in_comfort_fan_only
        %}\n  false  {# Don't interrupt comfort zone fan-only #}\n{% elif in_overshoot_fan_only
        %}\n  true   {# v4.6.8: ALLOW bed comfort to override overshoot fan-only when
        user enters bed #}\n{% elif not in_continue_mode %}\n  true\n{% elif last_mode
        == 'cooling' %}\n  {{ current_temp <= (target_temp - target_overshoot) }}\n{%
        elif last_mode == 'heating' %}\n  {{ current_temp >= (target_temp + target_overshoot)
        }}\n{% else %}\n  true\n{% endif %}\n"
    sequence:
    # v9.20.0: the bed modes stamp the mode clock like every other mode (in bed it still
    # counted from the evening's cooling start, so the stability minutes were always met).
    - if:
      - condition: template
        value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_mode not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_mode }}'
        data:
          value: bed_comfort_{{ bed_comfort_mode }}
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "[EVENT] {{ room_name }} 🛏️ | Bed Comfort {{ bed_comfort_mode | title }} Entered
            | From {{ last_mode | replace('_', ' ') | title }}, Room {{ current_temp
            }}°C, Target {{ target_temp }}°C"
          level: warning
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F6CF️ {{ room_name | upper }} BED COMFORT MODE ACTIVATED\nSleep
            Optimization:\n    • Bed Comfort Mode: {{ bed_comfort_mode | upper }}\n
            \   • Bed Sensor: {{ bed_sensor_manual }} = ON\n    • Current Temp: {{
            current_temp }}°C\n    • Comfort Zone: {{ comfort_min_temp }}-{{ comfort_max_temp
            }}°C\n    • Last Mode: {{ last_mode }}\n    • Overshoot Target: {{ target_temp
            - target_overshoot if last_mode == 'cooling' else target_temp + target_overshoot
            }}°C\n\nAction: {{ 'Ultra-quiet fan only' if bed_comfort_mode == 'quiet'
            else 'Full ECO mode' }}\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_change }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and
          ceiling_fan_is_on and fan_bed_comfort_mode != ''unchanged'' and helper_expected_ceiling_fan
          not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_ceiling_fan }}'
        data:
          value: '{{ ''off'' if fan_bed_comfort_mode == ''off'' else ''on'' }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and
          ceiling_fan_is_on }}'
      then:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ fan_bed_comfort_mode == ''off'' }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_speed_switches }}'
              sequence:
              - service: switch.turn_off
                target:
                  entity_id:
                  - '{{ ceiling_fan_low_switch }}'
                  - '{{ ceiling_fan_medium_switch }}'
                  - '{{ ceiling_fan_high_switch }}'
                continue_on_error: true
            default:
            - service: homeassistant.turn_off
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
        # v9.20.0 (round 3): the in-bed speed (low, or Dynamic's low/medium), and only when the
        # fan is not already on it (the relays were re-sent on every entry).
        - conditions:
          - condition: template
            value_template: '{{ fan_bed_comfort_mode in [''low'', ''dynamic''] and (ceiling_fan_domain
              == ''fan'' or ceiling_fan_has_speed_switches) and not (ceiling_fan_at_target_speed | bool) }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_ceiling_fan }}'
              data:
                value: 'on'
              continue_on_error: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_speed_switches }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - if:
                  - condition: template
                    value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
                  then:
                  - service: switch.turn_off
                    target:
                      entity_id: '{{ ceiling_fan_other_switches }}'
                    continue_on_error: true
                - delay:
                    milliseconds: 100
                - service: switch.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_target_switch }}'
                  continue_on_error: true
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_domain == ''fan'' }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ not (ceiling_fan_is_on | bool) }}'
                then:
                - service: fan.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  continue_on_error: true
                - delay:
                    milliseconds: 500
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ ceiling_fan_has_presets }}'
                    sequence:
                    - service: fan.set_preset_mode
                      target:
                        entity_id: '{{ ceiling_fan_entities }}'
                      data:
                        preset_mode: '{{ ceiling_fan_target_speed }}'
                      continue_on_error: true
                  default:
                  - service: fan.set_percentage
                    target:
                      entity_id: '{{ ceiling_fan_entities }}'
                    data:
                      percentage: '{{ ceiling_fan_target_pct }}'
                    continue_on_error: true
            default:
            - if:
              - condition: template
                value_template: '{{ not (ceiling_fan_is_on | bool) }}'
              then:
              - service: homeassistant.turn_on
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                continue_on_error: true
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ bed_comfort_mode == ''quiet'' }}'
        sequence:
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - service: climate.set_fan_mode
              target:
                entity_id: '{{ repeat.item }}'
              data:
                fan_mode: '{{ new_fan_mode }}'
              continue_on_error: true
            - if:
              - condition: template
                value_template: '{{ debug_enabled }}'
              then:
              - service: system_log.write
                data:
                  message: "\U0001F6CF️ {{ room_name | upper }}: Bed Quiet mode -
                    Set {{ repeat.item }} fan to {{ new_fan_mode }} (actual: {{ state_attr(repeat.item,
                    'fan_mode') }})"
                  level: debug
            - if:
              - condition: template
                value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
                  ''unknown''] }}'
              then:
              - service: input_text.set_value
                target:
                  entity_id: '{{ helper_expected_fan }}'
                data:
                  value: '{{ new_fan_mode }}'
                continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and helper_last_fan_change not in
              [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_last_fan_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - conditions:
        - condition: template
          value_template: '{{ bed_comfort_mode == ''eco'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_change not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_last_change
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        # v9.20.0 (round 3): the setpoint, fan and mode are only sent when the unit differs (the
        # relabel of a running cooling run re-sent an unchanged 19.5 and fan 3 every night), and
        # the expected temperature only moves with a setpoint that is sent.
        - variables:
            bed_entry_send: "{% set ns = namespace(s=false) %}{% for e in climate_list %}{% if states(e) not in
              ['cool', 'Cool', 'heat_cool', 'auto', 'Auto', 'Heat/Cool'] or ((state_attr(e, 'temperature') | float(-99))
              - (adjusted_target | float(0))) | abs >= 0.3 %}{% set ns.s = true %}{% endif %}{% endfor %}{{ ns.s }}"
        - if:
          - condition: template
            value_template: '{{ bed_entry_send | bool }}'
          then:
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_expected_temp }}'
            data:
              value: '{{ adjusted_target }}'
            continue_on_error: true
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - variables:
                current_entity: '{{ repeat.item }}'
                available_modes: '{{ (state_attr(repeat.item, ''hvac_modes'') or []) | list
                  }}'
                selected_hvac_mode: "{% set modes = (state_attr(repeat.item, 'hvac_modes') or [])
                  | list %} {# For stability, prefer auto/heat_cool only if both enabled
                  #} {% if enable_cooling and enable_heating and 'auto' in modes %}\n
                  \ auto\n{% elif enable_cooling and enable_heating and 'Auto' in
                  modes %}\n  Auto\n{% elif enable_cooling and enable_heating and
                  'heat_cool' in modes %}\n  heat_cool\n{% elif enable_cooling and
                  enable_heating and 'Heat/Cool' in modes %}\n  Heat/Cool\n{% elif
                  enable_cooling and 'cool' in modes %}\n  cool\n{% elif enable_cooling
                  and 'Cool' in modes %}\n  Cool\n{% elif enable_heating and 'heat'
                  in modes %}\n  heat\n{% elif enable_heating and 'Heat' in modes
                  %}\n  Heat\n{% else %}\n  off\n{% endif %}\n"
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_hvac }}'
              data:
                value: '{{ selected_hvac_mode }}'
              continue_on_error: true
            - if:
              - condition: template
                value_template: '{{ states(current_entity) != selected_hvac_mode or ((state_attr(current_entity,
                  ''temperature'') | float(-99)) - (adjusted_target | float(0))) | abs >= 0.3 }}'
              then:
              - service: climate.set_temperature
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  temperature: '{{ adjusted_target }}'
                  hvac_mode: '{{ selected_hvac_mode }}'
                continue_on_error: false
              - delay:
                  milliseconds: 500
            - if:
              - condition: template
                value_template: '{{ (state_attr(current_entity, ''fan_mode'') | string | trim) != (new_fan_mode | string
                  | trim) and state_attr(current_entity, ''preset_mode'') != ''boost'' }}'
              then:
              - service: input_text.set_value
                target:
                  entity_id: '{{ helper_expected_fan }}'
                data:
                  value: '{{ new_fan_mode }}'
                continue_on_error: true
              - service: climate.set_fan_mode
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  fan_mode: '{{ new_fan_mode }}'
                continue_on_error: false
              - delay:
                  milliseconds: 500
            - if:
              - condition: template
                value_template: '{{ validated_swing_mode not in [''none'', '''', ''unavailable'',
                  ''unknown''] }}'
              then:
              # v9.14.0 (bug 3): swing is a fixed input; only send it when the unit differs.
              - if:
                - condition: template
                  value_template: '{{ validated_swing_mode != ''none'' and state_attr(current_entity, ''swing_mode'') != validated_swing_mode }}'
                then:
                - service: climate.set_swing_mode
                  target:
                    entity_id: '{{ current_entity }}'
                  data:
                    swing_mode: '{{ validated_swing_mode }}'
                  continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F6CF️ {{ room_name | upper }} BED COMFORT ECO: Maintaining
                Target Temperature\nTemperature:\n    • Set AC to: {{ adjusted_target
                | round(1) }}°C\n    • Current: {{ current_temp | round(1) }}°C →
                Target: {{ target_temp | round(1) }}°C\n\nEscalation (v3.13.16):\n
                \   • Level: {{ final_escalation_level }} (0=Eco, 1-4=Escalated)\n
                \   • Fan: {{ state_attr(climate_list[0], 'fan_mode') if climate_list
                else 'unknown' }}\n    • Uses same effectiveness tracking as continue
                mode\n\nReason: Bed occupied - continuous temperature maintenance
                in ECO mode with dynamic fan escalation\n"
              level: warning
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and helper_last_fan_change not in
              [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_last_fan_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
  # v9.20.0: getting into bed with the AC already off (the usual bedtime state, after an
  # evening stop at target or Room Empty) starts the Bed ECO rest straight away when the rest
  # uses the ceiling fan: the fan holds the room at the in-bed speed and the return branch
  # restarts the compressor at the return point. Before, nothing ran the fan until the room
  # passed the return point.
  - conditions:
    # v9.20.0 (round 3): Bed Comfort eco only (the return branch restarts as bed_comfort_eco),
    # not when Fan in Bed keeps the fan off, and in Smart only with someone home: a phantom bed
    # reading with nobody home started the ceiling fan here and the return branch then started
    # the compressor (replayed on the 04/10 13:55 bed trace at 23.4). This is the only way into
    # the rest from an idle unit; the return branch itself is not gated, so phones dropping off
    # overnight cannot stop the compressor coming back over a sleeper.
    - condition: template
      value_template: "{{ bed_comfort_mode == 'eco' and bed_eco_fan_only_mode == 'ceiling_fan' and ceiling_fan_configured
        and not (ceiling_fan_bed_blocked | bool) and (bed_occupied | bool) and actual_ac_state == 'off' }}"
    - condition: template
      value_template: "{{ last_mode not in ['bed_comfort_eco', 'bed_comfort_quiet', 'bed_eco_fan_only'] and current_temp
        >= comfort_min_temp and current_temp <= (target_temp + bed_eco_return_threshold) }}"
    - condition: template
      value_template: "{{ control_mode not in ['Manual', 'Override'] and ((anyone_home | bool) or (persons | count)
        == 0) and ((control_mode != 'Smart' and (should_activate | bool)) or (control_mode == 'Smart' and
        (smart_presence_active | bool))) }}"
    sequence:
    - if:
      - condition: template
        value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_mode }}'
      data:
        value: bed_eco_fan_only
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: 'off'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "[EVENT] {{ room_name }} 🛏️ | Bed Eco Rest (AC was off): Ceiling Fan {{ 'held by fan override' if fan_override_active else ceiling_fan_target_speed }} |
            Room {{ current_temp }}°C, Target {{ target_temp }}°C, compressor on above {{ (target_temp + bed_eco_return_threshold)
            | round(1) }}°C"
          level: warning
    - if:
      - condition: template
        value_template: '{{ not fan_override_active and not (ceiling_fan_at_target_speed | bool) }}'
      then:
      - if:
        - condition: template
          value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_ceiling_fan }}'
          data:
            value: 'on'
          continue_on_error: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
            then:
            - if:
              - condition: template
                value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
              then:
              - service: switch.turn_off
                target:
                  entity_id: '{{ ceiling_fan_other_switches }}'
                continue_on_error: true
            - delay:
                milliseconds: 100
            - service: switch.turn_on
              target:
                entity_id: '{{ ceiling_fan_target_switch }}'
              continue_on_error: true
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_domain == ''fan'' }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ not (ceiling_fan_is_on | bool) }}'
            then:
            - service: fan.turn_on
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
            - delay:
                milliseconds: 500
          - if:
            - condition: template
              value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
            then:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ ceiling_fan_has_presets }}'
                sequence:
                - service: fan.set_preset_mode
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  data:
                    preset_mode: '{{ ceiling_fan_target_speed }}'
                  continue_on_error: true
              default:
              - service: fan.set_percentage
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                data:
                  percentage: '{{ ceiling_fan_target_pct }}'
                continue_on_error: true
        default:
        - if:
          - condition: template
            value_template: '{{ not (ceiling_fan_is_on | bool) }}'
          then:
          - service: homeassistant.turn_on
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ bed_eco_should_fan_only }}'
    # v9.20.0: bed_active (bed occupied, within the Bed Absence Grace, or the bed sensor
    # dropping out while a bed mode runs).
    - condition: template
      value_template: '{{ bed_active | bool }}'
    # v9.20.0: the AC's own fan-only mode is only needed when the rest uses it.
    - condition: template
      value_template: '{% set modes = (state_attr(climate_list[0], ''hvac_modes'') or [])
        | list %} {{ (bed_eco_fan_only_mode == ''ceiling_fan'' and ceiling_fan_configured) or ''fan_only'' in modes
        or ''fan-only'' in modes or ''Fan Only'' in modes or ''dry'' in modes }}'
    # v9.20.0: a room already below the floor (target - Maximum Overshoot) hands over at once.
    - condition: template
      value_template: '{{ time_in_current_mode | float(0) >= (bed_eco_stability_minutes | float(1)) or current_temp
        < (target_temp - (bed_eco_max_overshoot | float(1))) }}'
    sequence:
    # v9.20.0 (round 3): the ceiling-fan rest needs a ceiling fan; without one the AC's own
    # fan-only is used and gets its expected temperature, fan and fan clock like any other.
    - variables:
        rest_uses_ceiling_fan: "{{ bed_eco_fan_only_mode == 'ceiling_fan' and ceiling_fan_configured }}"
    - if:
      - condition: template
        value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_mode not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_mode }}'
        data:
          value: bed_eco_fan_only
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "[EVENT] {{ room_name }} 🛏️ | Bed Eco → Fan Only (Compressor Off) |
            Room {{ current_temp }}°C, Target {{ target_temp }}°C, Rate {{ temp_change_rate
            }}°C/min, Stable {{ bed_eco_temp_stable }}, Returns above {{
            (target_temp + bed_eco_return_threshold) | round(1) }}°C"
          level: warning
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F6CF️\U0001F4A8 {{ room_name | upper }} BED ECO → FAN-ONLY
            MODE\nStability Detection:\n    • Temp: {{ current_temp }}°C (target:
            {{ target_temp }}°C)\n    • Change rate: {{ temp_change_rate | round(3)
            }}°C/min (max: {{ bed_eco_stability_rate }})\n    • Stable for: {{ time_in_current_mode
            | round(1) }} min (required: {{ bed_eco_stability_minutes }})\n\nThresholds:\n
            \   • Return if temp > {{ (target_temp + bed_eco_return_threshold) | round(1)
            }}°C\n    • Max undershoot: {{ bed_eco_max_overshoot }}°C\n\nPower Savings:
            ~85% reduction (compressor OFF)\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_change }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_temp not in [none, '''', ''unavailable'',
          ''unknown''] and not (rest_uses_ceiling_fan | bool) }}'
      then:
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_expected_temp }}'
        data:
          value: '{{ target_temp }}'
        continue_on_error: true
    - variables:
        selected_fan_only_hvac: "{% set modes = (state_attr(climate_list[0], 'hvac_modes') or [])
          | list %} {% if 'fan_only' in modes %}\n  fan_only\n{% elif 'fan-only' in
          modes %}\n  fan-only\n{% elif 'Fan Only' in modes %}\n  Fan Only\n{% elif
          'dry' in modes %}\n  dry\n{% else %}\n  off\n{% endif %}\n"
    # LOW-expected-hvac-literal: write the ACTUALLY-commanded variant (not literal
    # 'fan_only') so expected == sent and no false hvac_mismatch override fires.
    - if:
      - condition: template
        value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
          ''unknown''] and not (rest_uses_ceiling_fan | bool) }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: '{{ selected_fan_only_hvac }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
          ''unknown''] and not (rest_uses_ceiling_fan | bool) }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_fan }}'
        data:
          value: '{{ new_fan_mode }}'
        continue_on_error: true
    # v9.18.0: with the ceiling_fan option the rest phase turns the unit OFF and lets the
    # ceiling fan hold the room (the AC's own fan-only is pointless next to a ceiling fan,
    # per Chris). The fan-zone entry carries a bed guard so it cannot grab the room while
    # the unit is off in bed; the return branch above commands the unit back on itself.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ rest_uses_ceiling_fan | bool }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: 'off'
            continue_on_error: true
        # v9.20.0: the ceiling fan first (fast relays) and the slow AC command last, so a
        # restart during the 40-70 s turn-off can no longer leave the room with no airflow.
        # A fan override is respected, and a switch-type fan is switched on as well. The
        # upkeep branch below re-issues either step if it did not land.
        - if:
          - condition: template
            value_template: '{{ not fan_override_active and not (ceiling_fan_bed_blocked | bool) }}'
          then:
          - if:
            - condition: template
              value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_ceiling_fan }}'
              data:
                value: 'on'
              continue_on_error: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_speed_switches }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - if:
                  - condition: template
                    value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
                  then:
                  - service: switch.turn_off
                    target:
                      entity_id: '{{ ceiling_fan_other_switches }}'
                    continue_on_error: true
                - delay:
                    milliseconds: 100
                - service: switch.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_target_switch }}'
                  continue_on_error: true
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_domain == ''fan'' }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ not (ceiling_fan_is_on | bool) }}'
                then:
                - service: fan.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  continue_on_error: true
                - delay:
                    milliseconds: 500
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ ceiling_fan_has_presets }}'
                    sequence:
                    - service: fan.set_preset_mode
                      target:
                        entity_id: '{{ ceiling_fan_entities }}'
                      data:
                        preset_mode: '{{ ceiling_fan_target_speed }}'
                      continue_on_error: true
                  default:
                  - service: fan.set_percentage
                    target:
                      entity_id: '{{ ceiling_fan_entities }}'
                    data:
                      percentage: '{{ ceiling_fan_target_pct }}'
                    continue_on_error: true
            default:
            - if:
              - condition: template
                value_template: '{{ not (ceiling_fan_is_on | bool) }}'
              then:
              - service: homeassistant.turn_on
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                continue_on_error: true
        - service: climate.turn_off
          target:
            entity_id: '{{ climate_list }}'
          continue_on_error: true
      default:
      - repeat:
          for_each: '{{ climate_list }}'
          sequence:
          - service: climate.set_temperature
            target:
              entity_id: '{{ repeat.item }}'
            data:
              temperature: '{{ target_temp }}'
              hvac_mode: '{{ selected_fan_only_hvac }}'
            continue_on_error: false
          - delay:
              milliseconds: 500
          - service: climate.set_fan_mode
            target:
              entity_id: '{{ repeat.item }}'
            data:
              fan_mode: '{{ new_fan_mode }}'
            continue_on_error: false
    - if:
      - condition: template
        value_template: '{{ fan_mode_changed and not (rest_uses_ceiling_fan | bool) and helper_last_fan_change
          not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_last_fan_change }}'
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - conditions:
    - condition: template
      value_template: '{{ bed_eco_should_return }}'
    # v9.20.0: bed_active (bed occupied, within the Bed Absence Grace, or the bed sensor
    # dropping out while a bed mode runs).
    - condition: template
      value_template: '{{ bed_active | bool }}'
    - condition: template
      value_template: '{{ time_since_change >= (runtime_min | float(0)) }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F6CF️❄️ {{ room_name | upper }} BED ECO FAN-ONLY → RETURN
            TO COOLING\nTemperature Rise:\n    • Current: {{ current_temp }}°C\n    •
            Target: {{ target_temp }}°C\n    • Threshold: {{ (target_temp + bed_eco_return_threshold)
            | round(1) }}°C\n    • Rose: {{ (current_temp - target_temp) | round(1)
            }}°C above target\n\nAction: Returning to bed_comfort_eco for active cooling\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_change }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_mode not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_mode }}'
        data:
          value: bed_comfort_eco
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "[EVENT] {{ room_name }} 🛏️ | Bed Eco → Resuming Cooling | Room {{
            current_temp }}°C exceeded threshold {{ (target_temp + bed_eco_return_threshold)
            | round(1) }}°C"
          level: warning
    # v9.18.0: command the unit here. The continue-cooling branch used to do it on the
    # next check, but that branch only ran while the room was at or below the comfort
    # ceiling, and a return point above the ceiling (return threshold wider than the
    # comfort width) never got there, so a unit that the ceiling_fan rest phase had
    # turned OFF stayed off. Helpers first, device calls last (H11).
    - variables:
        bed_return_hvac: "{% set modes = (state_attr(climate_list[0], 'hvac_modes') or []) | list %}{% if 'cool' in modes %}cool{% elif 'Cool' in modes %}Cool{% else %}cool{% endif %}"
    - if:
      - condition: template
        value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: '{{ bed_return_hvac }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_temp not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_expected_temp }}'
        data:
          value: '{{ adjusted_target }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_fan }}'
        data:
          value: '{{ new_fan_mode }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ fan_mode_changed and helper_last_fan_change not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_last_fan_change }}'
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        continue_on_error: true
    - repeat:
        for_each: '{{ climate_list }}'
        sequence:
        - service: climate.set_temperature
          target:
            entity_id: '{{ repeat.item }}'
          data:
            temperature: '{{ adjusted_target }}'
            hvac_mode: '{{ bed_return_hvac }}'
          continue_on_error: true
        # v9.20.0 (round 3): the AC fan only when it differs (it was re-sent unchanged).
        - if:
          - condition: template
            value_template: '{{ (state_attr(repeat.item, ''fan_mode'') | string | trim) != (new_fan_mode | string | trim) }}'
          then:
          - delay:
              milliseconds: 500
          - service: climate.set_fan_mode
            target:
              entity_id: '{{ repeat.item }}'
            data:
              fan_mode: '{{ new_fan_mode }}'
            continue_on_error: true
  # v9.18.0: while the ceiling_fan rest phase holds the room (AC off), keep the ceiling
  # fan at the speed the in-bed rule wants (low near target, medium as it warms, capped).
  # v9.20.0: also completes a hand-over that was cut short (AC still on: turn-off re-issued;
  # fan off: switched on), respects a fan override, and treats an on/off fan that is on as
  # at speed (it matched every run and blocked the branches below for the whole rest).
  - conditions:
    - condition: template
      value_template: "{{ last_mode == 'bed_eco_fan_only' and bed_eco_fan_only_mode == 'ceiling_fan'
        and ceiling_fan_configured }}"
    - condition: template
      value_template: "{{ actual_ac_state == 'on' or (not fan_override_active and (bed_active | bool) and not
        (ceiling_fan_bed_blocked | bool) and not (ceiling_fan_at_target_speed | bool)) }}"
    sequence:
    - if:
      - condition: template
        value_template: '{{ not fan_override_active and (bed_active | bool) and not (ceiling_fan_bed_blocked | bool)
          and not (ceiling_fan_at_target_speed | bool) }}'
      then:
      - if:
        - condition: template
          value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_ceiling_fan }}'
          data:
            value: 'on'
          continue_on_error: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
            then:
            - if:
              - condition: template
                value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
              then:
              - service: switch.turn_off
                target:
                  entity_id: '{{ ceiling_fan_other_switches }}'
                continue_on_error: true
            - delay:
                milliseconds: 100
            - service: switch.turn_on
              target:
                entity_id: '{{ ceiling_fan_target_switch }}'
              continue_on_error: true
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_domain == ''fan'' }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ not (ceiling_fan_is_on | bool) }}'
            then:
            - service: fan.turn_on
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
            - delay:
                milliseconds: 500
          - if:
            - condition: template
              value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
            then:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ ceiling_fan_has_presets }}'
                sequence:
                - service: fan.set_preset_mode
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  data:
                    preset_mode: '{{ ceiling_fan_target_speed }}'
                  continue_on_error: true
              default:
              - service: fan.set_percentage
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                data:
                  percentage: '{{ ceiling_fan_target_pct }}'
                continue_on_error: true
        default:
        - if:
          - condition: template
            value_template: '{{ not (ceiling_fan_is_on | bool) }}'
          then:
          - service: homeassistant.turn_on
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ event_logging_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "[EVENT] {{ room_name }} 🛏️ | Bed Eco Rest: Ceiling Fan {{ ceiling_fan_target_speed }} | Room {{ current_temp }}°C, Target {{ target_temp }}°C, compressor back on above {{ (target_temp + bed_eco_return_threshold) | round(1) }}°C"
            level: warning
    - if:
      - condition: template
        value_template: "{{ actual_ac_state == 'on' }}"
      then:
      - if:
        - condition: template
          value_template: '{{ event_logging_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "[EVENT] {{ room_name }} 🛏️ | Bed Eco Rest: AC still on, turning it off again | Room {{ current_temp }}°C"
            level: warning
      - if:
        - condition: template
          value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_hvac }}'
          data:
            value: 'off'
          continue_on_error: true
      - service: climate.turn_off
        target:
          entity_id: '{{ climate_list }}'
        continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ should_activate }}'
    - condition: template
      value_template: "{# v9.8.0: Only transition to fan_only if AC was actually cooling/heating #}\n
        {# Don't turn AC ON from off just because ceiling fan brought room to comfort zone #}\n
        {{ last_mode in ['cooling', 'heating', 'bed_comfort_eco', 'bed_comfort_quiet']
        or actual_ac_state == 'on' }}\n"
    - condition: template
      # v9.20.0: a cooling or heating run stops at the target whatever the overshoot setting
      # (with 'none' it counted as reached anywhere in the band: 04/10 the Living Room was
      # switched off at 22.3 against a 22 target).
      value_template: "{% set in_comfort_zone = current_temp >= comfort_min_temp and current_temp
        <= comfort_max_temp %} {% set overshoot_reached = true %} {% if last_mode in ['cooling',
        'bed_comfort_eco', 'bed_comfort_quiet'] %}{% set overshoot_reached = current_temp <= (target_temp
        - target_overshoot) %}{% elif last_mode == 'heating' %}{% set overshoot_reached = current_temp
        >= (target_temp + target_overshoot) %}{% endif %} {{ in_comfort_zone and overshoot_reached }}"
    # v9.20.0: eco keeps the unit running, so it does not wait for the minimum runtime.
    - condition: template
      value_template: '{{ time_since_change > (runtime_min | float(0)) or (comfort_zone_action == ''eco'' and actual_ac_state
        == ''on'') }}'
    - condition: template
      value_template: "{{ not (bed_comfort_mode != 'off' and (bed_active | bool)) }}"
    # v9.20.0: once in its own eco or fan-only state it does not re-send them every run (the
    # fan-only upkeep branch below keeps that state).
    - condition: template
      # v9.20.0 (round 3): eco is re-entered when a unit is not on the eco setpoint (a failed
      # command left it at the pull-down setpoint, e.g. 18.0, with nothing to correct it).
      value_template: "{{ not (comfort_zone_action == 'eco' and last_mode == 'eco' and not (comfort_eco_needs_send
        | bool)) and not (comfort_zone_action == 'fan_only' and last_mode == 'comfort_fan_only') }}"
    sequence:
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "[EVENT] {{ room_name }} ✅ | Comfort Zone Reached: {{ comfort_zone_action
            | replace('_', ' ') | title }} | Room {{ current_temp }}°C in zone {{ comfort_min_temp
            }}-{{ comfort_max_temp }}°C, was {{ last_mode | replace('_', ' ') | title }}"
          level: warning
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F50D {{ room_name | upper }} CLIMATE DEBUG: Comfort Zone
            Action Triggered\n\U0001F39B️ Control Status:\n    • Control Mode: {{
            control_mode }}\n    • Should Activate: {{ should_activate }}\n    • Extreme
            Temp Detected: {{ extreme_temp_detected }}\n    • Current Temp: {{ current_temp
            }}°C\n    • Extreme High: {{ extreme_high }}°C\n    • Extreme Low: {{
            extreme_low }}°C\n    • Room Presence: {{ room_presence_detected }}\n
            \   • Approaching Home: {{ approaching_home }}\n"
          level: warning
    # v9.20.0: Fan at Target. replace_ac keeps the ceiling fan going at the room's speed, off
    # switches it off, unchanged leaves it alone ('unchanged' used to behave like 'off'). With
    # the AC going to fan-only the ceiling fan is switched off as before.
    - if:
      - condition: template
        value_template: "{{ ceiling_fan_configured and not fan_override_active and (ceiling_fan_is_on | bool)
          and comfort_zone_action == 'fan_only' }}"
      then:
      - if:
        - condition: template
          value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_ceiling_fan }}'
          data:
            value: 'off'
          continue_on_error: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - service: switch.turn_off
            target:
              entity_id:
              - '{{ ceiling_fan_low_switch }}'
              - '{{ ceiling_fan_medium_switch }}'
              - '{{ ceiling_fan_high_switch }}'
            continue_on_error: true
        default:
        - service: homeassistant.turn_off
          target:
            entity_id: '{{ ceiling_fan_entities }}'
          continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and comfort_zone_action != ''fan_only'' and last_mode != ''heating'' and states(climate_list[0]) != ''heat'' and not (ceiling_fan_bed_blocked | bool) }}'
      then:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ fan_at_target_temp == ''replace_ac'' }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_ceiling_fan }}'
              data:
                value: 'on'
              continue_on_error: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_speed_switches }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - if:
                  - condition: template
                    value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
                  then:
                  - service: switch.turn_off
                    target:
                      entity_id: '{{ ceiling_fan_other_switches }}'
                    continue_on_error: true
                - delay:
                    milliseconds: 100
                - service: switch.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_target_switch }}'
                  continue_on_error: true
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_domain == ''fan'' }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ not (ceiling_fan_is_on | bool) }}'
                then:
                - service: fan.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  continue_on_error: true
                - delay:
                    milliseconds: 500
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ ceiling_fan_has_presets }}'
                    sequence:
                    - service: fan.set_preset_mode
                      target:
                        entity_id: '{{ ceiling_fan_entities }}'
                      data:
                        preset_mode: '{{ ceiling_fan_target_speed }}'
                      continue_on_error: true
                  default:
                  - service: fan.set_percentage
                    target:
                      entity_id: '{{ ceiling_fan_entities }}'
                    data:
                      percentage: '{{ ceiling_fan_target_pct }}'
                    continue_on_error: true
            default:
            - if:
              - condition: template
                value_template: '{{ not (ceiling_fan_is_on | bool) }}'
              then:
              - service: homeassistant.turn_on
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                continue_on_error: true
        - conditions:
          - condition: template
            value_template: '{{ fan_at_target_temp == ''off'' and (ceiling_fan_is_on | bool) }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_ceiling_fan }}'
              data:
                value: 'off'
              continue_on_error: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_speed_switches }}'
              sequence:
              - service: switch.turn_off
                target:
                  entity_id:
                  - '{{ ceiling_fan_low_switch }}'
                  - '{{ ceiling_fan_medium_switch }}'
                  - '{{ ceiling_fan_high_switch }}'
                continue_on_error: true
            default:
            - service: homeassistant.turn_off
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
    # H13: debug-only log moved OUT of the comfort-zone choose (it was branch 2 with
    # only a {{ debug_enabled }} condition, so with debug ON it matched first and
    # shadowed the fan_only/off action branches). Now a standalone debug step BEFORE
    # the choose so the real action branches always run.
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F50D {{ room_name | upper }} COMFORT ZONE BLOCK EVALUATION\n\U0001F4CA
            Settings:\n    • comfort_zone_action: \"{{ comfort_zone_action }}\"\n
            \   • last_mode: \"{{ last_mode }}\"\n    • actual_ac_state: \"{{ actual_ac_state
            }}\"\n    • current_temp: {{ current_temp }}°C\n    • comfort_zone:
            {{ comfort_min_temp }}-{{ comfort_max_temp }}°C\n\n\U0001F3AF Which
            block will match?\n    • comfort_zone_action == 'off': {{ comfort_zone_action
            == 'off' }}\n    • comfort_zone_action == 'eco': {{ comfort_zone_action
            == 'eco' }}\n    • comfort_zone_action == 'fan_only' AND last_mode in
            active modes: {{ comfort_zone_action == 'fan_only' and last_mode in
            ['cooling', 'heating', 'bed_comfort_eco', 'bed_comfort_quiet', 'bed_eco_fan_only',
            'comfort_fan_only', 'stability_fan_only', 'ceiling_fan_cooling'] }}\n
            \   • comfort_zone_action == 'fan_only' AND last_mode NOT in active
            modes: {{ comfort_zone_action == 'fan_only' and last_mode not in ['cooling',
            'heating', 'bed_comfort_eco', 'bed_comfort_quiet', 'bed_eco_fan_only',
            'comfort_fan_only', 'stability_fan_only', 'ceiling_fan_cooling'] }}\n"
          level: warning
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ comfort_zone_action == ''eco'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F6A8 {{ room_name | upper }} ECO MODE BLOCK ACTIVATED\n\U0001F4CA
                Debug Info:\n    • comfort_zone_action: {{ comfort_zone_action }}\n
                \   • Should be 'eco' to match: {{ comfort_zone_action == 'eco' }}\n
                \   • last_mode: {{ last_mode }}\n    • This block should NOT execute
                if comfort_zone_action != 'eco'!\n"
              level: warning
        - variables:
            entity_for_calculation: '{{ climate_list[0] }}'
            available_modes_calc: '{{ (state_attr(climate_list[0], ''hvac_modes'') or [])
              | list }}'
            available_fans_calc: '{{ (state_attr(climate_list[0], ''fan_modes'') or []) |
              list }}'
            expected_hvac_mode_calc: "{% set modes = (state_attr(climate_list[0], 'hvac_modes') or [])
              | list %} {% if enable_cooling and enable_heating and 'auto' in modes
              %}\n  auto\n{% elif enable_cooling and enable_heating and 'Auto' in
              modes %}\n  Auto\n{% elif enable_cooling and enable_heating and 'heat_cool'
              in modes %}\n  heat_cool\n{% elif enable_cooling and enable_heating
              and 'Heat/Cool' in modes %}\n  Heat/Cool\n{% elif enable_cooling and
              'cool' in modes %}\n  cool\n{% elif enable_cooling and 'Cool' in modes
              %}\n  Cool\n{% elif enable_heating and 'heat' in modes %}\n  heat\n{%
              elif enable_heating and 'Heat' in modes %}\n  Heat\n{% else %}\n  off\n{%
              endif %}\n"
            expected_fan_mode_calc: '{{ new_fan_mode }}'
            # v9.20.0: eco holds the target (corrected for the AC sensor offset), not the cooling
            # run's last pull-down setpoint, which it then kept for ever.
            eco_setpoint: '{{ comfort_eco_setpoint | float(0) }}'
        - service: input_text.set_value
          target:
            entity_id: !input helper_last_mode
          data:
            value: eco
          continue_on_error: true
        # v9.20.0 (round 3): the mode clock with the label, before the slow commands (it was
        # stamped after them).
        - if:
          - condition: template
            value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] and last_mode != ''eco'' }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_mode_time }}'
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: '{{ expected_hvac_mode_calc }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_temp not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_expected_temp }}'
            data:
              value: '{{ eco_setpoint }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_fan }}'
            data:
              value: '{{ expected_fan_mode_calc }}'
            continue_on_error: true
        - delay:
            milliseconds: 200
        # LOW-dead-repeat-loop: removed a no-op repeat that computed expected_hvac_mode
        # but issued no service call; the real command loop follows below.
        # LOW-temp-set-log: gate this WARNING behind debug_enabled (ran every eco cycle).
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F321️ {{ room_name | upper }} TEMP SET: Comfort Zone Maintenance
                (ECO Mode) Set AC to: {{ target_temp | round(0) }}°C (rounded for AC
                compatibility) Actual value: {{ target_temp | round(1) }}°C Reason:
                Maintaining target temperature within comfort zone Current: {{ current_temp
                | round(1) }}°C → Target: {{ target_temp | round(1) }}°C\n"
              level: warning
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - variables:
                current_entity: '{{ repeat.item }}'
                available_modes: '{{ (state_attr(repeat.item, ''hvac_modes'') or []) | list
                  }}'
                available_fans: '{{ (state_attr(repeat.item, ''fan_modes'') or []) | list
                  }}'
                selected_hvac_mode: "{% set modes = (state_attr(repeat.item, 'hvac_modes') or [])
                  | list %} {# For stability, prefer auto/heat_cool only if both enabled
                  #} {% if enable_cooling and enable_heating and 'auto' in modes %}\n
                  \ auto\n{% elif enable_cooling and enable_heating and 'Auto' in
                  modes %}\n  Auto\n{% elif enable_cooling and enable_heating and
                  'heat_cool' in modes %}\n  heat_cool\n{% elif enable_cooling and
                  enable_heating and 'Heat/Cool' in modes %}\n  Heat/Cool\n{% elif
                  enable_cooling and 'cool' in modes %}\n  cool\n{% elif enable_cooling
                  and 'Cool' in modes %}\n  Cool\n{% elif enable_heating and 'heat'
                  in modes %}\n  heat\n{% elif enable_heating and 'Heat' in modes
                  %}\n  Heat\n{% else %}\n  off\n{% endif %}\n"
                selected_fan_mode: "{% if is_precond_mode and precond_validated_fan_mode
                  != 'Dynamic' %}\n  {{ precond_validated_fan_mode }}\n{% else %}\n
                  \ {{ new_fan_mode }}\n{% endif %}\n"
            # v9.20.0 (round 3): only what differs is sent.
            - if:
              - condition: template
                value_template: '{{ states(current_entity) != selected_hvac_mode or ((state_attr(current_entity,
                  ''temperature'') | float(-99)) - (eco_setpoint | float(0))) | abs >= 0.3 }}'
              then:
              - service: climate.set_temperature
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  temperature: '{{ eco_setpoint }}'
                  hvac_mode: '{{ selected_hvac_mode }}'
                continue_on_error: false
              - delay:
                  milliseconds: 500
            - if:
              - condition: template
                value_template: '{{ (state_attr(current_entity, ''fan_mode'') | string | trim) != (selected_fan_mode | string
                  | trim) }}'
              then:
              - service: climate.set_fan_mode
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  fan_mode: '{{ selected_fan_mode }}'
                continue_on_error: false
              - delay:
                  milliseconds: 500
            - if:
              - condition: template
                value_template: '{{ validated_swing_mode not in [''none'', '''', ''unavailable'',
                  ''unknown''] }}'
              then:
              # v9.14.0 (bug 3): swing is a fixed input; only send it when the unit differs.
              - if:
                - condition: template
                  value_template: '{{ validated_swing_mode != ''none'' and state_attr(current_entity, ''swing_mode'') != validated_swing_mode }}'
                then:
                - service: climate.set_swing_mode
                  target:
                    entity_id: '{{ current_entity }}'
                  data:
                    swing_mode: '{{ validated_swing_mode }}'
                  continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and helper_last_fan_change not in
              [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_last_fan_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ enable_notifications }}'
          then:
          - repeat:
              for_each: '{{ notify_services_all }}'
              sequence:
              - service: '{{ repeat.item }}'
                data:
                  title: '{{ room_name }} Climate Control'
                  message: Eco mode - Comfort zone ({{ current_temp }}°C)
                continue_on_error: true
      - conditions:
        - condition: template
          value_template: '{{ comfort_zone_action == ''fan_only'' }}'
        - condition: template
          value_template: '{{ last_mode not in [''cooling'', ''heating'', ''bed_comfort_eco'',
            ''bed_comfort_quiet'', ''bed_eco_fan_only'', ''comfort_fan_only'', ''stability_fan_only'',
            ''ceiling_fan_cooling''] }}

            '
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ (states(climate_list[0]) in ['fan_only', 'dry']
                or actual_ac_state == 'on')\n   and last_mode not in ['smart_off',
                'off', 'smart_eco', 'smart_maintain', 'away_off', 'away_eco', 'auto_off_off',
                'auto_off_eco', 'auto_off_fan_only'] }}\n"
            sequence:
            - if:
              - condition: template
                value_template: '{{ debug_enabled }}'
              then:
              - service: system_log.write
                data:
                  message: "\U0001F504 {{ room_name | upper }} STATE SYNC: AC already
                    in fan-like mode\n\U0001F4CA Current State:\n    • AC HVAC Mode:
                    {{ states(climate_list[0]) }}\n    • AC Power State: {{ actual_ac_state
                    }}\n    • last_mode helper: {{ last_mode }}\n    • comfort_zone_action:
                    {{ comfort_zone_action }}\n\n\U0001F527 Action:\n    • Syncing
                    helper_last_mode to 'comfort_fan_only'\n    • AC will remain ON
                    in current mode\n"
                  level: warning
            - service: input_text.set_value
              target:
                entity_id: !input helper_last_mode
              data:
                value: comfort_fan_only
            - service: input_datetime.set_datetime
              target:
                entity_id: !input helper_last_change
              data:
                datetime: '{{ now() }}'
              continue_on_error: true
          default:
          - if:
            - condition: template
              value_template: '{{ debug_enabled }}'
            then:
            - service: system_log.write
              data:
                message: "\U0001F6AB {{ room_name | upper }} COMFORT FAN-ONLY BLOCKED\n\U0001F4CA
                  Reason: {{ 'Shutdown sequence in progress - helper shows deliberate
                  off state' if last_mode in ['smart_off', 'off', 'smart_eco', 'smart_maintain',
                  'away_off', 'away_eco'] else 'No prior cooling/heating mode detected'
                  }}\n    • Current temp: {{ current_temp }}°C (in comfort zone: {{
                  comfort_min_temp }}-{{ comfort_max_temp }}°C)\n    • last_mode:
                  {{ last_mode }}\n    • AC HVAC mode: {{ states(climate_list[0])
                  }}\n    • AC state: {{ actual_ac_state }}\n\n\U0001F4A1 {% if last_mode
                  in ['smart_off', 'off', 'smart_eco', 'smart_maintain', 'away_off',
                  'away_eco'] %}\n   Daikin AC may briefly show fan_only during shutdown
                  sequence. Ignoring to prevent cycling.\n   {% else %}\n   Fan-only
                  mode only activates AFTER cooling/heating brings temperature to
                  comfort zone.\n   {% endif %}\n"
                level: warning
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_last_change
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
          - service: input_text.set_value
            target:
              entity_id: !input helper_last_mode
            data:
              value: 'off'
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_mode_start_time
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ helper_last_command not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - variables:
                update_snapshot: hvac=off,temp=0,fan=unknown,swing=unknown
                update_checksum: '0'
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_last_command }}'
              data:
                value: '{{ update_snapshot }}'
              continue_on_error: true
            - service: input_number.set_value
              target:
                entity_id: '{{ helper_state_checksum }}'
              data:
                value: '{{ update_checksum }}'
              continue_on_error: true
            - if:
              - condition: template
                value_template: '{{ helper_change not in [none, '''', ''unavailable'',
                  ''unknown''] }}'
              then:
              - service: input_datetime.set_datetime
                target:
                  entity_id: '{{ helper_change }}'
                data:
                  datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
                continue_on_error: true
            - if:
              - condition: template
                value_template: '{{ debug_enabled }}'
              then:
              - service: system_log.write
                data:
                  message: "\U0001F4F8 {{ room_name | upper }} SNAPSHOT UPDATED (Pre-command
                    - Turn OFF Fallback)\n    • New Snapshot: {{ update_snapshot }}\n"
                  level: warning
          - if:
            - condition: template
              value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_hvac }}'
              data:
                value: 'off'
              continue_on_error: true
          # LOW-turnoff-continue-on-error: helpers were already written 'off' above;
          # if the device times out, do NOT abort the run - coordinator polling reconciles.
          - service: climate.turn_off
            target:
              entity_id: !input climate_entities
            continue_on_error: true
      - conditions:
        - condition: template
          value_template: '{{ comfort_zone_action == ''fan_only'' }}'
        - condition: template
          value_template: '{{ last_mode in [''cooling'', ''heating'', ''bed_comfort_eco'',
            ''bed_comfort_quiet'', ''bed_eco_fan_only'', ''comfort_fan_only'', ''stability_fan_only'',
            ''ceiling_fan_cooling''] }}

            '
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_change not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_last_change
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - service: input_text.set_value
          target:
            entity_id: !input helper_last_mode
          data:
            value: comfort_fan_only
        - delay:
            milliseconds: 200
        - variables:
            entity_for_check: '{{ climate_list[0] }}'
            available_modes: '{{ (state_attr(entity_for_check, ''hvac_modes'') or []) | list
              }}'
            selected_fan_only_hvac: "{% set modes = (state_attr(entity_for_check, 'hvac_modes') or [])
              | list %} {% if 'fan_only' in modes %}\n  fan_only\n{% elif 'fan-only'
              in modes %}\n  fan-only\n{% elif 'Fan Only' in modes %}\n  Fan Only\n{%
              elif 'dry' in modes %}\n  dry\n{% else %}\n  off\n{% endif %}\n"
            supports_fan_only: '{{ selected_fan_only_hvac in [''fan_only'', ''fan-only'',
              ''Fan Only'', ''dry''] }}'
        # LOW-expected-hvac-literal: write the ACTUALLY-commanded variant (selected_fan_only_hvac
        # may resolve to fan-only/Fan Only/dry/off), not the literal 'fan_only'.
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: '{{ selected_fan_only_hvac }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F32C️ {{ room_name | upper }} COMFORT ZONE → FAN-ONLY
                MODE\n\U0001F4CA Temperature Status:\n    • Current: {{ current_temp
                | round(1) }}°C\n    • Comfort zone: {{ comfort_min_temp }}-{{ comfort_max_temp
                }}°C\n    • In comfort zone: True\n\n⚡ Fan-Only Activation:\n    •
                Switching from: {{ last_mode | upper }}\n    • Target HVAC mode: {{
                selected_fan_only_hvac }}\n    • User selected fan speed: {{ fan_only_fan_speed_setting
                }}\n    • Mapped to AC fan mode: {{ selected_fan_only_fan_mode }}\n
                \   • AC supports fan_only: {{ supports_fan_only }}\n\n\U0001F4B0
                Expected Savings:\n    • Power reduction: ~85% (compressor OFF, fan
                only)\n    • Will return to cooling/heating if temp exits comfort
                zone\n\n\U0001F6E1️ Manual Override Protection:\n    • helper_change
                updated: {{ now() }}\n    • helper_expected_hvac: fan_only\n    •
                Safe from false manual override detection\n"
              level: warning
        - if:
          - condition: template
            value_template: '{{ supports_fan_only }}'
          then:
          - if:
            - condition: template
              value_template: '{{ debug_enabled }}'
            then:
            - service: system_log.write
              data:
                message: "\U0001F6A8 {{ room_name | upper }} ABOUT TO CALL climate.set_temperature\n\U0001F4CA
                  EXACT Values Being Passed:\n    • entity_id: {{ climate_list[0]
                  }}\n    • temperature: {{ target_temp }}\n    • hvac_mode: \"{{
                  selected_fan_only_hvac }}\"\n    • Is string: {{ selected_fan_only_hvac
                  is string }}\n    • Length: {{ selected_fan_only_hvac | length }}\n
                  \   • Raw value: {{ selected_fan_only_hvac | tojson }}\n\n\U0001F50D
                  Variable Calculation:\n    • available_modes from AC: {{ (state_attr(climate_list[0],
                  'hvac_modes') or []) | list }}\n    • 'fan_only' in modes: {{ 'fan_only'
                  in (state_attr(climate_list[0], 'hvac_modes') or []) | list }}\n    • selected_fan_only_hvac
                  result: {{ selected_fan_only_hvac }}\n"
                level: warning
          - repeat:
              for_each: '{{ climate_list }}'
              sequence:
              - service: climate.set_temperature
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  temperature: '{{ target_temp }}'
                  hvac_mode: '{{ selected_fan_only_hvac }}'
                continue_on_error: false
              - delay:
                  milliseconds: 500
              - service: climate.set_fan_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  fan_mode: '{{ selected_fan_only_fan_mode }}'
                continue_on_error: false
          - if:
            - condition: template
              value_template: '{{ fan_mode_changed and helper_last_fan_change not
                in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_datetime.set_datetime
              target:
                entity_id: '{{ helper_last_fan_change }}'
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_fan }}'
              data:
                value: '{{ selected_fan_only_fan_mode }}'
              continue_on_error: true
          - delay:
              seconds: 2
          - if:
            - condition: template
              value_template: '{{ debug_enabled }}'
            then:
            - service: system_log.write
              data:
                message: "✅ {{ room_name | upper }} FAN-ONLY MODE ACTIVATED - STATE
                  VERIFICATION\n\U0001F4CA AC State After Commands:\n    • HVAC Mode:
                  {{ states(climate_list[0]) }}\n    • Fan Mode: {{ state_attr(climate_list[0],
                  'fan_mode') }}\n    • Temperature: {{ state_attr(climate_list[0],
                  'current_temperature') }}°C\n\n\U0001F3AF What Was Sent:\n    •
                  User Selection: {{ fan_only_fan_speed_setting }}\n    • Mapped Fan
                  Mode: {{ selected_fan_only_fan_mode }}\n    • HVAC Mode: {{ selected_fan_only_hvac
                  }}\n\n✅ Verification:\n    • Expected HVAC: {{ selected_fan_only_hvac
                  }}\n    • Actual HVAC: {{ states(climate_list[0]) }}\n    • Match:
                  {{ states(climate_list[0]) == selected_fan_only_hvac }}\n    • Expected
                  Fan: {{ selected_fan_only_fan_mode }}\n    • Actual Fan: {{ state_attr(climate_list[0],
                  'fan_mode') }}\n    • Match: {{ state_attr(climate_list[0], 'fan_mode')
                  == selected_fan_only_fan_mode }}\n"
                level: warning
          else:
          - if:
            - condition: template
              value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_hvac }}'
              data:
                value: 'off'
              continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ helper_last_command not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_last_command }}'
              data:
                value: hvac=off,temp=0,fan=unknown,swing=unknown
              continue_on_error: true
            - service: input_number.set_value
              target:
                entity_id: '{{ helper_state_checksum }}'
              data:
                value: '0'
              continue_on_error: true
          - service: climate.turn_off
            target:
              entity_id: !input climate_entities
            continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ debug_enabled }}'
            then:
            - service: system_log.write
              data:
                message: '⚠️ {{ room_name | upper }} FAN-ONLY MODE NOT SUPPORTED

                  AC doesn''t support fan_only mode. Available modes: {{ available_modes
                  | join('', '') }}

                  Falling back to turning AC OFF instead.

                  Recommendation: Change "Action When Comfort Zone Reached" to "OFF"
                  or "ECO" in automation settings.

                  '
                level: warning
      default:
      - if:
        - condition: template
          value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
            }}'
        then:
        - service: input_datetime.set_datetime
          target:
            entity_id: !input helper_last_change
          data:
            datetime: '{{ now() }}'
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
            ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_hvac }}'
          data:
            value: 'off'
          continue_on_error: true
      - service: input_text.set_value
        target:
          entity_id: !input helper_last_mode
        data:
          value: 'off'
      - if:
        - condition: template
          value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
            }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_last_command }}'
          data:
            value: hvac=off,temp=0,fan=unknown,swing=unknown
          continue_on_error: true
        - service: input_number.set_value
          target:
            entity_id: '{{ helper_state_checksum }}'
          data:
            value: '0'
          continue_on_error: true
      # v9.20.0: mode clock BEFORE the slow command (a restart during it lost the stamp,
      # 04/10 15:21, and with it the off-time protection).
      - service: input_datetime.set_datetime
        target:
          entity_id: !input helper_mode_start_time
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ actual_ac_state == ''on'' }}'
        then:
        - service: climate.turn_off
          target:
            entity_id: !input climate_entities
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ enable_notifications }}'
        then:
        - repeat:
            for_each: '{{ notify_services_all }}'
            sequence:
            - service: '{{ repeat.item }}'
              data:
                title: '{{ room_name }} Climate Control'
                message: Turned off - Comfort zone ({{ current_temp }}°C)
              continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ last_mode in [''stability_fan_only'', ''comfort_fan_only'']
        }}'
    - condition: template
      value_template: '{{ control_mode in [''Smart'', ''Auto''] }}'
    # v9.20.0: the room must be wanted (in Auto with nobody home it kept the AC fan running
    # and Away never ran).
    - condition: template
      value_template: '{{ should_activate | bool }}'
    - condition: template
      value_template: '{{ current_temp >= comfort_min_temp and current_temp <= comfort_max_temp
        }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ current_temp >= comfort_min_temp and current_temp <=
            comfort_max_temp }}'
        sequence:
        - variables:
            selected_fan_only_hvac: "{% set modes = (state_attr(climate_list[0], 'hvac_modes') or [])
              | list %} {% if 'fan_only' in modes %}\n  fan_only\n{% elif 'fan-only'
              in modes %}\n  fan-only\n{% elif 'Fan Only' in modes %}\n  Fan Only\n{%
              elif 'dry' in modes %}\n  dry\n{% else %}\n  off\n{% endif %}\n"
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F32C️ {{ room_name | upper }} FAN-ONLY MAINTAIN MODE\n\U0001F4CA
                Status:\n    • Current Mode: {{ last_mode | upper }}\n    • Temperature:
                {{ current_temp | round(1) }}°C (comfort: {{ comfort_min_temp }}-{{
                comfort_max_temp }}°C)\n    • Current HVAC: {{ states(climate_list[0])
                }}\n    • Current Fan: {{ state_attr(climate_list[0], 'fan_mode')
                }}\n    • Expected Fan: {{ selected_fan_only_fan_mode }}\n    • Match:
                {{ state_attr(climate_list[0], 'fan_mode') == selected_fan_only_fan_mode
                }}\n\n\U0001F527 Action (v3.18.11):\n    • Enforcing HVAC mode: fan_only\n
                \   • Enforcing fan speed: {{ selected_fan_only_fan_mode }}\n"
              level: warning
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - variables:
                current_entity: '{{ repeat.item }}'
                current_hvac: '{{ states(repeat.item) }}'
                current_fan: '{{ state_attr(repeat.item, ''fan_mode'') }}'
                # v9.20.0: compared as text (a numeric fan mode never matched, so it re-sent every run).
                needs_update: '{{ current_hvac != selected_fan_only_hvac or (current_fan | string | trim)
                  != (selected_fan_only_fan_mode | string | trim) }}'
            - if:
              - condition: template
                value_template: '{{ needs_update }}'
              then:
              - if:
                - condition: template
                  value_template: '{{ debug_enabled }}'
                then:
                - service: system_log.write
                  data:
                    message: "\U0001F6A8 {{ room_name | upper }} MAINTENANCE BLOCK
                      - MISMATCH DETECTED\n\U0001F4CA Current State vs Expected:\n
                      \   • Entity: {{ current_entity }}\n    • current_hvac (from
                      HA): \"{{ current_hvac }}\"\n    • selected_fan_only_hvac (target):
                      \"{{ selected_fan_only_hvac }}\"\n    • HVAC Match: {{ current_hvac
                      == selected_fan_only_hvac }}\n    • current_fan: \"{{ current_fan
                      }}\"\n    • selected_fan_only_fan_mode: \"{{ selected_fan_only_fan_mode
                      }}\"\n    • Fan Match: {{ current_fan == selected_fan_only_fan_mode
                      }}\n\n\U0001F527 About to Send:\n    • Will send hvac_mode:
                      \"{{ selected_fan_only_hvac }}\"\n    • Is string: {{ selected_fan_only_hvac
                      is string }}\n    • Raw: {{ selected_fan_only_hvac | tojson
                      }}\n"
                    level: warning
              - if:
                - condition: template
                  value_template: '{{ current_hvac != selected_fan_only_hvac }}'
                then:
                - service: climate.set_temperature
                  target:
                    entity_id: '{{ current_entity }}'
                  data:
                    temperature: '{{ target_temp }}'
                    hvac_mode: '{{ selected_fan_only_hvac }}'
                  continue_on_error: true
                - delay:
                    milliseconds: 500
              - if:
                - condition: template
                  value_template: '{{ (current_fan | string | trim) != (selected_fan_only_fan_mode | string | trim) }}'
                then:
                - if:
                  - condition: template
                    value_template: '{{ helper_last_fan_change not in [none, '''', ''unavailable'', ''unknown''] }}'
                  then:
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: '{{ helper_last_fan_change }}'
                    data:
                      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
                    continue_on_error: true
                - service: climate.set_fan_mode
                  target:
                    entity_id: '{{ current_entity }}'
                  data:
                    fan_mode: '{{ selected_fan_only_fan_mode }}'
                  continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_fan }}'
            data:
              value: '{{ selected_fan_only_fan_mode }}'
            continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ temp_stability_enabled }}'
    # v9.20.0 (round 4): only a running AC (after Room Empty or Away it started an idle unit in a
    # stable room).
    - condition: template
      value_template: '{{ actual_ac_state == ''on'' }}'
    - condition: template
      value_template: '{{ control_mode in [''Smart'', ''Auto''] }}'
    - condition: template
      value_template: "{# v9.8.0: Stability detection requires presence - don't block Room Empty handler #}\n
        {{ should_activate }}\n"
    - condition: template
      value_template: '{{ temp_stability_detected }}'
    - condition: template
      value_template: '{{ last_mode not in [''off'', ''stability_off'', ''stability_eco'',
        ''stability_fan_only'', ''auto_off_off'', ''auto_off_eco'', ''auto_off_fan_only'',
        ''comfort_fan_only'', ''bed_comfort_eco'', ''bed_comfort_quiet'', ''bed_eco_fan_only'',
        ''ceiling_fan_cooling'', ''unavailable'', ''unknown'', none] }}'
    - condition: template
      value_template: '{{ time_since_change >= (runtime_min | float(0)) }}'
    - condition: template
      value_template: "{% set in_comfort_zone = current_temp >= comfort_min_temp and
        current_temp <= comfort_max_temp %} {% set in_continue_mode = (last_mode ==
        'cooling' or last_mode == 'heating') %} {% set overshoot_target_reached =
        false %}\n{% if in_continue_mode %}\n  {% if last_mode == 'cooling' %}\n    {#
        Cooling: target reached when temp <= (target - overshoot) #}\n    {% set overshoot_target_reached
        = current_temp <= (target_temp - target_overshoot) %}\n  {% elif last_mode
        == 'heating' %}\n    {# Heating: target reached when temp >= (target + overshoot)
        #}\n    {% set overshoot_target_reached = current_temp >= (target_temp + target_overshoot)
        %}\n  {% endif %}\n{% endif %}\n{# Allow stability auto-off ONLY if: in comfort
        zone AND (not in continue mode OR overshoot target already reached) #} {{
        in_comfort_zone and (not in_continue_mode or overshoot_target_reached) }}\n"
    sequence:
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F3AF Smart Feature: Temperature Stable & Comfortable \U0001F321️
            Temperature steady at {{ current_temp | round(1) }}°C for {{ time_in_current_mode
            | round(0) }} minutes ✅ Within comfort zone ({{ comfort_min_temp }}-{{
            comfort_max_temp }}°C) - switching to {{ stability_behavior|upper }} mode
            to save energy\n\U0001F4CB Technical: ±{{ stability_tolerance }}°C tolerance,
            {{ stability_duration }}min requirement, {{ time_since_change | round(1)
            }}min since last change\n"
          level: warning
    # v9.20.0: Fan at Target 'off' is honoured here too.
    - if:
      - condition: template
        value_template: "{{ ceiling_fan_configured and not fan_override_active and (ceiling_fan_is_on | bool)
          and fan_at_target_temp == 'off' }}"
      then:
      - if:
        - condition: template
          value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_ceiling_fan }}'
          data:
            value: 'off'
          continue_on_error: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - service: switch.turn_off
            target:
              entity_id:
              - '{{ ceiling_fan_low_switch }}'
              - '{{ ceiling_fan_medium_switch }}'
              - '{{ ceiling_fan_high_switch }}'
            continue_on_error: true
        default:
        - service: homeassistant.turn_off
          target:
            entity_id: '{{ ceiling_fan_entities }}'
          continue_on_error: true
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ ceiling_fan_configured\n   and not fan_override_active\n
            \  and fan_at_target_temp == 'replace_ac'\n   and last_mode in ['cooling',
            'ceiling_fan_cooling'] }}\n"
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_change not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_last_change
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: 'off'
            continue_on_error: true
        - service: input_text.set_value
          target:
            entity_id: !input helper_last_mode
          data:
            value: ceiling_fan_cooling
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] and last_mode != ''ceiling_fan_cooling'' }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_mode_time }}'
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_ceiling_fan }}'
            data:
              value: 'on'
            continue_on_error: true
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ceiling_fan_has_speed_switches }}'
            sequence:
            # M38: break-before-make - release medium+high before energizing low
            - service: switch.turn_off
              target:
                entity_id:
                - '{{ ceiling_fan_medium_switch }}'
                - '{{ ceiling_fan_high_switch }}'
              continue_on_error: true
            - delay:
                milliseconds: 100
            - service: switch.turn_on
              target:
                entity_id: '{{ ceiling_fan_low_switch }}'
              continue_on_error: true
          - conditions:
            - condition: template
              value_template: '{{ ceiling_fan_domain == ''fan'' }}'
            sequence:
            - service: fan.turn_on
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
            - delay:
                milliseconds: 500
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ ceiling_fan_has_presets }}'
                sequence:
                - service: fan.set_preset_mode
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  data:
                    preset_mode: low
                  continue_on_error: true
              default:
              - service: fan.set_percentage
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                data:
                  percentage: 33
                continue_on_error: true
          default:
          - service: homeassistant.turn_on
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            continue_on_error: true
        # v9.20.0: the AC goes off after the fan is on (it used to be the first command).
        - service: climate.turn_off
          target:
            entity_id: !input climate_entities
          continue_on_error: true
        # v9.14.0 (bug 4): snapshot the start-of-fan temperature for Fan Escalation.
        - if:
          - condition: template
            value_template: '{{ helper_fan_entry_temp not in [none, '''', ''unavailable'', ''unknown'']
              }}'
          then:
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_fan_entry_temp }}'
            data:
              value: '{{ current_temp }}'
            continue_on_error: true
        - service: system_log.write
          data:
            message: "\U0001F33F {{ room_name | upper }} ECO TRANSITION: AC → Ceiling
              Fan • Target reached at {{ current_temp | round(1) }}°C • AC turned
              OFF, ceiling fan activated on low • Saving energy while maintaining
              airflow • Will reactivate AC if temp rises above comfort zone\n"
            level: warning
      - conditions:
        - condition: template
          value_template: '{{ stability_behavior == ''off'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_change not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_last_change
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: 'off'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_last_command not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_last_command }}'
            data:
              value: hvac=off,temp=0,fan=unknown,swing=unknown
            continue_on_error: true
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_state_checksum }}'
            data:
              value: '0'
            continue_on_error: true
        - service: input_text.set_value
          target:
            entity_id: !input helper_last_mode
          data:
            value: stability_off
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] and last_mode != ''stability_off'' }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_mode_time }}'
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - service: climate.turn_off
          target:
            entity_id: !input climate_entities
          continue_on_error: true
        - service: system_log.write
          data:
            message: "\U0001F321️ {{ room_name | upper }} TEMP SET: Temperature Stability
              Auto-Off Set AC to: OFF Actual value: OFF Reason: Temperature equilibrium
              reached - AC job complete Stable at: {{ current_temp | round(1) }}°C
              for {{ time_in_current_mode | round(0) }} minutes\n"
            level: warning
      - conditions:
        - condition: template
          value_template: '{{ stability_behavior == ''eco'' }}'
        sequence:
        - service: input_text.set_value
          target:
            entity_id: !input helper_last_mode
          data:
            value: stability_eco
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] and last_mode != ''stability_eco'' }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_mode_time }}'
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - variables:
            expected_temp: "{% if current_temp > comfort_max_temp %}\n  {{ comfort_max_temp
              + 1 }}\n  {% elif current_temp < comfort_min_temp %}\n  {{ comfort_min_temp
              - 1 }}\n  {% else %}\n  {{ target_temp }}\n{% endif %}\n"
        - service: input_number.set_value
          target:
            entity_id: '{{ helper_expected_temp }}'
          data:
            value: '{{ expected_temp }}'
          continue_on_error: true
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - variables:
                current_entity: '{{ repeat.item }}'
                available_modes: '{{ (state_attr(repeat.item, ''hvac_modes'') or []) | list
                  }}'
                available_fans: '{{ (state_attr(repeat.item, ''fan_modes'') or []) | list
                  }}'
                # v9.20.0: only modes that are enabled (it picked heat_cool for a cooling-only room).
                expected_hvac_mode: "{% if enable_cooling and enable_heating and 'auto' in available_modes %}auto{% elif
                  enable_cooling and enable_heating and 'heat_cool' in available_modes %}heat_cool{% elif enable_cooling and
                  'cool' in available_modes and (current_temp >= (target_temp | float(22)) or not enable_heating) %}cool{%
                  elif enable_heating and 'heat' in available_modes %}heat{% elif enable_cooling and 'cool' in available_modes
                  %}cool{% else %}off{% endif %}"
                expected_fan_mode: '{{ new_fan_mode }}'
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_hvac }}'
              data:
                value: '{{ expected_hvac_mode }}'
              continue_on_error: true
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_fan }}'
              data:
                value: '{{ expected_fan_mode }}'
              continue_on_error: true
            - service: climate.set_temperature
              target:
                entity_id: '{{ current_entity }}'
              data:
                temperature: '{{ expected_temp }}'
                hvac_mode: '{{ expected_hvac_mode }}'
              continue_on_error: false
            - delay:
                milliseconds: 500
            - service: climate.set_fan_mode
              target:
                entity_id: '{{ current_entity }}'
              data:
                fan_mode: '{{ expected_fan_mode }}'
              continue_on_error: false
            - delay:
                milliseconds: 500
            # v9.14.0 (bug 3): swing is a fixed input; only send it when the unit differs.
            - if:
              - condition: template
                value_template: '{{ validated_swing_mode != ''none'' and state_attr(current_entity, ''swing_mode'') != validated_swing_mode }}'
              then:
              - service: climate.set_swing_mode
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  swing_mode: '{{ validated_swing_mode }}'
                continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and helper_last_fan_change not in
              [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_last_fan_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
        - service: system_log.write
          data:
            message: "\U0001F321️ {{ room_name | upper }} TEMP SET: Temperature Stability
              Eco Mode Set AC to: {{ expected_temp | round(0) }}°C (rounded for AC
              compatibility) Actual value: {{ expected_temp | round(1) }}°C Reason:
              Temperature stability eco mode (gentle maintenance after equilibrium)
              Current: {{ current_temp | round(1) }}°C → Stable for {{ time_in_current_mode
              | round(0) }} minutes\n"
            level: warning
      - conditions:
        - condition: template
          value_template: '{{ stability_behavior == ''fan_only'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_change not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_last_change
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - service: input_text.set_value
          target:
            entity_id: !input helper_last_mode
          data:
            value: stability_fan_only
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] and last_mode != ''stability_fan_only'' }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_mode_time }}'
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - variables:
            entity_for_check: '{{ climate_list[0] }}'
            available_modes: '{{ (state_attr(entity_for_check, ''hvac_modes'') or []) | list
              }}'
            selected_fan_only_hvac: "{% set modes = (state_attr(entity_for_check, 'hvac_modes') or [])
              | list %} {% if 'fan_only' in modes %}\n  fan_only\n{% elif 'fan-only'
              in modes %}\n  fan-only\n{% elif 'Fan Only' in modes %}\n  Fan Only\n{%
              elif 'dry' in modes %}\n  dry\n{% else %}\n  off\n{% endif %}\n"
            supports_fan_only: '{{ selected_fan_only_hvac in [''fan_only'', ''fan-only'',
              ''Fan Only'', ''dry''] }}'
        # LOW-expected-hvac-literal: write the ACTUALLY-commanded variant, not literal 'fan_only'.
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: '{{ selected_fan_only_hvac }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F32C️ {{ room_name | upper }} STABILITY → FAN-ONLY MODE\n\U0001F4CA
                Temperature Status:\n    • Current: {{ current_temp | round(1) }}°C\n
                \   • Stable for: {{ time_in_current_mode | round(0) }} minutes\n
                \   • Within comfort zone: {{ comfort_min_temp }}-{{ comfort_max_temp
                }}°C\n\n⚡ Fan-Only Activation:\n    • Switching from: {{ last_mode
                | upper }}\n    • Target HVAC mode: {{ selected_fan_only_hvac }}\n
                \   • Target fan speed: {{ selected_fan_only_fan_mode }}\n    • AC
                supports fan_only: {{ supports_fan_only }}\n\n\U0001F4B0 Expected
                Savings:\n    • Power reduction: ~85% (compressor OFF, fan only)\n
                \   • Will return to cooling/heating if temp exits comfort zone\n\n\U0001F6E1️
                Manual Override Protection:\n    • helper_change updated: {{ now()
                }}\n    • helper_expected_hvac: fan_only\n    • Safe from false manual
                override detection\n"
              level: warning
        - if:
          - condition: template
            value_template: '{{ supports_fan_only }}'
          then:
          - if:
            - condition: template
              value_template: '{{ debug_enabled }}'
            then:
            - service: system_log.write
              data:
                message: "\U0001F6A8 {{ room_name | upper }} ABOUT TO CALL climate.set_temperature\n\U0001F4CA
                  EXACT Values Being Passed:\n    • entity_id: {{ climate_list[0]
                  }}\n    • temperature: {{ target_temp }}\n    • hvac_mode: \"{{
                  selected_fan_only_hvac }}\"\n    • Is string: {{ selected_fan_only_hvac
                  is string }}\n    • Length: {{ selected_fan_only_hvac | length }}\n
                  \   • Raw value: {{ selected_fan_only_hvac | tojson }}\n\n\U0001F50D
                  Variable Calculation:\n    • available_modes from AC: {{ (state_attr(climate_list[0],
                  'hvac_modes') or []) | list }}\n    • 'fan_only' in modes: {{ 'fan_only'
                  in (state_attr(climate_list[0], 'hvac_modes') or []) | list }}\n    • selected_fan_only_hvac
                  result: {{ selected_fan_only_hvac }}\n"
                level: warning
          - repeat:
              for_each: '{{ climate_list }}'
              sequence:
              - service: climate.set_temperature
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  temperature: '{{ target_temp }}'
                  hvac_mode: '{{ selected_fan_only_hvac }}'
                continue_on_error: false
              - delay:
                  milliseconds: 500
              - service: climate.set_fan_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  fan_mode: '{{ selected_fan_only_fan_mode }}'
                continue_on_error: false
          - if:
            - condition: template
              value_template: '{{ fan_mode_changed and helper_last_fan_change not
                in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_datetime.set_datetime
              target:
                entity_id: '{{ helper_last_fan_change }}'
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_fan }}'
              data:
                value: '{{ selected_fan_only_fan_mode }}'
              continue_on_error: true
          - service: system_log.write
            data:
              message: "\U0001F321️ {{ room_name | upper }} TEMP SET: Temperature
                Stability Fan-Only Mode Set AC to: FAN_ONLY Fan speed: {{ selected_fan_only_fan_mode
                }} Reason: Temperature equilibrium reached - switching to fan-only
                for power savings Stable at: {{ current_temp | round(1) }}°C for {{
                time_in_current_mode | round(0) }} minutes\n"
              level: warning
          else:
          - if:
            - condition: template
              value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_hvac }}'
              data:
                value: 'off'
              continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ helper_last_command not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_last_command }}'
              data:
                value: hvac=off,temp=0,fan=unknown,swing=unknown
              continue_on_error: true
            - service: input_number.set_value
              target:
                entity_id: '{{ helper_state_checksum }}'
              data:
                value: '0'
              continue_on_error: true
          - service: climate.turn_off
            target:
              entity_id: !input climate_entities
            continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ debug_enabled }}'
            then:
            - service: system_log.write
