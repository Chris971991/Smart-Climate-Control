- if:
  - condition: template
    value_template: '{% set current_last_mode = states(helper_mode) | default(''off'')
      %} {% set heating_modes = [''heating'', ''heating_low'', ''heating_medium'',
      ''heating_high''] %} {% set cooling_modes = [''cooling'', ''cooling_low'', ''cooling_medium'',
      ''cooling_high''] %} {% set stuck_in_disabled_heating = (current_last_mode in
      heating_modes and not enable_heating) %} {% set stuck_in_disabled_cooling =
      (current_last_mode in cooling_modes and not enable_cooling) %} {{ stuck_in_disabled_heating
      or stuck_in_disabled_cooling }}

      '
  then:
  - service: system_log.write
    data:
      message: '⚠️ {{ room_name | upper }} AUTO-RESET: last_mode was "{{ states(helper_mode)
        }}" but that mode is DISABLED • enable_heating: {{ enable_heating }} • enable_cooling:
        {{ enable_cooling }} • Resetting last_mode to "off" to prevent stuck state

        '
      level: warning
    continue_on_error: true
  - service: input_text.set_value
    target:
      entity_id: '{{ helper_mode }}'
    data:
      value: 'off'
    continue_on_error: true
  - service: input_datetime.set_datetime
    target:
      entity_id: !input helper_mode_start_time
    data:
      datetime: '{{ now() }}'
    continue_on_error: true
- variables:
    check_interval: !input check_interval_minutes
    debug_enabled: !input enable_full_debug_logging
    proximity_sensor: "{% if proximity_sensor_input and proximity_sensor_input not
      in [none, '', 'unavailable', 'unknown'] and proximity_sensor_input is string
      and proximity_sensor_input != '' %}\n  {{ proximity_sensor_input }}\n{% else
      %}\n  \n{% endif %}\n"
    direction_sensor: "{% if direction_sensor_input and direction_sensor_input not
      in [none, '', 'unavailable', 'unknown'] and direction_sensor_input is string
      and direction_sensor_input != '' %}\n  {{ direction_sensor_input }}\n{% else
      %}\n  \n{% endif %}\n"
    previous_temp: "{% if helper_temp_history %}\n  {{ states(helper_temp_history)
      | float(0) }}\n{% else %}\n  0\n{% endif %}\n"
    should_proceed: "{% if trigger.id == 'periodic_check' %}\n  {% set mins = now().minute
      %}\n  {% set interval = check_interval | int(1) %}\n  {% if interval > 0 %}\n
      \   {{ (mins % interval) == 0 }}\n  {% else %}\n    True\n  {% endif %}\n{%
      else %}\n  True\n{% endif %}\n"
- condition: template
  value_template: '{{ should_proceed }}'
- if:
  - condition: template
    # v9.20.0 (round 4): not when the control-mode helper itself drops out or comes back from a
    # dropout (it cleared an Override and restarted presence confirmation).
    value_template: '{{ trigger.id == ''mode_change'' and helper_change not in [none,
      '''', ''unavailable'', ''unknown''] and trigger.to_state is defined and trigger.to_state is not none
      and trigger.to_state.state not in [''unavailable'', ''unknown''] and not (trigger.from_state is defined
      and trigger.from_state is not none and trigger.from_state.state in [''unavailable'', ''unknown''])
      }}'
  then:
  - variables:
      from_mode: '{{ trigger.from_state.state if trigger.from_state is defined and
        trigger.from_state else ''unknown'' }}'
      to_mode: '{{ trigger.to_state.state if trigger.to_state is defined and trigger.to_state
        else ''unknown'' }}'
  - if:
    - condition: template
      value_template: '{{ to_mode == ''Override'' and helper_override_timestamp not
        in [none, '''', ''unavailable'', ''unknown''] }}'
    then:
    - service: input_datetime.set_datetime
      target:
        entity_id: '{{ helper_override_timestamp }}'
      data:
        datetime: '{{ now() }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_override_timeout_storage not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_override_timeout_storage }}'
        data:
          value: '{{ override_timeout }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ from_mode in [''Auto'', ''Smart''] and helper_mode_before_override
          not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_mode_before_override }}'
        data:
          value: '{{ from_mode }}'
        continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ from_mode == ''Override'' and helper_override_source not
        in [none, '''', ''unavailable'', ''unknown''] }}'
    then:
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_override_source }}'
      data:
        value: none
      continue_on_error: true
  # v9.17.1 hand-back (a running unit continues as a live run) is now done for EVERY
  # change into Smart/Auto by the single last-mode writer at the top of the action.
  - if:
    - condition: template
      value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
        }}'
    then:
    - service: input_datetime.set_datetime
      target:
        entity_id: '{{ helper_change }}'
      data:
        datetime: '{{ now() }}'
      continue_on_error: true
  - if:
    # v9.14.0 (bug 8): Pre-conditioning -> Smart is the normal arrival handoff, and this
    # reset switched the validation helper off and re-stamped the presence timer on it,
    # which killed a 9-minute cooling run 163 ms after the handoff on 3 Sep. Exempt it.
    - condition: template
      value_template: '{{ to_mode == ''Smart'' and from_mode not in [''Override'', ''Pre-conditioning'']
        and presence_confirmation_delay > 0 }}'
    then:
    - if:
      - condition: template
        value_template: '{{ presence_validation_helper not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_boolean.turn_off
        target:
          entity_id: '{{ presence_validation_helper }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ presence_detected_helper not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ presence_detected_helper }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
  - service: system_log.write
    data:
      message: "\U0001F3AE {{ room_name | upper }} MODE CHANGE: {{ from_mode }} →
        {{ to_mode }} {% if to_mode == 'Override' %} • Override activated - automation
        paused • Will return to: {{ from_mode if from_mode in ['Auto', 'Smart'] else
        default_control_mode }} • Timeout: {{ override_timeout }}h {% elif from_mode
        == 'Override' %} • Override cleared - automation resuming in {{ to_mode }} {% else
        %} • Standard mode switch {% endif %}\n"
      level: warning
  - if:
    - condition: template
      value_template: '{{ event_logging_enabled }}'
    then:
    - service: system_log.write
      data:
        # v9.20.0: the room sensor, not the unit's whole-degree sensor.
        # v9.20.0 (round 3): every room sensor, combined as the control logic combines them (it
        # showed the first sensor, the kitchen, in the Living Room).
        message: "[EVENT] {{ room_name }} 🔄 | Mode Change: {{ from_mode }} → {{ to_mode }} | Room {% set
          ts = [temp_sensor] if temp_sensor is string else ((temp_sensor | list) if temp_sensor else []) %}{% set
          ns = namespace(v=[]) %}{% for s in ts %}{% if states(s) not in ['unknown', 'unavailable', ''] and (states(s)
          | float(-999)) > -50 %}{% set ns.v = ns.v + [states(s) | float(0)] %}{% endif %}{% endfor %}{% set warm
          = multi_sensor_strategy == 'warmest' or (multi_sensor_strategy == 'auto' and not use_avg and enable_cooling
          and not enable_heating) %}{% set cold = multi_sensor_strategy == 'coldest' or (multi_sensor_strategy ==
          'auto' and not use_avg and enable_heating and not enable_cooling) %}{% if ns.v | count == 0 %}{{
          state_attr(climate_list[0], 'current_temperature') | default('N/A') }}{% elif warm %}{{ ns.v | max | round(1)
          }}{% elif cold %}{{ ns.v | min | round(1) }}{% else %}{{ ((ns.v | sum) / (ns.v | count)) | round(1) }}{%
          endif %}°C, AC {{ states(climate_list[0]) | default('unknown') }}"
        level: warning
  # v9.13.0: keep the Override Active indicator in step with the control mode. A user
  # who picks Override or Smart straight from the dropdown never touches the boolean,
  # so it went stale (seen: Master Bedroom flag ON for hours while the room read Smart,
  # which also meant the next "clear" could never fire override_cleared_by_user).
  # The turn_off is deliberately the LAST step of this handler: it fires
  # override_cleared_by_user, and that run resyncs the expected-state snapshot to the
  # real AC state (it skips the mode restore because the helper is no longer Override).
  - if:
    - condition: template
      value_template: '{{ to_mode == ''Override'' and helper_override_flag not in [none,
        '''', ''unavailable'', ''unknown''] and is_state(helper_override_flag, ''off'') }}'
    then:
    - service: input_boolean.turn_on
      target:
        entity_id: '{{ helper_override_flag }}'
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ from_mode == ''Override'' and to_mode != ''Override'' and helper_override_flag
        not in [none, '''', ''unavailable'', ''unknown''] and is_state(helper_override_flag,
        ''on'') }}'
    then:
    - service: input_boolean.turn_off
      target:
        entity_id: '{{ helper_override_flag }}'
      continue_on_error: true
- if:
  - condition: template
    value_template: '{{ trigger.id == ''override_cleared_by_user'' }}'
  - condition: template
    value_template: '{{ control_mode_helper not in [none, '''', ''unavailable'', ''unknown'']
      }}'
  then:
  - if:
    # M26: control_mode variable not yet defined at this point in the action list - must read the helper directly
    - condition: template
      value_template: '{{ fan_override_active and states(control_mode_helper) != ''Override'' }}'
    then:
    - if:
      - condition: template
        value_template: '{{ helper_override_source not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      # v9.14.0 (bug 5): a 'both' override keeps its AC half; anything else clears fully.
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_override_source }}'
        data:
          value: '{{ ''ac'' if states(helper_override_source) == ''both'' else ''none'' }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'',
          ''unknown''] and ceiling_fan_configured }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_ceiling_fan }}'
        data:
          value: '{{ states(ceiling_fan_entity) }}'
        continue_on_error: true
    - service: system_log.write
      data:
        message: '✅ {{ room_name | upper }} FAN OVERRIDE CLEARED BY USER (INDEPENDENT
          MODE) • Ceiling fan automation resuming • AC was not affected

          '
        level: warning
    # v9.14.0 (bug 5): the override BOOLEAN was never switched off here, so a
    # functionally-ended fan override read as active for hours (observed 9 h 42 m).
    # Nothing was blocked (the gate reads the source text) but it misled every reader.
    # Turn it off unless the AC half of a 'both' override is still live. LAST before
    # the stop: it fires a trigger that mode:restart uses to cancel this run.
    - if:
      - condition: template
        value_template: '{{ helper_override_flag not in [none, '''', ''unavailable'', ''unknown'']
          and states(helper_override_source) != ''ac'' }}'
      then:
      - service: input_boolean.turn_off
        target:
          entity_id: '{{ helper_override_flag }}'
        continue_on_error: true
    - stop: Fan-only override cleared by user
  # v9.12.0 M27: only restore the AC control mode when the helper is ACTUALLY in
  # Override. The independent fan-override expiry (~line 8590) clears
  # helper_override_source BEFORE turning the override boolean off, and it is that
  # boolean going on->off which fires this run - so by the time we get here
  # fan_override_active reads false and the fan-only stop above is skipped. Without
  # this gate the block stamped a stale helper_mode_before_override over whatever
  # mode the user had chosen (Office: Smart -> Auto, two hours after any ceiling fan
  # press). Nothing to restore when the AC was never in Override.
  # v9.13.0: decide the restore up front, but perform the select_option as the LAST
  # step of this handler (see the end of the block). select_option fires mode_change and
  # mode:restart then races to cancel this run; with the select in the middle, the
  # snapshot/expected-state resync below only ran when the race was won.
  # return_to_mode is also defined unconditionally now - it was only set inside the
  # gate, so the "OVERRIDE CLEARED BY USER" log rendered 'return_to_mode is undefined'.
  - variables:
      override_was_active: '{{ is_state(control_mode_helper, ''Override'') }}'
      return_to_mode: '{{ states(helper_mode_before_override) if helper_mode_before_override
        and states(helper_mode_before_override) in [''Auto'', ''Smart''] else default_control_mode
        }}'
  # v9.12.0 M28: consume the snapshot. Nothing else ever cleared it, so a value
  # left over from an old override leaked into every later restore.
  - if:
    - condition: template
      value_template: '{{ (override_was_active | bool) and helper_mode_before_override
        not in [none, '''', ''unavailable'', ''unknown''] }}'
    then:
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_mode_before_override }}'
      data:
        value: ''
      continue_on_error: true
  # v9.20.0: only when the unit reports a setpoint (the Living Room reports none while off,
  # and 22 was recorded as "last sent", restarting the setpoint hold clock).
  - if:
    - condition: template
      value_template: '{{ helper_expected_temp not in [none, '''', ''unavailable'',
        ''unknown''] and climate_list | length > 0 and state_attr(climate_list[0], ''temperature'')
        is not none }}'
    then:
    - service: input_number.set_value
      target:
        entity_id: '{{ helper_expected_temp }}'
      data:
        value: '{{ state_attr(climate_list[0], ''temperature'') | float(22) }}'
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
        ''unknown''] and climate_list | length > 0 }}'
    then:
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_expected_hvac }}'
      data:
        value: '{{ states(climate_list[0]) }}'
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
        ''unknown''] and climate_list | length > 0 }}'
    then:
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_expected_fan }}'
      data:
        value: '{{ state_attr(climate_list[0], ''fan_mode'') | default(''unknown'')
          }}'
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'',
        ''unknown''] and ceiling_fan_configured }}'
    then:
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_expected_ceiling_fan }}'
      data:
        value: '{{ states(ceiling_fan_entity) }}'
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
        and climate_list | length > 0 }}'
    then:
    - variables:
        actual_temp: '{{ state_attr(climate_list[0], ''temperature'') | float(22)
          | round(1) }}'
        actual_fan: '{{ state_attr(climate_list[0], ''fan_mode'') | default(''unknown'')
          }}'
        actual_swing: '{{ state_attr(climate_list[0], ''swing_mode'') | default(''unknown'')
          }}'
        actual_hvac: '{{ states(climate_list[0]) }}'
        sync_snapshot: hvac={{ actual_hvac }},temp={{ actual_temp }},fan={{ actual_fan
          }},swing={{ actual_swing }}
        sync_checksum: '{% set hvac_codes = {''off'': 0, ''cool'': 1, ''heat'': 2,
          ''auto'': 3, ''dry'': 4, ''fan_only'': 5, ''heat_cool'': 6} %} {{ ((actual_temp
          * 1000) + (actual_fan | string | length) + (actual_swing | string | length)
          + hvac_codes.get(actual_hvac, 99)) | int(0) }}

          '
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_last_command }}'
      data:
        value: '{{ sync_snapshot }}'
      continue_on_error: true
    - service: input_number.set_value
      target:
        entity_id: '{{ helper_state_checksum }}'
      data:
        value: '{{ sync_checksum }}'
      continue_on_error: true
  # v9.20.0: the room's last mode is NOT written here any more. The select at the end of
  # this handler always changes the mode, and the mode_change writer then records the
  # unit's real state AND stamps the mode clock. Writing it here first meant the writer saw
  # no change and never stamped the clock: a resumed run looked hours old (Level 4
  # escalation, "Cooling (242 min)").
  - if:
    - condition: template
      value_template: '{{ helper_override_source not in [none, '''', ''unavailable'',
        ''unknown''] }}'
    then:
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_override_source }}'
      data:
        value: none
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
        and states(control_mode_helper) == ''Override'' }}'
    then:
    - service: input_datetime.set_datetime
      target:
        entity_id: '{{ helper_change }}'
      data:
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      continue_on_error: true
  - service: system_log.write
    data:
      message: '✅ {{ room_name | upper }} OVERRIDE CLEARED BY USER • Override flag turned
        off • {{ ''Returning to: '' ~ return_to_mode ~ '' mode'' if (override_was_active
        | bool) else ''Control mode already '' ~ states(control_mode_helper) ~ '' - nothing
        to restore'' }} • Synced snapshot to actual AC state • Updated helper_change to
        NOW for grace period • Automation will resume on next trigger

        '
      level: warning
  # v9.13.0: the mode restore is the LAST action (fires mode_change -> restart).
  - if:
    - condition: template
      value_template: '{{ override_was_active | bool }}'
    then:
    - service: input_select.select_option
      target:
        entity_id: '{{ control_mode_helper }}'
      data:
        option: '{{ return_to_mode }}'
      continue_on_error: true
  - stop: Override cleared - stopping to prevent immediate re-detection on this cycle
- variables:
    # v9.20.0: re-read here. The top-level copy is rendered at trigger time, before the
    # mode_change handler above may have changed it, and every branch used the stale value
    # (the v9.17.1 hand-back was undone in the very run that performed it).
    last_mode: "{% set raw = states(helper_mode) %}{{ raw if raw not in ['unknown', 'unavailable',
      ''] else 'off' }}"
    helper_last_mode_at_start: '{{ states(helper_mode) | default(''off'') }}'
    # v9.20.0: the bed counts as occupied through a bathroom trip (Bed Absence Grace) while
    # anything is running, and through a sensor dropout while a bed mode runs. Several checks
    # read the raw sensor and switched the unit off (or let the fan zone take the room, or
    # lifted the in-bed setpoint limit) the moment someone got up.
    # v9.20.0 (round 3): a cooling run with the unit on counts through a dropout of up to 30
    # minutes as well. It is only relabelled Bed ECO at the stop point, so a dropout longer than
    # the 5-minute grace let Room Empty switch the AC and the ceiling fan off over a sleeper.
    # A bed mode holds through a dropout for up to 12 hours: a sensor that stays dead kept the
    # night cycle (compressor at 23.6, off at 21.5) running in an empty bedroom for ever, and a
    # 2-hour bound switched everything off over a sleeper at 1 am (round 4).
    bed_active: "{{ (bed_occupied | bool) or (bed_comfort_mode != 'off' and bed_sensor_manual is string
      and bed_sensor_manual != '' and ((last_mode in ['bed_comfort_eco', 'bed_comfort_quiet', 'bed_eco_fan_only']
      and states(bed_sensor_manual) in ['unavailable', 'unknown'] and (minutes_since_bed_off | float(999)) < 720) or (last_mode
      == 'cooling' and states(bed_sensor_manual)
      in ['unavailable', 'unknown'] and climate_list | length > 0 and states(climate_list[0]) not in ['off', 'unavailable',
      'unknown'] and (minutes_since_bed_off | float(999)) < 30) or ((bed_absence_grace | float(0)) > 0
      and (minutes_since_bed_off | float(999)) < (bed_absence_grace | float(0)) and last_mode not in ['off',
      'smart_off', 'away_off', 'auto_off_off', 'window_off', 'adaptive_off', 'stability_off']))) }}"
    current_temp: "{# v9.14.0 (bug 1): an unavailable sensor used to read as a hardcoded
      25°C and start cooling a cold room (observed 2 Sep: 2 h 8 m cooling a 19.2°C bedroom
      after a 5-second dropout). Fall back to the last REAL reading held in the temp-history
      helper, and to the target if that is also invalid. temp_sensor_available (below) stops
      a dropout from STARTING anything. #}\n{% set _lk = states(helper_temp_history) if helper_temp_history
      not in [none, '', 'unavailable', 'unknown'] else 'unknown' %}\n{% set safe_fallback
      = (_lk | float(-999)) if (_lk not in ['unknown', 'unavailable', ''] and (_lk | float(-999))
      > 0) else (target_temp | float(22)) %}\n{% if temp_sensor %}\n  {# v3.9.0: Multi-sensor support for rooms
      cooled/heated by one AC unit #}\n  {% if temp_sensor is string %}\n    {# Single
      sensor (backward compatibility) #}\n    {{ states(temp_sensor) | float(safe_fallback) }}\n
      \ {% else %}\n    {# Multiple sensors - use min/max/avg strategy based on HVAC
      mode #}\n    {% set temps = namespace(values=[]) %}\n    {% for sensor in temp_sensor
      %}\n      {# M29: distinguish unavailable sensor from legitimately cold (<=0) reading #}\n
      \     {% if states(sensor) not in ['unknown', 'unavailable', ''] %}\n        {%
      set temp_value = states(sensor) | float(-999) %}\n        {% if temp_value > -50
      %}\n          {% set temps.values = temps.values + [temp_value] %}\n        {%
      endif %}\n      {% endif %}\n    {% endfor %}\n\n    {% if temps.values | length > 0 %}\n      {%
      if multi_sensor_strategy == 'average' or (multi_sensor_strategy == 'auto' and use_avg) %}\n        {# LOW-multi-sensor-strategy: explicit strategy wins; 'auto' follows Use Average toggle
      #}\n        {{ ((temps.values | sum) / (temps.values | length)) | round(1) }}\n
      \     {% elif multi_sensor_strategy == 'warmest' %}\n        {{ temps.values | max | round(1) }}\n
      \     {% elif multi_sensor_strategy == 'coldest' %}\n        {{ temps.values | min | round(1) }}\n
      \     {% elif enable_cooling and not enable_heating %}\n        {# Cooling:
      Use MAX temp (warmest room drives cooling) #}\n        {{ temps.values | max
      | round(1) }}\n      {% elif enable_heating and not enable_cooling %}\n        {#
      Heating: Use MIN temp (coldest room drives heating) #}\n        {{ temps.values
      | min | round(1) }}\n      {% else %}\n        {# Both or neither: Use AVERAGE
      #}\n        {{ ((temps.values | sum) / (temps.values | length)) | round(1) }}\n
      \     {% endif %}\n    {% else %}\n      {{ safe_fallback }}\n    {% endif %}\n  {% endif %}\n{%
      elif use_avg %}\n  {% set temps = namespace(values=[]) %}\n  {% for entity in
      climate_list %}\n    {# M29: None attribute test IS the availability check; <=0 readings kept #}\n
      \   {% set raw = state_attr(entity, 'current_temperature') %}\n    {% if raw is
      not none %}\n      {% set temp_value = raw | float(-999) %}\n      {% if temp_value
      > -50 %}\n        {% set temps.values = temps.values + [temp_value] %}\n      {%
      endif %}\n    {% endif %}\n  {% endfor %}\n  {% if temps.values | length
      > 0 %}\n    {{ ((temps.values | sum) / (temps.values | length)) | round(1) }}\n
      \ {% else %}\n    {{ safe_fallback }}\n  {% endif %}\n{% else %}\n  {{ state_attr(climate_list[0],
      'current_temperature') | float(safe_fallback) }}\n{% endif %}\n"
    temp_sensor_available: "{# v9.14.0 (bug 1): True when at least one configured sensor has
      a real reading. Gates the start-cooling and ceiling-fan-entry branches so a sensor
      dropout can never START anything. Renders True/False (real booleans). #}\n{% if temp_sensor
      %}\n  {% if temp_sensor is string %}\n    {{ states(temp_sensor) not in ['unknown',
      'unavailable', ''] and (states(temp_sensor) | float(-999)) > -50 }}\n  {% else %}\n
      \   {% set ns = namespace(ok=false) %}\n    {% for sensor in temp_sensor %}\n      {%
      if states(sensor) not in ['unknown', 'unavailable', ''] and (states(sensor) | float(-999))
      > -50 %}\n        {% set ns.ok = true %}\n      {% endif %}\n    {% endfor %}\n    {{
      ns.ok }}\n  {% endif %}\n{% else %}\n  {{ climate_list | length > 0 and state_attr(climate_list[0],
      'current_temperature') is not none }}\n{% endif %}\n"
    outdoor_temperature: "{% if enable_outside_temp_compensation or enable_outside_temp_fan_boost %}\n  {% if outdoor_temp_sensor
      %}\n    {{ states(outdoor_temp_sensor) | float(25) }}\n  {% else %}\n    {{
      state_attr(weather_entity, 'temperature') | float(25) }}\n  {% endif %}\n{%
      else %}\n  25\n{% endif %}\n"
    outside_temp_compensation_amount: "{% if enable_outside_temp_compensation %}\n
      \ {% set outdoor = outdoor_temperature | float(25) %}\n  {% set temp_delta =
      outdoor - outside_compensation_base_temp %}\n  {% set raw_compensation = (temp_delta
      * outside_compensation_factor) | abs %}\n  {{ [[0, raw_compensation] | max,
      max_outside_compensation] | min | round(1) }}\n{% else %}\n  0\n{% endif %}\n"
    heat_source_load: "{% if enable_heat_source_compensation and heat_source_sensors
      %}\n  {% set load_sum = namespace(value=0, count=0) %}\n  {% for sensor in heat_source_sensors
      %}\n    {% set state = states(sensor) %}\n    {% if state not in ['unavailable',
      'unknown', 'none', ''] %}\n      {% set val = state | float(0) %}\n      {#
      LOW-heat-source-sensors: convert watt-scale sensors to a 0-100 load (1000 W = 100%) #}\n
      \     {% set unit = (state_attr(sensor, 'unit_of_measurement') | default('') | lower) %}\n
      \     {% if unit == 'w' %}\n        {% set val = val / 10 %}\n      {% elif unit == 'kw' %}\n
      \       {% set val = val * 100 %}\n      {% endif %}\n      {% set val = [val, 100] | min %}\n
      \     {% if val >= 0 %}\n
      \       {% set load_sum.value = load_sum.value + val %}\n        {% set load_sum.count
      = load_sum.count + 1 %}\n      {% endif %}\n    {% endif %}\n  {% endfor %}\n
      \ {% if load_sum.count > 0 %}\n    {{ (load_sum.value / load_sum.count) | round(1)
      }}\n  {% else %}\n    0\n  {% endif %}\n{% else %}\n  0\n{% endif %}\n"
    heat_source_active: '{{ enable_heat_source_compensation and (heat_source_load
      | float(0)) >= (heat_source_threshold | float(50)) }}

      '
    heat_source_compensation_amount: "{% if heat_source_active %}\n  {% set load =
      heat_source_load | float(0) %}\n  {% set threshold = heat_source_threshold |
      float(50) %}\n  {% set max_comp = heat_source_max_compensation | float(2) %}\n
      \ {# Linear scale: threshold% = 0 compensation, 100% = max compensation #}\n
      \ {% set load_above_threshold = load - threshold %}\n  {% set scale_range =
      100 - threshold %}\n  {% if scale_range > 0 %}\n    {% set compensation = (load_above_threshold
      / scale_range) * max_comp %}\n    {{ [compensation, max_comp] | min | round(1)
      }}\n  {% else %}\n    {{ max_comp }}\n  {% endif %}\n{% else %}\n  0\n{% endif
      %}\n"
    heat_source_escalation_boost: "{% if heat_source_active %}\n  {{ heat_source_fan_boost
      | int(0) }}\n{% else %}\n  0\n{% endif %}\n"
    effective_min_progress_rate: "{% if heat_source_active %}\n  {% set base_rate
      = min_progress_rate | float(0.03) %}\n  {% set reduction = heat_source_progress_reduction
      | float(50) / 100 %}\n  {{ [(base_rate * (1 - reduction)) | round(4), 0.001]
      | max }}\n{% else %}\n  {{ [min_progress_rate | float(0.03), 0.001] | max }}\n{%
      endif %}\n"
    comfort_min_temp: '{{ base_comfort_min | round(1) }}'
    comfort_max_temp: '{{ base_comfort_max | round(1) }}'
    cooling_target_temp: '{{ base_cooling_target | round(1) }}'
    heating_target_temp: '{{ base_heating_target | round(1) }}'
    ceiling_fan_zone_max: '{{ (comfort_max_temp | float(0)) + (fan_cooling_offset
      | float(3)) }}'
    # v9.20.1: the fan zone holds the AC back to the top of the zone even when you switch the
    # ceiling fan off yourself (v9.20.0 started the AC at 22.8 the moment the fan was switched
    # off at the wall; Chris wants the AC only above the zone).
    in_ceiling_fan_zone: "{% set fan_already_active = (last_mode == 'ceiling_fan_cooling')
      %} {% set hysteresis = 0.3 if fan_already_active else 0 %} {{ ceiling_fan_configured
      and enable_cooling
      and (current_temp | float(0)) > ((comfort_max_temp | float(0)) - hysteresis)
      and (current_temp | float(0)) <= (ceiling_fan_zone_max | float(0)) }}"
    # v9.20.0: the speed the ceiling fan is actually on (for the hysteresis below).
    ceiling_fan_current_speed: "{% set cur = 'off' %}{% if ceiling_fan_has_speed_switches %}{% set cur
      = 'high' if is_state(ceiling_fan_high_switch, 'on') else ('medium' if is_state(ceiling_fan_medium_switch,
      'on') else ('low' if is_state(ceiling_fan_low_switch, 'on') else 'off')) %}{% elif ceiling_fan_domain
      == 'fan' and ceiling_fan_has_presets and is_state(ceiling_fan_entity, 'on') %}{% set cur = state_attr(ceiling_fan_entity,
      'preset_mode') | default('off', true) | lower %}{% elif ceiling_fan_domain == 'fan' and is_state(ceiling_fan_entity,
      'on') %}{% set pct = state_attr(ceiling_fan_entity, 'percentage') | int(0) %}{% set cur = 'low'
      if pct <= 33 else ('medium' if pct <= 66 else 'high') %}{% endif %}{{ cur }}"
    # v9.20.0: bands judged on the reading rounded to 0.01 (22.3 - 22.0 was 0.30000000000000071,
    # one band too high), and a 0.2 °C hysteresis on the way DOWN so a room sitting on a band
    # edge does not switch the relays on every update (the bedroom alternated 22.2/22.3 about
    # 30 times in an hour). Up-changes are immediate.
    ceiling_fan_target_speed: "{% set delta = ((current_temp | float(0)) - (comfort_max_temp | float(0)))
      | round(2) %}{% set offset = fan_cooling_offset | float(3) %}{% set third = (offset / 3.0) | round(3)
      %}{% set rank = {'off': 0, 'low': 1, 'medium': 2, 'high': 3} %}{% set ns = namespace(b=[]) %}{%
      for dl in [delta, delta + 0.2] %}{% if ceiling_fan_speed_mode == 'static' %}{% set s = ceiling_fan_static_speed
      %}{% elif ceiling_fan_speed_mode == 'custom' %}{% set s = ceiling_fan_band_1_speed if dl <= third else
      (ceiling_fan_band_2_speed if dl <= third * 2 else ceiling_fan_band_3_speed) %}{% else %}{% set s =
      'low' if dl <= third else ('medium' if dl <= third * 2 else 'high') %}{% endif %}{% set ns.b = ns.b
      + [s | string | trim | lower] %}{% endfor %}{% set raw = ns.b[0] %}{% set cur = ceiling_fan_current_speed
      | string | trim | lower %}{% if cur == ns.b[1] and rank.get(ns.b[1], 2) == rank.get(raw, 2) + 1 %}{%
      set raw = cur %}{% endif %}{% if bed_active and fan_bed_comfort_mode == 'dynamic' %}{% set diff = ((current_temp
      | float(0)) - (target_temp | float(0))) | round(2) %}{% set thr = bed_eco_near_target_threshold | float(0.3)
      %}{% set raw = 'medium' if (diff > thr or (cur == 'medium' and diff > ((thr - 0.2) | round(2)))) else 'low'
      %}{% elif bed_active and fan_bed_comfort_mode == 'low' %}{% set raw = 'low' %}{% elif bed_active and
      fan_bed_comfort_mode == 'unchanged' and cur in ['low', 'medium', 'high'] %}{% set raw = cur %}{% endif
      %}{% if bed_active and rank.get(raw, 2) > rank.get(ceiling_fan_bed_max_speed, 3) %}{{ ceiling_fan_bed_max_speed
      }}{% else %}{{ raw }}{% endif %}"
    # v9.20.0: True when the fan already runs at the wanted speed (an on/off fan: when it is on).
    ceiling_fan_at_target_speed: "{% if ceiling_fan_has_speed_switches or (ceiling_fan_domain == 'fan' and
      (ceiling_fan_has_presets or state_attr(ceiling_fan_entity, 'percentage') is not none)) %}{{ (ceiling_fan_current_speed
      | trim) == (ceiling_fan_target_speed | trim) }}{% else %}{{ ceiling_fan_is_on | bool }}{% endif %}"
    # v9.20.0: Fan in Bed set to Off keeps the ceiling fan off over an occupied bed (no branch
    # switches it on or changes its speed there). Unchanged with the fan off leaves it off too
    # (it was switched on at the room's speed by the cooling branches).
    ceiling_fan_bed_blocked: "{{ (bed_active | bool) and (fan_bed_comfort_mode == 'off' or (fan_bed_comfort_mode
      == 'unchanged' and not (ceiling_fan_is_on | bool))) }}"
    ceiling_fan_target_pct: "{% set speed = ceiling_fan_target_speed %} {% if speed
      == 'low' %}\n  33\n{% elif speed == 'medium' %}\n  66\n{% else %}\n  100\n{%
      endif %}\n"
    ceiling_fan_target_switch: "{% if ceiling_fan_has_speed_switches %}\n  {% if ceiling_fan_target_speed
      == 'low' %}\n    {{ ceiling_fan_low_switch }}\n  {% elif ceiling_fan_target_speed
      == 'medium' %}\n    {{ ceiling_fan_medium_switch }}\n  {% else %}\n    {{ ceiling_fan_high_switch
      }}\n  {% endif %}\n{% else %}\n  none\n{% endif %}\n"
    # M38: the non-target speed relays - turn these OFF before energizing the target so
    # capacitor-speed fan motors never have two relays energized simultaneously.
    # v9.20.0 (round 3): only the relays that are actually on (a start from off sent a turn-off
    # to two relays that were already off); the turn-off steps are skipped when none are.
    ceiling_fan_other_switches: "{% if ceiling_fan_has_speed_switches %}\n  {{ [ceiling_fan_low_switch,
      ceiling_fan_medium_switch, ceiling_fan_high_switch] | reject('eq', ceiling_fan_target_switch)
      | select('is_state', 'on') | list }}\n{% else %}\n  []\n{% endif %}\n"
    ceiling_fan_mode_active: '{{ last_mode == ''ceiling_fan_cooling'' }}'
    ceiling_fan_runtime_minutes: "{% if ceiling_fan_mode_active and helper_change
      and states(helper_change) not in ['unknown', 'unavailable', ''] %}\n  {{ ((as_timestamp(now())
      - as_timestamp(states(helper_change))) / 60) | round(1) }}\n{% else %}\n  0\n{%
      endif %}\n"
    ceiling_fan_entry_temp: "{# v9.14.0 (bug 4): the TRUE start-of-fan temperature, from the
      optional Fan Entry Temperature helper. Falls back to the temp-history helper (only one
      check old) when the new helper is not configured. #}\n{% if ceiling_fan_mode_active
      and helper_fan_entry_temp not in [none, '', 'unavailable', 'unknown'] and states(helper_fan_entry_temp)
      not in ['unknown', 'unavailable', ''] and (states(helper_fan_entry_temp) | float(0))
      > 0 %}\n  {{ states(helper_fan_entry_temp) | float(0) }}\n{% elif ceiling_fan_mode_active
      and helper_temp_history not in [none, '', 'unavailable', 'unknown'] %}\n  {{ states(helper_temp_history)
      | float(0) }}\n{% else %}\n  0\n{% endif %}\n"
    ceiling_fan_should_escalate: "{# v9.14.0 (bug 4): escalate at the timeout unless the fan
      has brought the room BELOW its start temperature, and escalate immediately if the room
      has RISEN 0.5°C despite the fan. Previously the temperature term compared against a
      reading only one check old, so it reduced to 'did not tick down in the last minute'
      (true in 76 of 77 sessions). With no entry reading at all, timeout-only (old behaviour).
      #}\n{% set runtime = ceiling_fan_runtime_minutes | float(0) %} {% set timeout = fan_escalation_timeout
      | float(10) %} {% set entry = ceiling_fan_entry_temp | float(0) %} {% set temp = current_temp
      | float(0) %} {{ enable_fan_escalation\n   and ceiling_fan_mode_active\n   and ((runtime
      >= timeout and (entry <= 0 or temp >= entry)) or (entry > 0 and temp >= (entry + 0.5)))
      }}\n"
    window_open: "{% if enable_window_detection %}\n  {% set open = namespace(value=false)
      %}\n  {% for sensor in window_sensors %}\n    {% if is_state(sensor, 'on') %}\n
      \     {% set open.value = true %}\n    {% endif %}\n  {% endfor %}\n  {{ open.value
      }}\n{% else %}\n  False\n{% endif %}\n"
    window_open_over_delay: >-
      {% if enable_window_detection and (window_sensors | list | length) > 0 %}
        {% set od = namespace(value=false) %}
        {% set delay = window_open_delay | float(2) %}
        {% for sensor in window_sensors %}
          {% if is_state(sensor, 'on') %}
            {% set s = states[sensor] %}
            {% if s and ((as_timestamp(now()) - as_timestamp(s.last_changed)) / 60) >= delay %}
              {% set od.value = true %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ od.value }}
      {% else %}
        False
      {% endif %}
    windows_closed_over_delay: >-
      {% if not enable_window_detection or (window_sensors | list | length) == 0 %}
        True
      {% elif (window_open | bool) %}
        False
      {% else %}
        {% set cd = namespace(value=true) %}
        {% set delay = window_close_delay | float(1) %}
        {% for sensor in window_sensors %}
          {% set s = states[sensor] %}
          {% if (s is none) or (not is_state(sensor, 'off')) or (((as_timestamp(now()) - as_timestamp(s.last_changed)) / 60) < delay) %}
            {% set cd.value = false %}
          {% endif %}
        {% endfor %}
        {{ cd.value }}
      {% endif %}
    anyone_home: "{% set home = namespace(value=false) %} {% for person in persons
      %}\n  {% if is_state(person, 'home') %}\n    {% set home.value = true %}\n  {%
      endif %}\n{% endfor %} {% if not home.value %}\n  {% for device in devices %}\n
      \   {% if is_state(device, 'on') or is_state(device, 'PowerOn') %}\n      {%
      set home.value = true %}\n    {% endif %}\n  {% endfor %}\n{% endif %} {{ home.value
      }}\n"
    # v9.20.0: the direction sensor flickers to 'towards' on GPS drift while parked (04/10:
    # 9 flips in 43 min at Maitland Greenhills, 5.3 km out; the Living Room AC went on/off
    # 7 times), and entering a zone produces a one-second 'towards' blip in the same
    # millisecond the phone's zone changes (13:58:07, 14:40:10). See the template.
    approaching_home: "{# v9.8.1: 'arrived' is not approaching (it lingers). v9.20.0: judged per
      person when the proximity integration's per-person sensors exist (<zone>_<person>_distance
      and _direction_of_travel): that SAME person must be not_home, heading 'towards' for at
      least 60 s and inside the home radius. A parked person's GPS drift no longer combines
      with another person merely being out. Without per-person sensors: the nearest-person
      sensors with the same 60 s hold, and any tracked person not_home. #}{% set people = persons
      if persons is iterable and persons is not string else ([persons] if persons else [])
      %}{% set prox = proximity_sensor | trim if proximity_sensor else '' %}{% set dirs = direction_sensor
      | trim if direction_sensor else '' %}{% set ns = namespace(per_person=false, hit=false) %}{%
      if prox and prox.endswith('_nearest_distance') %}{% set base = prox[:-16] %}{% for p in people
      %}{% set pid = p.split('.')[1] if '.' in p else p %}{% set d_ent = base ~ pid ~ '_direction_of_travel'
      %}{% set x_ent = base ~ pid ~ '_distance' %}{% if states[d_ent] is not none and states[x_ent]
      is not none %}{% set ns.per_person = true %}{% set held = (as_timestamp(now()) - as_timestamp(states[d_ent].last_changed,
      0)) >= 60 %}{% if is_state(p, 'not_home') and is_state(d_ent, 'towards') and held and (states(x_ent)
      | float(999999)) < home_zone_distance %}{% set ns.hit = true %}{% endif %}{% endif %}{% endfor
      %}{% endif %}{% if ns.per_person %}{{ ns.hit }}{% elif dirs and prox %}{% set travelling = (people
      | select('is_state', 'not_home') | list | count > 0) if people | count > 0 else true %}{%
      set held = ((as_timestamp(now()) - as_timestamp(states[dirs].last_changed, 0)) >= 60) if states[dirs]
      is not none else false %}{{ is_state(dirs, 'towards') and held and (states(prox) | float(10000))
      < home_zone_distance and travelling }}{% else %}False{% endif %}"
    time_since_change: "{% if helper_change and states(helper_change) not in ['unknown',
      'unavailable', ''] %}\n  {% set change_timestamp = as_timestamp(states(helper_change))
      %}\n  {% if change_timestamp %}\n    {{ (as_timestamp(now()) - change_timestamp)
      / 60 }}\n  {% else %}\n    999\n  {% endif %}\n{% else %}\n  999\n{% endif %}\n"
    time_in_current_mode: "{% set mode_time_val = states(helper_mode_time) if helper_mode_time
      else 'unknown' %} {% if mode_time_val not in ['unknown', 'unavailable', '',
      None] %}\n  {% set mode_timestamp = as_timestamp(mode_time_val) %}\n  {% if
      mode_timestamp %}\n    {{ ((as_timestamp(now()) - mode_timestamp) / 60) | round(1)
      | abs | float }}\n  {% else %}\n    {{ 0.0 }}\n  {% endif %}\n{% else %}\n  {{
      0.0 }}\n{% endif %}\n"
    # v9.20.0: while the unit is off, how long it has REALLY been off (its own last state
    # change). The mode clock is re-stamped by mode changes and the Room Empty / Away
    # bookkeeping, which held the 5-minute off-time protection armed for units that had been
    # off for hours (04/10: no pre-conditioning; 24-25/09: 5-8 minute delays after Override).
    # After an HA restart the unit's last change is the restart time, which errs on the
    # protected side.
    effective_off_time: "{% if actual_ac_state == 'off' and climate_list | length > 0 and states[climate_list[0]]
      is not none %}{{ ((as_timestamp(now()) - as_timestamp(states[climate_list[0]].last_changed, 0))
      / 60) | round(1) | abs | float }}{% else %}{{ time_in_current_mode | float(0) }}{% endif %}"
    temp_stability_time: "{% if helper_temp_history and helper_temp_stable_since %}\n
      \ {% set temp_diff = (current_temp - previous_temp) | abs %}\n  {% if temp_diff
      <= stability_tolerance %}\n    {% set stable_since = states(helper_temp_stable_since)
      %}\n    {% if stable_since not in ['unknown', 'unavailable', '', None] and not (stable_since | string).startswith('1970-01-01') %}\n
      \     {% set stable_timestamp = as_timestamp(stable_since) %}\n      {% if stable_timestamp
      %}\n        {{ ((as_timestamp(now()) - stable_timestamp) / 60) | round(1) }}\n
      \     {% else %}\n        0\n      {% endif %}\n    {% else %}\n      {# Stable
      since not set, assume just became stable #}\n      0\n    {% endif %}\n  {%
      else %}\n    {# Temperature changed significantly, stability time is 0 #}\n
      \   0\n  {% endif %}\n{% else %}\n  0\n{% endif %}\n"
    # v9.20.0: divided by the real age of previous_temp (the temp-history helper's last write,
    # last_reported; at least 1 minute). It always divided by the check interval, but only the
    # periodic run refreshes the helper, so a run one minute after it read a third of the real
    # rate: false stalls, wrong-direction escalation, effectiveness 95 -> 68.
    temp_change_rate: "{% if previous_temp > 0 and current_temp != previous_temp %}{% set st = states[helper_temp_history]
      if helper_temp_history else none %}{% if st is not none %}{% set window = [((as_timestamp(now())
      - as_timestamp(st.last_reported, 0)) / 60), 1.0] | max %}{% else %}{% set window = time_in_current_mode
      | float(1) %}{% endif %}{% if window > 0 %}{{ ((current_temp - previous_temp) / window) | round(3)
      }}{% else %}0{% endif %}{% else %}0{% endif %}"
    bed_eco_temp_stable: '{{ (temp_change_rate | abs) < bed_eco_stability_rate }}

      '
    # v9.20.0 (round 3): ONE Bed ECO stop point for every branch: target minus the larger of
    # Target Overshoot and Stop Below Target, and never below the floor (target minus Maximum
    # Overshoot). Continue-cooling used the sum of the two, so it cooled past the hand-over.
    bed_stop_point: "{{ ((target_temp | float(22)) - ([[target_overshoot | float(0), bed_eco_stop_below_target
      | float(0)] | max, bed_eco_max_overshoot | float(1)] | min)) | round(2) }}"
    # v9.20.0: no lower bound. "Too cold: stay in cooling" kept a room that had overshot the
    # floor (target - Maximum Overshoot) cooling all night, because below it the rest phase
    # could never start. Colder than the floor is all the more reason to stop.
    bed_eco_at_target: '{{ current_temp <= (target_temp + bed_eco_return_threshold) }}'
    bed_eco_should_fan_only: "{% if bed_eco_fan_only_mode not in ['enabled', 'ceiling_fan'] %}\n  False\n{%
      elif last_mode != 'bed_comfort_eco' %}\n  False\n{% elif current_temp < (target_temp - (bed_eco_max_overshoot
      | float(1))) %}\n  True\n{% elif not bed_eco_at_target
      %}\n  False\n{% else %}\n  {% set stability_met = bed_eco_temp_stable and (time_in_current_mode
      | float(0)) >= bed_eco_stability_minutes %}\n  {% set overshoot_target = bed_stop_point | float(0) %}\n  {% set temp_met = current_temp <= overshoot_target
      %}\n  {% if bed_eco_fan_only_trigger == 'temperature' %}\n    {{ temp_met }}\n
      \ {% elif bed_eco_fan_only_trigger == 'either' %}\n    {{ stability_met or temp_met
      }}\n  {% else %}\n    {{ stability_met }}\n  {% endif %}\n{% endif %}\n"
    bed_eco_should_return: '{{ last_mode == ''bed_eco_fan_only'' and current_temp
      > (target_temp + bed_eco_return_threshold) }}

      '
    calculated_trend: "{% if temp_change_rate > 0.2 %}\n  rising\n{% elif temp_change_rate
