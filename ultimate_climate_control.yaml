                message: '⚠️ {{ room_name | upper }} FAN-ONLY MODE NOT SUPPORTED

                  AC doesn''t support fan_only mode. Available modes: {{ available_modes
                  | join('', '') }}

                  Falling back to turning AC OFF instead.

                  Recommendation: Change "Stability Auto-Off Action" to "OFF" or "ECO"
                  in automation settings.

                  '
                level: warning
    - if:
      - condition: template
        value_template: '{{ enable_notifications }}'
      then:
      - repeat:
          for_each: '{{ notify_services_all }}'
          sequence:
          - service: '{{ repeat.item }}'
            data:
              title: '{{ room_name }} Climate Control'
              message: 'Temperature Stability: {{ stability_behavior }} (stable {{ time_in_current_mode
                | round(0) }}min, {{ current_temp }}°C)'
            continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ control_mode == ''Manual'' }}'
    - condition: template
      value_template: '{{ last_mode in [''stability_off'', ''stability_eco'', ''stability_fan_only'',
        ''auto_off_off'', ''auto_off_eco'', ''auto_off_fan_only'', ''smart_off'',
        ''smart_eco'', ''smart_maintain'', ''eco'', ''cooling'', ''heating''] }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F3AE Manual Mode: IMMEDIATE Control Restored \U0001F504
            Clearing \"{{ last_mode }}\" state instantly \U0001F4A1 You now have full
            manual control - no automation interference\n\U0001F4CB Technical: Manual
            mode = instant automation disable\n"
          level: warning
    - service: input_text.set_value
      target:
        entity_id: !input helper_last_mode
      data:
        value: manual
    - if:
      - condition: template
        value_template: '{{ dynamic_enabled and helper_mode_time not in [none, '''',
          ''unavailable'', ''unknown'', []] and helper_mode_time is string and helper_mode_time
          != '''' and (last_mode != ''manual'' or actual_ac_state == ''off'') }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'',
          []] and helper_change is string and helper_change != '''' }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_change }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: 'off'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_last_command }}'
        data:
          value: hvac=off,temp=0,fan=unknown,swing=unknown
        continue_on_error: true
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_state_checksum }}'
        data:
          value: '0'
        continue_on_error: true
    - service: climate.turn_off
      target:
        entity_id: !input climate_entities
      continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ control_mode == ''Smart'' or (control_mode == ''Override''
        and override_behavior == ''independent'' and override_source == ''ac'') }}'
    - condition: template
      value_template: '{{ not (bed_active | bool) }}'
    - condition: template
      value_template: '{{ not room_presence_detected }}'
    - condition: template
      value_template: '{{ minutes_since_presence >= presence_timeout }}'
    - condition: template
      value_template: '{{ proximity_zone == ''home'' or anyone_home }}'
    - condition: template
      # v9.20.0: its own eco/maintain state included (the runtime guard handed it to Away a
      # few minutes later, which cycled the unit about every 12 minutes).
      value_template: '{{ last_mode in [''ceiling_fan_cooling'', ''smart_off'', ''off'',
        ''away_off'', ''auto_off_off'', ''smart_'' ~ smart_behavior] or (time_in_current_mode | float(0)) >= (runtime_min
        | float(0)) }}'
    # v9.20.0: this branch still matches while the room stays empty (so Away cannot take a
    # room someone is still home for), but it only ACTS when something changes: with the
    # unit already off it used to re-send turn_off and re-stamp both clocks every run (53
    # times between 13:55 and 14:51 on 04/10 on the Office, which held the off-time
    # protection armed and blocked pre-conditioning).
    sequence:
    - if:
      - condition: template
        value_template: '{{ smart_behavior == ''off'' and helper_expected_hvac not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: 'off'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_mode not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_mode }}'
        data:
          value: smart_{{ smart_behavior }}
        continue_on_error: true
    # v9.20.0 (round 3): the mode clock moves with the label, right after it (an 'off' reached
    # with the AC already off never stamped it, and eco stamped it after its slow commands).
    - if:
      - condition: template
        value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] and last_mode != ''smart_''
          ~ smart_behavior }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled and last_mode not in [''smart_off'',
          ''away_off'', ''auto_off_off'', ''off'', ''smart_'' ~ smart_behavior] }}'
      then:
      - service: system_log.write
        data:
          message: "[EVENT] {{ room_name }} 🚪 | Room Empty: {{ smart_behavior | replace('_',
            ' ') | title }} | Absent {{ minutes_since_presence | round(0) }}min, was
            {{ last_mode | replace('_', ' ') | title }}, Room {{ current_temp }}°C"
          level: warning
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F6AA {{ room_name | upper }}: Smart Mode - Room Empty \U0001F4A1
            Nobody detected in {{ room_name }} for {{ minutes_since_presence | round(0)
            }} minutes \U0001F3E0 You're still home, so switching to {{ smart_behavior|upper
            }} mode to save energy\n\U0001F4CB Technical: {{ time_in_current_mode
            | round(1) }}min in current mode\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and
          fan_on_vacancy == ''off'' and ceiling_fan_is_on and helper_expected_ceiling_fan
          not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_ceiling_fan }}'
        data:
          value: 'off'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and
          fan_on_vacancy == ''off'' and ceiling_fan_is_on }}'
      then:
      - if:
        - condition: template
          value_template: '{{ event_logging_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "[EVENT] {{ room_name }} 🌀 | Ceiling Fan Off | Room empty, was {{
              last_mode | replace('_', ' ') | title }}, Room {{ current_temp }}°C"
            level: warning
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - service: switch.turn_off
            target:
              entity_id:
              - '{{ ceiling_fan_low_switch }}'
              - '{{ ceiling_fan_medium_switch }}'
              - '{{ ceiling_fan_high_switch }}'
            continue_on_error: true
        default:
        - service: homeassistant.turn_off
          target:
            entity_id: '{{ ceiling_fan_entities }}'
          continue_on_error: true
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ smart_behavior == ''off'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ actual_ac_state == ''on'' }}'
          then:
          - if:
            - condition: template
              value_template: '{{ helper_change not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_datetime.set_datetime
              target:
                entity_id: !input helper_last_change
              data:
                datetime: '{{ now() }}'
              continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ helper_last_command not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_last_command }}'
              data:
                value: hvac=off,temp=0,fan=unknown,swing=unknown
              continue_on_error: true
            - service: input_number.set_value
              target:
                entity_id: '{{ helper_state_checksum }}'
              data:
                value: '0'
              continue_on_error: true
          - service: climate.turn_off
            target:
              entity_id: !input climate_entities
            continue_on_error: true
      - conditions:
        - condition: template
          value_template: '{{ smart_behavior == ''eco'' }}'
        sequence:
        - variables:
            expected_temp: "{% if current_temp > comfort_max_temp %}\n  {{ comfort_max_temp
              + eco_mode_setpoint_offset }}\n  {% elif current_temp < comfort_min_temp
              %}\n  {{ comfort_min_temp - eco_mode_setpoint_offset }}\n  {% else %}\n
              \ {{ target_temp }}\n{% endif %}\n"
            # v9.20.0 (round 3): a unit that stopped at target is left off inside the comfort band,
            # and nothing records it as running then: an expected 'cool' against an off unit read
            # as a remote press two checks later and latched Override for 2 hours.
            eco_any_active: "{% set ns = namespace(on=false) %}{% for e in climate_list %}{% if states(e) != 'off'
              or current_temp > comfort_max_temp or current_temp < comfort_min_temp %}{% set ns.on = true %}{% endif
              %}{% endfor %}{{ ns.on }}"
        - if:
          - condition: template
            value_template: '{{ eco_any_active | bool }}'
          then:
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_expected_temp }}'
            data:
              value: '{{ expected_temp }}'
            continue_on_error: true
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - variables:
                current_entity: '{{ repeat.item }}'
                available_modes: '{{ (state_attr(repeat.item, ''hvac_modes'') or []) | list
                  }}'
                available_fans: '{{ (state_attr(repeat.item, ''fan_modes'') or []) | list
                  }}'
                expected_hvac_mode: "{% set modes = (state_attr(repeat.item, 'hvac_modes') or [])
                  | list %} {# Prefer auto/heat_cool only if both heating and cooling
                  enabled #} {% if enable_cooling and enable_heating and 'auto' in
                  modes %}\n  auto\n{% elif enable_cooling and enable_heating and
                  'Auto' in modes %}\n  Auto\n{% elif enable_cooling and enable_heating
                  and 'heat_cool' in modes %}\n  heat_cool\n{% elif enable_cooling
                  and enable_heating and 'Heat/Cool' in modes %}\n  Heat/Cool\n{%
                  elif current_temp > comfort_max_temp and enable_cooling and 'cool'
                  in modes %}\n  cool\n{% elif current_temp > comfort_max_temp and
                  enable_cooling and 'Cool' in modes %}\n  Cool\n{% elif current_temp
                  < comfort_min_temp and enable_heating and 'heat' in modes %}\n  heat\n{%
                  elif current_temp < comfort_min_temp and enable_heating and 'Heat'
                  in modes %}\n  Heat\n{% elif enable_cooling and 'cool' in modes
                  %}\n  cool\n{% elif enable_cooling and 'Cool' in modes %}\n  Cool\n{%
                  elif enable_heating and 'heat' in modes %}\n  heat\n{% elif enable_heating
                  and 'Heat' in modes %}\n  Heat\n{% else %}\n  off\n{% endif %}\n"
                expected_fan_mode: '{{ new_fan_mode }}'
                eco_leave_off: "{{ states(repeat.item) == 'off' and current_temp <= comfort_max_temp and current_temp
                  >= comfort_min_temp }}"
                # v9.20.0: only what differs is sent (it re-sent all of it on every run), judged
                # against the unit's step, so a whole-degree unit is not re-sent every run.
                eco_needs_setpoint: "{% set step = state_attr(repeat.item, 'target_temp_step') | float(0.5) %}{{ not
                  (eco_leave_off | bool) and (states(repeat.item) != expected_hvac_mode or ((state_attr(repeat.item,
                  'temperature') | float(-99)) - (expected_temp | float(0))) | abs >= ([0.3, step * 0.99] | max)) }}"
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_hvac }}'
              data:
                value: "{{ 'off' if (eco_leave_off | bool) else expected_hvac_mode }}"
              continue_on_error: true
            - if:
              - condition: template
                value_template: '{{ not (eco_leave_off | bool) }}'
              then:
              - service: input_text.set_value
                target:
                  entity_id: '{{ helper_expected_fan }}'
                data:
                  value: '{{ expected_fan_mode }}'
                continue_on_error: true
            - if:
              - condition: template
                value_template: '{{ eco_needs_setpoint | bool }}'
              then:
              - service: climate.set_temperature
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  temperature: '{{ expected_temp }}'
                  hvac_mode: '{{ expected_hvac_mode }}'
                continue_on_error: true
            - if:
              - condition: template
                value_template: '{{ not (eco_leave_off | bool) and expected_hvac_mode != ''off'' and (state_attr(current_entity,
                  ''fan_mode'') | string | trim) != (expected_fan_mode | string | trim) }}'
              then:
              - service: climate.set_fan_mode
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  fan_mode: '{{ expected_fan_mode }}'
                continue_on_error: true
            # v9.14.0 (bug 3): swing is a fixed input; only send it when the unit differs.
            - if:
              - condition: template
                value_template: '{{ not (eco_leave_off | bool) and expected_hvac_mode != ''off'' and validated_swing_mode not in
                  [''none'', '''', ''unavailable'', ''unknown''] and state_attr(current_entity, ''swing_mode'') != validated_swing_mode }}'
              then:
              - service: climate.set_swing_mode
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  swing_mode: '{{ validated_swing_mode }}'
                continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and (eco_any_active | bool) and helper_last_fan_change not in
              [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_last_fan_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ last_mode != ''smart_eco'' and (eco_any_active | bool) }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F321️ {{ room_name | upper }} TEMP SET: Smart Room Eco
                Mode Set AC to: {{ expected_temp | round(0) }}°C (rounded for AC compatibility)
                Actual value: {{ expected_temp | round(1) }}°C Reason: {{ 'Eco cooling
                (comfort max +' + eco_mode_setpoint_offset|string + '°C)' if current_temp
                > comfort_max_temp else 'Eco heating (comfort min -' + eco_mode_setpoint_offset|string
                + '°C)' if current_temp < comfort_min_temp else 'Direct target (within
                comfort zone)' }} Current: {{ current_temp | round(1) }}°C → Comfort
                range: {{ comfort_min_temp | round(1) }}-{{ comfort_max_temp | round(1)
                }}°C\n"
              level: warning
      - conditions:
        - condition: template
          value_template: '{{ smart_behavior == ''maintain'' }}'
        sequence:
        # v9.20.0: a running unit is held at the drive setpoint, sent only when it changed
        # (setpoint_change_due); a unit that is off is left off.
        - if:
          - condition: template
            value_template: '{{ actual_ac_state == ''on'' and (setpoint_change_due | bool) }}'
          then:
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_expected_temp }}'
            data:
              value: '{{ adjusted_target }}'
            continue_on_error: true
          - repeat:
              for_each: '{{ climate_list }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ states(repeat.item) not in [''off'', ''unavailable'', ''unknown''] }}'
                then:
                - service: climate.set_temperature
                  target:
                    entity_id: '{{ repeat.item }}'
                  data:
                    temperature: '{{ adjusted_target }}'
                  continue_on_error: true
          - service: system_log.write
            data:
              message: "\U0001F321️ {{ room_name | upper }} TEMP SET: Smart Room Maintain
                Set AC to: {{ adjusted_target | round(0) }}°C (rounded for AC compatibility)
                Actual value: {{ adjusted_target | round(1) }}°C Reason: Smart mode
                maintain current temperature (room empty but still home) Current: {{
                current_temp | round(1) }}°C → Target: {{ adjusted_target | round(1)
                }}°C\n"
              level: warning
    - if:
      - condition: template
        value_template: '{{ enable_notifications and last_mode not in [''smart_off'', ''away_off'', ''auto_off_off'',
          ''off'', ''smart_'' ~ smart_behavior] }}'
      then:
      - repeat:
          for_each: '{{ notify_services_all }}'
          sequence:
          - service: '{{ repeat.item }}'
            data:
              title: '{{ room_name }} Climate Control'
              message: 'Smart Mode: {{ smart_behavior }} (room empty {{ minutes_since_presence
                | round(0) }}min, {{ current_temp }}°C)'
            continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ enable_away_mode }}'
    - condition: template
      value_template: '{{ not should_activate }}'
    # v9.20.0: Away means nobody home. In a Smart room "not active" is also true when the
    # room is merely empty, and Away switched rooms off with people home (04/10 13:40,
    # Office, while Chris's phone briefly read the garage); Room Empty owns that case.
    - condition: template
      value_template: '{{ not (anyone_home | bool) }}'
    # v9.20.0 (round 3): the runtime guard reads the mode clock, as Room Empty's does. The last
    # change was stamped by every cooling check, so a house emptied mid-run waited 10 m 48 s at
    # 18.0 / fan 5 before Away acted (Living Room replay, 04/10 13:49 to 14:00).
    - condition: template
      value_template: '{{ last_mode in [''ceiling_fan_cooling'', ''smart_off'', ''off'', ''away_off'', ''auto_off_off'',
        ''away_eco'', ''away_maintain'', ''smart_eco'', ''smart_maintain''] or (time_in_current_mode | float(0)) >= (runtime_min
        | float(0)) }}'
    # v9.20.0: act only when something changes (it re-sent turn_off and re-stamped both
    # clocks for a unit already off, and eco/maintain re-sent or re-logged every run).
    # Round 3: eco is re-sent to a unit that did not take it, and Maintain is recorded once.
    - condition: template
      value_template: '{{ (ceiling_fan_configured and not fan_override_active and fan_on_vacancy == ''off''
        and (ceiling_fan_is_on | bool)) or (away_action == ''off'' and (actual_ac_state == ''on'' or last_mode not in
        [''off'', ''smart_off'', ''away_off'', ''auto_off_off''])) or (away_action == ''eco'' and (last_mode != ''away_eco''
        or (away_eco_needs_send | bool))) or (away_action == ''maintain'' and actual_ac_state == ''on'' and (last_mode
        != ''away_maintain'' or (setpoint_change_due | bool))) }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and fan_on_vacancy == ''off''
          and ceiling_fan_is_on and helper_expected_ceiling_fan not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_ceiling_fan }}'
        data:
          value: 'off'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and fan_on_vacancy == ''off''
          and ceiling_fan_is_on }}'
      then:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - service: switch.turn_off
            target:
              entity_id:
              - '{{ ceiling_fan_low_switch }}'
              - '{{ ceiling_fan_medium_switch }}'
              - '{{ ceiling_fan_high_switch }}'
            continue_on_error: true
        default:
        - service: homeassistant.turn_off
          target:
            entity_id: '{{ ceiling_fan_entities }}'
          continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F50D {{ room_name | upper }} CLIMATE DEBUG: Away mode activated
            Action: {{ away_action }} Nobody home detected Time since last change:
            {{ time_since_change | round(1) }} min\n"
          level: warning
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ away_action == ''off'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ actual_ac_state == ''on'' and helper_change not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_last_change
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: 'off'
            continue_on_error: true
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_mode }}'
          data:
            value: 'off'
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ actual_ac_state == ''on'' }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_mode_start_time
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_last_command not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_last_command }}'
            data:
              value: hvac=off,temp=0,fan=unknown,swing=unknown
            continue_on_error: true
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_state_checksum }}'
            data:
              value: '0'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ actual_ac_state == ''on'' }}'
          then:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entities
            continue_on_error: true
      - conditions:
        - condition: template
          value_template: '{{ away_action == ''eco'' }}'
        sequence:
        - variables:
            # v9.7.13 FIX: same as auto_off_eco - coerce target_temp strings to float.
            # v9.20.0: a cooling-only house is held at the cooling target plus the offset (in the
            # comfort band it took the HEATING target minus the offset: 22 - 2 = 20, cooling an
            # empty house to 20).
            eco_target: '{{ away_eco_target | float(0) }}'
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_mode }}'
          data:
            value: away_eco
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] and last_mode != ''away_eco'' }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_mode_time }}'
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - service: input_number.set_value
          target:
            entity_id: '{{ helper_expected_temp }}'
          data:
            value: '{{ eco_target }}'
          continue_on_error: true
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - variables:
                current_entity: '{{ repeat.item }}'
                available_modes: '{{ (state_attr(repeat.item, ''hvac_modes'') or []) | list
                  }}'
                available_fans: '{{ (state_attr(repeat.item, ''fan_modes'') or []) | list
                  }}'
                # v9.20.0: heat/cool only when BOTH are enabled (it picked heat_cool on these
                # units with heating disabled).
                # explicit cool or heat, never single-setpoint auto (that could cool an empty
                # house towards the heating eco target)
                selected_hvac_mode: "{% if enable_cooling and 'cool' in available_modes and (current_temp >= (target_temp
                  | float(22)) or not enable_heating) %}cool{% elif enable_heating and 'heat' in available_modes %}heat{%
                  elif enable_cooling and 'cool' in available_modes %}cool{% else %}off{% endif %}"
                selected_fan_mode: "{% if is_precond_mode and precond_validated_fan_mode
                  != 'Dynamic' %}\n  {{ precond_validated_fan_mode }}\n{% else %}\n
                  \ {{ new_fan_mode }}\n{% endif %}\n"
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_hvac }}'
              data:
                value: '{{ selected_hvac_mode }}'
              continue_on_error: true
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_fan }}'
              data:
                value: '{{ selected_fan_mode }}'
              continue_on_error: true
            - service: climate.set_temperature
              target:
                entity_id: '{{ current_entity }}'
              data:
                temperature: '{{ eco_target }}'
                hvac_mode: '{{ selected_hvac_mode }}'
              continue_on_error: true
            - delay:
                milliseconds: 500
            - service: climate.set_fan_mode
              target:
                entity_id: '{{ current_entity }}'
              data:
                fan_mode: '{{ selected_fan_mode }}'
              continue_on_error: false
            - delay:
                milliseconds: 500
            # v9.14.0 (bug 3): swing is a fixed input; only send it when the unit differs.
            - if:
              - condition: template
                value_template: '{{ validated_swing_mode != ''none'' and state_attr(current_entity, ''swing_mode'') != validated_swing_mode }}'
              then:
              - service: climate.set_swing_mode
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  swing_mode: '{{ validated_swing_mode }}'
                continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and helper_last_fan_change not in
              [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_last_fan_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
        - service: system_log.write
          data:
            message: "\U0001F321️ {{ room_name | upper }} TEMP SET: Away Eco Mode
              Set AC to: {{ eco_target | round(0) }}°C (rounded for AC compatibility)
              Actual value: {{ eco_target | round(1) }}°C Reason: {{ 'Eco cooling
              (target +' + eco_mode_setpoint_offset|string + '°C offset)' if current_temp
              > comfort_max_temp else 'Eco heating (target -' + eco_mode_setpoint_offset|string
              + '°C offset)' }} Current: {{ current_temp | round(1) }}°C → Comfort
              range: {{ comfort_min_temp | round(1) }}-{{ comfort_max_temp | round(1)
              }}°C\n"
            level: warning
      # v9.20.0 (round 3): Maintain keeps the unit running. It is recorded so the safety nets leave
      # it running (they switched it off, so Maintain behaved as Off in a Smart room). Round 4: and
      # holds the room at the target like Room Empty's Maintain (it froze whatever the unit was
      # doing, e.g. a pull-down at 18 and fan 5, for the whole absence).
      - conditions:
        - condition: template
          value_template: '{{ away_action == ''maintain'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ actual_ac_state == ''on'' and last_mode != ''away_maintain'' }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_mode }}'
            data:
              value: away_maintain
            continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_datetime.set_datetime
              target:
                entity_id: '{{ helper_mode_time }}'
              data:
                datetime: '{{ now() }}'
              continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ actual_ac_state == ''on'' and (setpoint_change_due | bool) }}'
          then:
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_expected_temp }}'
            data:
              value: '{{ adjusted_target }}'
            continue_on_error: true
          - repeat:
              for_each: '{{ climate_list }}'
              sequence:
              - if:
                - condition: template
