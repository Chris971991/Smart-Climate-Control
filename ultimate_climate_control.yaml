  # M31: independent AC-only override still runs the ceiling-fan handlers via a CONTAINED
  # sub-sequence at the single Override choke point (the main dispatch stays fully blocked
  # by this stop - no AC-commanding branch is ever reached during Override). Fan ON/OFF
  # only; SPEED escalation is intentionally NOT managed during AC override.
  # On/off is EDGE-triggered (`not ceiling_fan_is_on` / `ceiling_fan_is_on`) so this does
  # not re-issue commands every trigger for the whole multi-hour override. The fan commands
  # produce ceiling_fan_state_change triggers, but the global condition (line ~5577) ignores
  # our own service calls (parent_id) so they can't restart-kill this run mid-choose, and
  # the detector ignores automation-context changes so no self-override.
  # NOTE: duplicated on/off logic mirrors the main fan branches (turn-on ~10321, shutdown
  # ~12588) - keep both sites in sync.
  - if:
    - condition: template
      value_template: "{{ override_behavior == 'independent' and override_source == 'ac'\n
        \  and ceiling_fan_configured and not fan_override_active }}\n"
    then:
    - choose:
      # Branch A - fan SHOULD run and is currently OFF (edge-triggered turn-on)
      # v9.20.0: the fan is wanted in the fan zone, and with Fan With AC on whenever the user's
      # AC is cooling or the room is above the zone (normal control runs it with the AC there;
      # 03/10 the Office fan was switched off at 25.1 and the room reached 27.2 with nothing
      # running). The same gates as the normal fan start: someone there (Instant entry
      # included), a live sensor, no pre-conditioning 'skip' on the way home, not in the
      # Auto-Off window, not over a bed whose fan setting is off.
      - conditions:
        - condition: template
          value_template: "{{ ((should_activate | bool) or (override_base_mode == 'Smart' and fan_presence_entry
            == 'instant' and (room_presence_detected | bool) and ((anyone_home | bool) or (persons | count) == 0)))
            and enable_cooling and (temp_sensor_available | bool) and not (ceiling_fan_bed_blocked | bool) and not
            (auto_off_conditions_active | bool) and not (enable_pre_conditioning and (approaching_home | bool) and
            not (anyone_home | bool) and fan_precondition_mode == 'skip') and (((in_ceiling_fan_zone | bool) and not
            (fan_with_ac_mode == 'off' and states(climate_list[0]) == 'cool')) or (fan_with_ac_mode == 'on' and
            ((current_temp | float(0)) > (ceiling_fan_zone_max | float(0)) or states(climate_list[0]) == 'cool')))
            and not (ceiling_fan_is_on | bool) }}"
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_ceiling_fan }}'
            data:
              value: 'on'
            continue_on_error: true
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ceiling_fan_has_speed_switches }}'
            sequence:
            # M38: break-before-make - release the non-target speed relays first
            - if:
              - condition: template
                value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
              then:
              - service: switch.turn_off
                target:
                  entity_id: '{{ ceiling_fan_other_switches }}'
                continue_on_error: true
            - delay:
                milliseconds: 100
            - service: switch.turn_on
              target:
                entity_id: '{{ ceiling_fan_target_switch }}'
              continue_on_error: true
          - conditions:
            - condition: template
              value_template: '{{ ceiling_fan_domain == ''fan'' }}'
            sequence:
            - service: fan.turn_on
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
            - delay:
                milliseconds: 500
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ ceiling_fan_has_presets }}'
                sequence:
                - service: fan.set_preset_mode
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  data:
                    preset_mode: '{{ ceiling_fan_target_speed }}'
                  continue_on_error: true
              default:
              - service: fan.set_percentage
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                data:
                  percentage: '{{ ceiling_fan_target_pct }}'
                continue_on_error: true
          default:
          - service: homeassistant.turn_on
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            continue_on_error: true
      # Branch B: fan is ON but should stop.
      # v9.20.0: the fan stops for the same reasons normal control stops it: an empty room
      # past the presence timeout (02/10 the Office relay switched 22 times in 19 minutes on
      # BLE/motion flicker) when Fan When Room Empty is off, the Auto-Off window, Fan in Bed
      # off, Fan at Target off with the room at the stop point and the AC not cooling, or Fan
      # With AC off while the AC cools (round 3: in the zone too; Branch A no longer starts it
      # there). With Replace AC it keeps running below the zone, as after a normal stop (it was
      # switched off at 22.2 under a cooling AC).
      - conditions:
        - condition: template
          value_template: "{{ (ceiling_fan_is_on | bool) and ((not (should_activate | bool) and (override_base_mode
            != 'Smart' or (minutes_since_presence | float(0)) >= (presence_timeout | float(0))) and fan_on_vacancy
            == 'off') or (auto_off_conditions_active | bool) or (ceiling_fan_bed_blocked | bool) or (fan_at_target_temp
            == 'off' and states(climate_list[0]) != 'cool' and (current_temp | float(0)) <= ((target_temp | float(22))
            - (target_overshoot | float(0)))) or (fan_with_ac_mode == 'off' and states(climate_list[0]) == 'cool')) }}"
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_ceiling_fan }}'
            data:
              value: 'off'
            continue_on_error: true
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ceiling_fan_has_speed_switches }}'
            sequence:
            - service: switch.turn_off
              target:
                entity_id:
                - '{{ ceiling_fan_low_switch }}'
                - '{{ ceiling_fan_medium_switch }}'
                - '{{ ceiling_fan_high_switch }}'
              continue_on_error: true
          default:
          - service: homeassistant.turn_off
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            continue_on_error: true
  - stop: Override mode active - respecting user's manual changes
- choose:
  - conditions:
    - condition: template
      value_template: "{{ control_mode_helper not in [none, '', 'unavailable', 'unknown']\n
        \  and is_state(control_mode_helper, 'Override') }}\n"
    sequence:
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F6E1️ {{ room_name | upper }} DEFENSIVE CHECK: Override
            mode detected via helper state • control_mode variable: {{ control_mode
            }} • control_mode_helper state: {{ states(control_mode_helper) }} • This
            prevents AC control when Override was just activated • Stopping automation
            to respect user's manual changes\n"
          level: warning
    - stop: Override mode active (helper state check) - respecting user's manual changes
  - conditions:
    - condition: template
      value_template: '{{ control_mode == ''Manual'' }}'
    # v9.20.0: an extreme room temperature with someone there (or on the way) falls through
    # to normal control, as the Extreme Temperature Override input promises, and the run it
    # starts is finished to the target (entering Manual records 'off', so a cooling/heating
    # last mode with the unit on can only be that run). It used to be left at the pull-down
    # setpoint and fan 5 once the room dropped below the extreme threshold.
    - condition: template
      value_template: '{{ not (extreme_temp_detected in [''hot'', ''cold''] and ((room_presence_detected
        | bool) or (approaching_home | bool))) and not (last_mode in [''cooling'', ''heating''] and
        actual_ac_state == ''on'') }}'
    sequence:
    # v9.20.0: a cooling/heating record left by an extreme-temperature run that you ended
    # (remote off) is cleared, so a unit you later switch on by hand is not taken over; the
    # ceiling fan that run switched on goes off with it.
    - if:
      - condition: template
        value_template: '{{ last_mode in [''cooling'', ''heating''] and climate_list | length > 0 and states(climate_list[0])
          == ''off'' }}'
      then:
      # v9.20.0 (round 3): the fan first, then the label and the clock: the fan step is keyed on
      # the cooling/heating label, so a run cut after the label left the fan on for good.
      - if:
        - condition: template
          value_template: '{{ ceiling_fan_configured and not fan_override_active and (ceiling_fan_is_on | bool)
            and helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] and states(helper_expected_ceiling_fan)
            == ''on'' }}'
        then:
        - if:
          - condition: template
            value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_ceiling_fan }}'
            data:
              value: 'off'
            continue_on_error: true
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ceiling_fan_has_speed_switches }}'
            sequence:
            - service: switch.turn_off
              target:
                entity_id:
                - '{{ ceiling_fan_low_switch }}'
                - '{{ ceiling_fan_medium_switch }}'
                - '{{ ceiling_fan_high_switch }}'
              continue_on_error: true
          default:
          - service: homeassistant.turn_off
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            continue_on_error: true
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_mode }}'
        data:
          value: 'off'
        continue_on_error: true
      - service: input_datetime.set_datetime
        target:
          entity_id: !input helper_mode_start_time
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ manual_timeout_hours > 0 }}'
      # v9.11.0: When Manual is the room's Default Control Mode, Manual IS the
      # intended steady state - never auto-revert it to Smart on timeout.
      - condition: template
        value_template: "{{ default_control_mode != 'Manual' }}"
      - condition: template
        value_template: "{% if helper_change and states(helper_change) not in ['unknown',
          'unavailable', ''] %}\n  {% set change_timestamp = as_timestamp(states(helper_change))
          %}\n  {% if change_timestamp %}\n    {% set time_in_manual = (as_timestamp(now())
          - change_timestamp) / 3600 %}\n    {{ time_in_manual >= manual_timeout_hours
          }}\n  {% else %}\n    false\n  {% endif %}\n{% else %}\n  false\n{% endif
          %}\n"
      then:
      - service: system_log.write
        data:
          message: '{% set change_timestamp = as_timestamp(states(helper_change))
            %} ⏰ {{ room_name | upper }} MANUAL MODE TIMEOUT: Returning to automation
            • Manual timeout reached: {{ manual_timeout_hours }} hours • Time in manual:
            {{ ((as_timestamp(now()) - change_timestamp) / 3600) | round(1) if change_timestamp
            else ''N/A'' }}h • Switching back to {{ default_control_mode }} mode - automation will resume
            • AC will continue running under normal automation control

            '
          level: warning
      - service: input_text.set_value
        target:
          entity_id: !input helper_last_mode
        data:
          value: manual_timeout_return_to_smart
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ enable_notifications }}'
        then:
        - repeat:
            for_each: '{{ notify_services_all }}'
            sequence:
            - service: '{{ repeat.item }}'
              data:
                title: '{{ room_name }} Climate Control'
                message: Manual timeout ({{ manual_timeout_hours }}h) - switched back
                  to {{ default_control_mode }} mode
              continue_on_error: true
      # v9.13.0: select LAST (fires mode_change -> restart).
      - if:
        - condition: template
          value_template: '{{ control_mode_helper not in [none, '''', ''unavailable'',
            ''unknown''] }}'
        then:
        # v9.14.0 (bug 6): was a hardcoded 'Smart'. A room whose default is Auto has
        # no presence sensors and Smart is structurally dead there.
        - service: input_select.select_option
          target:
            entity_id: '{{ control_mode_helper }}'
          data:
            option: '{{ default_control_mode }}'
          continue_on_error: true
      - stop: Manual mode timeout - returned to default control mode
      else:
      - if:
        - condition: template
          value_template: '{{ debug_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "{% set change_timestamp = as_timestamp(states(helper_change))
              %} \U0001F3AE {{ room_name | upper }} MANUAL MODE: Full user control
              active • Temperature: {{ current_temp }}°C • Timeout setting: {{ manual_mode_timeout
              }} ({{ manual_timeout_hours }}h) {% if manual_timeout_hours > 0 %} •
              Time remaining: {{ (manual_timeout_hours - ((as_timestamp(now()) - change_timestamp)
              / 3600)) | round(1) if change_timestamp else 'N/A' }}h {% else %} •
              No timeout - manual until you change it {% endif %} • FULL CONTROL:
              Set any temp/fan remotely - NO automation interference • Perfect for
              pre-conditioning rooms before arrival!\n"
            level: debug
      - stop: Manual mode active - user has complete control
  - conditions:
    # M34: match regardless of debug_enabled so an unavailable AC always skips the
    # downstream AC-commanding branches (which would crash on None|list patterns).
    # debug gating now lives only on the log step inside this branch.
    - condition: template
      value_template: '{{ any_ac_unavailable }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F50C {{ room_name | upper }} AC UNAVAILABLE: Skipping manual
            override detection • AC disconnected - this is a known issue • Manual override
            detection disabled while unavailable • Automation will resume when AC reconnects
            • AC entity states: {% for entity in climate_list %}{{ entity }}={{ states(entity)
            }}{% if not loop.last %}, {% endif %}{% endfor %}\n"
          level: warning
  # LOW-dead-manual-branch: removed an unreachable choose branch (condition
  # 'control_mode == Override and manual_override_detection | bool'). It was provably
  # dead - manual_override_detection hard-returns false when control_mode == 'Override',
  # and the unconditional Override stop (~8919) already halts every Override run first.
  - conditions:
    - condition: template
      value_template: '{{ is_precond_mode }}'
    - condition: template
      value_template: '{{ states(climate_list[0]) in [''cool'', ''heat''] }}'
    - condition: template
      value_template: '{% set current_fan = state_attr(climate_list[0], ''fan_mode'')
        %} {% set fan_wrong = precond_validated_fan_mode != ''Dynamic'' and state_attr(climate_list[0],
        ''preset_mode'') != ''boost'' and (current_fan | string | trim) != (precond_validated_fan_mode
        | string | trim) %} {% set
        current_temp = state_attr(climate_list[0], ''temperature'') | float(-1) %} {%
        set ac_state = states(climate_list[0]) %} {% set boost_temp = ac_min_resolved
        | float(18) if ac_state == ''cool'' else ac_max_resolved | float(30) %} {%
        set temp_wrong = precond_boost_enabled and (current_temp | round(1) != boost_temp
        | round(1)) %} {{ fan_wrong or temp_wrong }}

        '
    sequence:
    - variables:
        precond_ac_state: '{{ states(climate_list[0]) }}'
        precond_boost_temp: '{{ ac_min_resolved | float(18) if precond_ac_state ==
          ''cool'' else ac_max_resolved | float(30) }}'
        precond_current_temp: '{{ state_attr(climate_list[0], ''temperature'') | float(-1)
          }}'
        precond_current_fan: '{{ state_attr(climate_list[0], ''fan_mode'') }}'
        # v9.20.0: 'Dynamic' is not a fan mode any unit has (sending it aborted the run),
        # and a fan command cancels Powerful on a Daikin.
        precond_fan_needs_fix: '{{ precond_validated_fan_mode != ''Dynamic'' and state_attr(climate_list[0],
          ''preset_mode'') != ''boost'' and (precond_current_fan | string | trim) != (precond_validated_fan_mode
          | string | trim) }}'
        precond_temp_needs_fix: '{{ precond_boost_enabled and (precond_current_temp
          | round(1) != precond_boost_temp | round(1)) }}'
    - service: system_log.write
      data:
        message: "\U0001F3AF {{ room_name | upper }} PRE-CONDITIONING CORRECTION:
          • Current fan: {{ precond_current_fan }} → Target: {{ precond_validated_fan_mode
          }} (fix: {{ precond_fan_needs_fix }}) • Current temp: {{ precond_current_temp
          }}°C → Boost: {{ precond_boost_temp }}°C (fix: {{ precond_temp_needs_fix
          }}, enabled: {{ precond_boost_enabled }}) • AC mode: {{ precond_ac_state
          }}\n"
        level: warning
    # v9.20.0: helpers before the commands, and a device fault no longer aborts the run.
    - if:
      - condition: template
        value_template: '{{ precond_fan_needs_fix }}'
      then:
      - if:
        - condition: template
          value_template: '{{ helper_last_fan_change not in [none, '''', ''unavailable'',
            ''unknown''] }}'
        then:
        - service: input_datetime.set_datetime
          target:
            entity_id: '{{ helper_last_fan_change }}'
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_fan }}'
          data:
            value: '{{ precond_validated_fan_mode }}'
          continue_on_error: true
      - service: climate.set_fan_mode
        target:
          entity_id: '{{ climate_list[0] }}'
        data:
          fan_mode: '{{ precond_validated_fan_mode }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ precond_temp_needs_fix }}'
      then:
      - if:
        - condition: template
          value_template: '{{ helper_expected_temp not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_number.set_value
          target:
            entity_id: '{{ helper_expected_temp }}'
          data:
            value: '{{ precond_boost_temp }}'
          continue_on_error: true
      - service: climate.set_temperature
        target:
          entity_id: '{{ climate_list[0] }}'
        data:
          temperature: '{{ precond_boost_temp }}'
        continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ (should_activate | bool) or (is_precond_mode | bool) }}'
    - condition: template
      value_template: '{{ last_mode in [''cooling'', ''bed_comfort_eco'', ''bed_comfort_quiet'']
        or ((is_precond_mode | bool) and states(climate_list[0]) == ''cool'') }}'
    - condition: template
      value_template: '{{ current_temp <= comfort_max_temp or (is_precond_mode | bool)
        or (last_mode in [''bed_comfort_eco'', ''bed_comfort_quiet''] and (bed_active | bool)) }}'
    # v9.20.0: the whole band down to the stop point. It ended half the hysteresis below the
    # comfort ceiling, and the cooling entry only acts above the ceiling, so nothing managed a
    # running unit in between: the setpoint froze at the pull-down value and the comfort-zone
    # stop switched it off above target (04/10 Living Room 15:21 at 22.3; on the Office, with
    # hysteresis 1.0, the window was empty). The bed counts through a bathroom trip.
    - condition: template
    # v9.20.0 (round 3): in bed, down to the shared Bed ECO stop point (it used the sum of
    # overshoot and Stop Below, so a Bed ECO room was cooled past the hand-over point).
      value_template: '{% set overshoot_target = target_temp - target_overshoot %} {{ (current_temp
        > overshoot_target and current_temp <= comfort_max_temp) or (is_precond_mode | bool) or (last_mode
        in [''bed_comfort_eco'', ''bed_comfort_quiet''] and (bed_active | bool) and current_temp > (bed_stop_point
        | float(0))) }}'
    - condition: template
      value_template: '{{ enable_cooling }}'
    # v9.20.0: the Auto-Off window takes over an established run (it only acted once the
    # run had ended by itself).
    - condition: template
      value_template: '{{ (is_precond_mode | bool) or not ((auto_off_conditions_active | bool) and control_mode
        in [''Smart'', ''Auto'']) }}'
    sequence:
    # v9.20.0 (round 3): no last-change stamp on every check (451 in 5.5 hours on the Office);
    # it is stamped below only when a command goes out.
    - variables:
        continue_fan_mode: "{% if is_precond_mode and precond_validated_fan_mode !=
          'Dynamic' %}\n  {{ precond_validated_fan_mode }}\n{% else %}\n  {{ new_fan_mode
          }}\n{% endif %}\n"
        continue_hvac_mode: "{% set modes = (state_attr(climate_list[0], 'hvac_modes') or [])
          | list %} {% if 'cool' in modes %}\n  cool\n{% elif 'Cool' in modes %}\n
          \ Cool\n{% else %}\n  {{ modes[0] if modes else 'cool' }}\n{% endif %}\n"
        # v9.15.4: the setpoint decision is made ONCE per run and shared by the
        # command and by every helper write below. v9.15.2/3 decided it per entity
        # and still wrote the expected-temp helper with the NEW target even when the
        # hold suppressed the command, so the hold clock (that helper's last_changed)
        # restarted without a command and the setpoint could be starved indefinitely,
        # while the last-command snapshot drifted away from the unit. Now:
        #   setpoint_send  = a unit is out of its expected mode, OR the target changed
        #                    and the last SENT setpoint is older than setpoint_hold.
        #   commanded_temp = adjusted_target when sending, else the last SENT value,
        #                    so the helpers only move when a command actually went out
        #                    (input_number ignores same-value writes).
        # v9.15.5: "the target changed" is now judged against the UNIT's reported setpoint,
        # not the helper, so a command that was sent but never recorded (run cancelled) or
        # recorded but never sent is corrected on the next check instead of being trusted
        # forever. Within 0.3°C counts as equal (a BRP072C rounds 18.6 to 18.5), and a unit
        # sitting on its min/max limit with the target beyond it counts as equal (BRP084
        # clipping). The helper is still the hold clock, written just BEFORE the command.
        # v9.19.0: the setpoint half of this decision is the shared setpoint_change_due
        # (same 0.3 / clipping / hold rules, plus harder moves go at once).
        setpoint_send: "{% set ns = namespace(wrong=false) %}{% for e in climate_list %}{%
          if states(e) != continue_hvac_mode %}{% set ns.wrong = true %}{% endif %}{% endfor
          %}{{ ns.wrong or (setpoint_change_due | bool) }}"
        commanded_temp: "{% set exp_ok = helper_expected_temp not in [none, '', 'unavailable',
          'unknown'] and states(helper_expected_temp) not in ['unknown', 'unavailable', '']
          %}{{ (adjusted_target | float(0)) if (setpoint_send | bool) or not exp_ok else (states(helper_expected_temp)
          | float(adjusted_target)) }}"
        # v9.19.0: the fan command below is skipped while the unit is in Powerful; captured
        # BEFORE the boost block can change it, so the expected-fan write matches what was sent.
        fan_held_by_boost: "{{ state_attr(climate_list[0], 'preset_mode') == 'boost' if climate_list
          | length > 0 else False }}"
    - repeat:
        for_each: '{{ climate_list }}'
        sequence:
        # v9.14.0 (bug 3): only re-send the setpoint when OUR target changed or the unit is
        # not in the expected mode. Re-sending an unchanged setpoint every run (34 commands
        # in 9 min observed) re-armed the integration's 45 s command grace and left
        # physical-remote detection ~95% blind while cooling.
        # v9.15.2: and HOLD a sent setpoint for setpoint_hold minutes. The escalation
        # ladder flips between Level 1 and Level 4 as the one-minute progress reading
        # flickers between 0.0 and -0.1 on a 0.1°C sensor, which moved the setpoint by
        # up to 2°C on nearly every run (nine commands in eight minutes observed on the
        # Office, 05/09). Each new setpoint makes a Daikin rev its indoor fan for a
        # moment. Time since the last change is the expected-temp helper's last_changed
        # (input_number ignores same-value writes, so it only moves when the setpoint
        # did). v9.15.3: the hold applies to EVERY change. v9.15.2 let moves of a full
        # degree through at once, and the ladder's Level 1 <-> Level 4 flip is exactly a
        # 2°C move, so the churn merely halved (18.5 -> 20.5 -> 18.5 every two minutes).
        # Only a unit that is out of its expected mode is re-commanded inside the hold.
        # v9.15.4: decision comes from setpoint_send (computed once above).
        # v9.15.5: the hold clock (the expected-temp helper) is written BEFORE the command.
        # A run cancelled between the command and the write (observed four times on the
        # Office, 05/09 19:41 to 19:47) left the clock in the past and the churn came back.
        - if:
          - condition: template
            value_template: '{{ (setpoint_send | bool) or states(repeat.item) != continue_hvac_mode
              }}'
          then:
          - if:
            - condition: template
              value_template: '{{ helper_expected_temp not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_number.set_value
              target:
                entity_id: '{{ helper_expected_temp }}'
              data:
                value: '{{ adjusted_target }}'
              continue_on_error: true
          - service: climate.set_temperature
            target:
              entity_id: '{{ repeat.item }}'
            data:
              temperature: '{{ adjusted_target }}'
              hvac_mode: '{{ continue_hvac_mode }}'
            continue_on_error: false
          - delay:
              milliseconds: 500
        # v9.15.0: never re-send a fan speed while the unit is in Powerful boost.
        # On a Daikin a fan command cancels Powerful, and boost owns the fan.
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and state_attr(repeat.item, ''preset_mode'')
              != ''boost'' }}'
          then:
          # v9.15.5: the fan-change timestamp (the fan band hold clock) is written BEFORE
          # the command, for the same reason as the setpoint clock above.
          - if:
            - condition: template
              value_template: '{{ helper_last_fan_change not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_datetime.set_datetime
              target:
                entity_id: '{{ helper_last_fan_change }}'
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
          - service: climate.set_fan_mode
            target:
              entity_id: '{{ repeat.item }}'
            data:
              fan_mode: '{{ continue_fan_mode }}'
            continue_on_error: false
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F3AF {{ room_name | upper }} CONTINUE MODE - FAN CONTROL
            v7.0.0\n\U0001F4CA Status:\n    • Current Temp: {{ current_temp }}°C\n
            \   • Target: {{ target_temp }}°C (overshoot: {{ target_overshoot }}°C)\n
            \   • Distance: {{ distance_from_target | round(2) }}°C\n    • Temp Change
            Rate: {{ temp_change_rate | round(3) }}°C/min\n\n\U0001F300 Fan Control
            ({{ fan_control_mode | upper }}):\n    {% if fan_control_mode == 'static'
            %}\n    • Mode: STATIC - Fixed at {{ static_fan_speed }}\n    {% elif
            fan_control_mode == 'temperature_band' %}\n    • Mode: TEMPERATURE BAND\n
            \   • Band: {% if distance_from_target <= 1 %}0-1°C{% elif distance_from_target
            <= 2 %}1-2°C{% elif distance_from_target <= 3 %}2-3°C{% elif distance_from_target
            <= 4 %}3-4°C{% else %}4+°C{% endif %}\n    • Time Since Change: {{ time_since_fan_change
            | round(1) }}/{{ fan_band_hold_time }} min\n    {% else %}\n    • Mode:
            DYNAMIC\n    • Stalling: {{ is_stalling }}\n    • Good Progress: {{ good_progress
            }}\n    • Time Since Change: {{ time_since_fan_change | round(1) }}/{{
            dynamic_hold_time }} min\n    {% endif %}\n    • Base Level: {{ calculated_fan_level_int
            }}\n    • Environmental Boost: {{ (final_fan_level_int | int) - (calculated_fan_level_int
            | int) }}\n    • Final Fan: {{ new_fan_mode }}\n    • Fan Changed: {{
            fan_mode_changed }}\n\n\U0001F3AF Pre-conditioning Override Check:\n    •
            is_precond_mode: {{ is_precond_mode }}\n    • control_mode: {{ control_mode
            }}\n    • precond_validated_fan_mode: {{ precond_validated_fan_mode }}\n
            \   • continue_fan_mode: {{ continue_fan_mode }}\n\n\U0001F4A1 Continue
            Mode: Using new unified fan control (v7.0.0)\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F50D {{ room_name | upper }} DEBUG: CONTINUE MODE SERVICE
            CALL PARAMETERS\n\U0001F4CA Service Call Details:\n    • Fan Mode: {{
            continue_fan_mode }}\n    • HVAC Mode: {{ continue_hvac_mode }}\n    •
            Temperature: {{ adjusted_target }}°C\n    • Target Entity: {{ climate_list
            }}\n"
          level: warning
    # v9.19.0: not while the unit is in Powerful boost: the fan command was skipped,
    # so the helper would claim a fan the unit was never told.
    - if:
      - condition: template
        value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
          ''unknown''] and not (fan_held_by_boost | bool) }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_fan }}'
        data:
          value: '{{ continue_fan_mode }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: '{{ continue_hvac_mode }}'
        continue_on_error: true
    # v9.14.0 (bug 9): keep the ceiling fan speed tracking the room while the AC cools.
    # The standalone in-zone speed handler is a sibling branch of this one in the same
    # choose, so it never runs during 'cooling'; the fan was left on whatever speed it had
    # at AC start (observed: HIGH over an occupied bed for 2 h). ceiling_fan_target_speed
    # applies the in-bed cap. Only when Fan With AC = On (Low is a deliberate fixed speed),
    # and only issues a call when the fan is not already at the target.
    # v9.20.0: with Fan With AC on, the ceiling fan runs at the speed the room calls for while
    # the AC cools: switched on if it is off (after pre-conditioning's 'skip' it stayed off),
    # re-speeded only when the speed differs. Not over a bed whose fan setting is off, and not
    # before arrival while pre-conditioning skips the fan.
    - if:
      - condition: template
        # v9.20.0 (round 3): with pre-conditioning skipping fans, not on the way home in any mode
        # (an extreme-temperature start in Manual ran the fan on HIGH in an empty house), and after
        # arrival only once someone is in the room (or the room has no presence sensors).
        value_template: '{{ ceiling_fan_configured and not fan_override_active and fan_with_ac_mode == ''on''
          and not (ceiling_fan_bed_blocked | bool) and not ((is_precond_mode | bool) and fan_precondition_mode
          == ''skip'' and not ((precond_arrival_occurred | bool) and ((room_presence_detected | bool) or (bed_active
          | bool) or (room_sensors | count) == 0))) and not (enable_pre_conditioning and (approaching_home | bool)
          and not (anyone_home | bool) and fan_precondition_mode == ''skip'') and not (ceiling_fan_at_target_speed
          | bool) }}'
      then:
      - if:
        - condition: template
          value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_ceiling_fan }}'
          data:
            value: 'on'
          continue_on_error: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
            then:
            - if:
              - condition: template
                value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
              then:
              - service: switch.turn_off
                target:
                  entity_id: '{{ ceiling_fan_other_switches }}'
                continue_on_error: true
            - delay:
                milliseconds: 100
            - service: switch.turn_on
              target:
                entity_id: '{{ ceiling_fan_target_switch }}'
              continue_on_error: true
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_domain == ''fan'' }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ not (ceiling_fan_is_on | bool) }}'
            then:
            - service: fan.turn_on
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
            - delay:
                milliseconds: 500
          - if:
            - condition: template
              value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
            then:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ ceiling_fan_has_presets }}'
                sequence:
                - service: fan.set_preset_mode
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  data:
                    preset_mode: '{{ ceiling_fan_target_speed }}'
                  continue_on_error: true
              default:
              - service: fan.set_percentage
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                data:
                  percentage: '{{ ceiling_fan_target_pct }}'
                continue_on_error: true
        default:
        - if:
          - condition: template
            value_template: '{{ not (ceiling_fan_is_on | bool) }}'
          then:
          - service: homeassistant.turn_on
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            continue_on_error: true
    # v9.15.0: Powerful boost. At escalation Level 4 (far from target, or not
    # responding) push any unit that exposes a 'boost' preset into Daikin Powerful;
    # clear it the moment escalation drops below Level 4. Only ever sends a command
    # when the unit's reported preset differs from what we want, so a Powerful that
    # the unit cancels itself (~20 min) is simply re-engaged on the next check while
    # the room is still stalled, and nothing is re-sent every minute (each preset
    # command re-arms the integration's 45 s override grace). Never while the bed is
    # occupied unless allowed. Units without the preset (BRP084) are skipped.
    - if:
      - condition: template
        value_template: '{{ powerful_boost_enabled | bool }}'
      then:
      - repeat:
          for_each: '{{ climate_list }}'
          sequence:
          - variables:
              boost_supported: "{{ 'boost' in (state_attr(repeat.item, 'preset_modes') or []) }}"
              boost_active: "{{ state_attr(repeat.item, 'preset_mode') == 'boost' }}"
              # v9.19.0: once on, Powerful stays on through an established cooling run until
              # the room is within 0.5 of target, so it does not follow the escalation level's
              # run-to-run flicker (with or without Pull-down).
              boost_wanted: "{{ ((final_escalation_level | int(0)) >= 4 or ((boost_active | bool)
                and last_mode in ['cooling', 'bed_comfort_eco', 'bed_comfort_quiet', 'pre_conditioning'] and (current_temp
                - target_temp) > 0.5)) and ((powerful_boost_in_bed | bool) or not (bed_active
                | bool)) }}"
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ (boost_supported | bool) and (boost_wanted | bool) and not
                  (boost_active | bool) }}'
              sequence:
              - service: climate.set_preset_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  preset_mode: boost
                continue_on_error: true
              - if:
                - condition: template
                  value_template: '{{ event_logging_enabled }}'
                then:
                - service: system_log.write
                  data:
                    message: "[EVENT] {{ room_name }} ⚡ | Powerful Boost ON | Escalation L{{ final_escalation_level }}, Room {{ current_temp }}°C, Target {{ target_temp }}°C, {{ distance_from_target | round(1) }}°C away | {{ repeat.item }}"
                    level: warning
            - conditions:
              - condition: template
                value_template: '{{ (boost_supported | bool) and (boost_active | bool) and not
                  (boost_wanted | bool) }}'
              sequence:
              - service: climate.set_preset_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  preset_mode: none
                continue_on_error: true
              - if:
                - condition: template
                  value_template: '{{ event_logging_enabled }}'
                then:
                - service: system_log.write
                  data:
                    message: "[EVENT] {{ room_name }} ⚡ | Powerful Boost OFF | Escalation L{{ final_escalation_level }}, Room {{ current_temp }}°C, Target {{ target_temp }}°C | {{ repeat.item }}"
                    level: warning
    # v9.15.5: the expected-temp and fan-change helpers are written before their commands
    # (inside the repeat above); the trailing writes that used to sit here were the ones a
    # cancelled run never reached.
    - if:
      - condition: template
        value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - variables:
          snapshot_hvac: '{{ continue_hvac_mode }}'
          snapshot_temp: '{{ commanded_temp }}'
          snapshot_fan: '{{ continue_fan_mode }}'
          snapshot_swing: '{{ validated_swing_mode }}'
          update_snapshot: hvac={{ snapshot_hvac }},temp={{ snapshot_temp }},fan={{
            snapshot_fan }},swing={{ snapshot_swing }}
          update_checksum: '{% set hvac_codes = {''off'': 0, ''cool'': 1, ''heat'':
            2, ''auto'': 3, ''dry'': 4, ''fan_only'': 5, ''heat_cool'': 6} %} {{ ((snapshot_temp
            * 1000) + (snapshot_fan | string | length) + (snapshot_swing | string
            | length) + hvac_codes.get(snapshot_hvac, 99)) | int(0) }}

            '
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_last_command }}'
        data:
          value: '{{ update_snapshot }}'
        continue_on_error: true
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_state_checksum }}'
        data:
          value: '{{ update_checksum }}'
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
            and ((setpoint_send | bool) or ((fan_mode_changed | bool) and not (fan_held_by_boost | bool))) }}'
        then:
        - service: input_datetime.set_datetime
          target:
            entity_id: '{{ helper_change }}'
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ debug_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "\U0001F4F8 {{ room_name | upper }} SNAPSHOT UPDATED (Continue
              Mode)\n    • New Snapshot: {{ update_snapshot }}\n    • New Checksum:
              {{ update_checksum }}\n    • HVAC: {{ snapshot_hvac }}\n    • Temp:
              {{ snapshot_temp }}°C\n    • Fan: {{ snapshot_fan }}\n"
            level: warning
  - conditions:
    - condition: template
      value_template: '{{ should_activate }}'
    - condition: template
      value_template: '{{ actual_ac_state == ''on'' }}'
    # v9.20.0: pre-conditioning between the comfort edge and its goal is not "running when
    # it shouldn't be" (heating pre-conditioning was switched off here every check).
    - condition: template
      value_template: '{{ not (is_precond_mode | bool) }}'
    # v9.20.0: the modes that run the unit on purpose without cooling or heating (eco and
    # fan-only variants) are not "running when it shouldn't be"; with Auto-Off set to eco or
    # fan-only this branch and Auto-Off switched the unit off and on every check.
    - condition: template
      value_template: '{{ last_mode not in [''comfort_fan_only'', ''bed_eco_fan_only'',
        ''stability_fan_only'', ''ceiling_fan_cooling'', ''eco'', ''stability_eco'', ''auto_off_eco'',
        ''auto_off_fan_only'', ''smart_eco'', ''smart_maintain'', ''away_eco''] }}'
    # v9.20.0: heating is judged as heating (it was given the cooling test, so a heater was
    # switched off between the comfort floor and its target), and the bed counts through a
    # bathroom trip (bed_active).
    - condition: template
      value_template: "{% set should_cool = cooling_with_hysteresis and enable_cooling %} {% set
        should_heat = heating_with_hysteresis and enable_heating %} {% set in_continue_mode = (last_mode
        in ['cooling', 'bed_comfort_eco', 'bed_comfort_quiet'] and current_temp > (target_temp - target_overshoot)
        and current_temp <= comfort_max_temp) or (last_mode == 'heating' and current_temp < (target_temp
        + target_overshoot) and current_temp >= comfort_min_temp) %} {% set in_bed_mode = bed_comfort_mode
        != 'off' and (bed_active | bool) and last_mode != 'heating' and (last_mode in ['bed_comfort_eco', 'bed_comfort_quiet',
        'bed_eco_fan_only'] or current_temp >= (bed_stop_point | float(0))) %} {{ not (should_cool or should_heat or
        in_continue_mode or in_bed_mode) }}"
    # v9.20.0: Comfort Zone Action eco is the comfort-zone branch's job (this stop made it
    # behave as off), and inside the Auto-Off window Auto-Off does the stopping.
    - condition: template
      value_template: "{{ comfort_zone_action != 'eco' and not ((auto_off_conditions_active | bool) and control_mode
        in ['Smart', 'Auto']) }}"
    sequence:
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "[EVENT] {{ room_name }} 🎯 | {{ 'Target Reached' if last_mode in ['cooling', 'heating',
            'bed_comfort_eco', 'bed_comfort_quiet'] else 'Not Needed' }}: {{ 'Fan Only' if comfort_zone_action
            == 'fan_only' else 'Turning Off' }} | {{ last_mode | replace('_', ' ') | title }} for {{ time_in_current_mode
            | round(1) }}min, Room {{ current_temp }}°C, Target {{ target_temp }}°C"
          level: warning
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F6D1 {{ room_name | upper }} AC RUNNING BUT SHOULDN'T BE
            - STOPPING\n\U0001F4CA Current State:\n    • AC State: {{ actual_ac_state
            }}\n    • Last Mode: {{ last_mode }}\n    • Current Temp: {{ current_temp
            }}°C\n    • Target: {{ target_temp }}°C\n    • Comfort Zone: {{ comfort_min_temp
            }}-{{ comfort_max_temp }}°C\n\n\U0001F50D Why Stopping:\n    • Should
            Cool: {{ cooling_with_hysteresis and enable_cooling }}\n    • Should Heat:
            {{ heating_with_hysteresis and enable_heating }}\n    • Continue Mode:
            {{ last_mode in ['cooling', 'heating'] and current_temp > (target_temp
            - target_overshoot) and current_temp <= comfort_max_temp }}\n    • Bed
            Mode Active: {{ bed_comfort_mode != 'off' and bed_occupied }}\n    • None
            of above = true → Stopping AC\n\n\U0001F4A1 Action: {{ 'Switching to fan-only
            mode' if comfort_zone_action == 'fan_only' else 'Turning OFF' }}\n"
          level: warning
    # v9.20.0: the ceiling fan first (fast relays; its Fan at Target step is keyed on the running
    # label, so a run cut after the label left it undone), then the label and the mode clock, the
    # slow AC command last, so a restart during it leaves a consistent state. Fan at
    # Target: replace_ac keeps the fan going at the room's speed, off stops it (this stop
    # never touched it, so the Office fan stayed on HIGH after the 13:22 stop on 04/10). An
    # extreme-temperature run ending in Manual, or the AC going to fan-only, stops it.
    - if:
      - condition: template
        value_template: "{{ ceiling_fan_configured and not fan_override_active and (ceiling_fan_is_on | bool)
          and (control_mode == 'Manual' or comfort_zone_action == 'fan_only') }}"
      then:
      - if:
        - condition: template
          value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_ceiling_fan }}'
          data:
            value: 'off'
          continue_on_error: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - service: switch.turn_off
            target:
              entity_id:
              - '{{ ceiling_fan_low_switch }}'
              - '{{ ceiling_fan_medium_switch }}'
              - '{{ ceiling_fan_high_switch }}'
            continue_on_error: true
        default:
        - service: homeassistant.turn_off
          target:
            entity_id: '{{ ceiling_fan_entities }}'
          continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and control_mode != ''Manual'' and comfort_zone_action != ''fan_only'' and last_mode in [''cooling'', ''bed_comfort_eco'', ''bed_comfort_quiet''] and not (ceiling_fan_bed_blocked | bool) }}'
      then:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ fan_at_target_temp == ''replace_ac'' }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_ceiling_fan }}'
              data:
                value: 'on'
              continue_on_error: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_speed_switches }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - if:
                  - condition: template
                    value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
                  then:
                  - service: switch.turn_off
                    target:
                      entity_id: '{{ ceiling_fan_other_switches }}'
                    continue_on_error: true
                - delay:
                    milliseconds: 100
                - service: switch.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_target_switch }}'
                  continue_on_error: true
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_domain == ''fan'' }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ not (ceiling_fan_is_on | bool) }}'
                then:
                - service: fan.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  continue_on_error: true
                - delay:
                    milliseconds: 500
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ ceiling_fan_has_presets }}'
                    sequence:
                    - service: fan.set_preset_mode
                      target:
                        entity_id: '{{ ceiling_fan_entities }}'
                      data:
                        preset_mode: '{{ ceiling_fan_target_speed }}'
                      continue_on_error: true
                  default:
                  - service: fan.set_percentage
                    target:
                      entity_id: '{{ ceiling_fan_entities }}'
                    data:
                      percentage: '{{ ceiling_fan_target_pct }}'
                    continue_on_error: true
            default:
            - if:
              - condition: template
                value_template: '{{ not (ceiling_fan_is_on | bool) }}'
              then:
              - service: homeassistant.turn_on
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                continue_on_error: true
        - conditions:
          - condition: template
            value_template: '{{ fan_at_target_temp == ''off'' and (ceiling_fan_is_on | bool) }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_ceiling_fan }}'
              data:
                value: 'off'
              continue_on_error: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_speed_switches }}'
              sequence:
              - service: switch.turn_off
                target:
                  entity_id:
                  - '{{ ceiling_fan_low_switch }}'
                  - '{{ ceiling_fan_medium_switch }}'
                  - '{{ ceiling_fan_high_switch }}'
                continue_on_error: true
            default:
            - service: homeassistant.turn_off
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_mode not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_mode }}'
        data:
          value: '{{ ''comfort_fan_only'' if comfort_zone_action == ''fan_only'' else ''off'' }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: !input helper_mode_start_time
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ comfort_zone_action == ''fan_only'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F300 {{ room_name | upper }} SWITCHING TO FAN ONLY MODE
                (Sanity Check)\n\U0001F4CA Status:\n    • Current: {{ last_mode }}\n
                \   • comfort_zone_action: fan_only\n    • Reason: AC running but
                no activation conditions met\n"
              level: warning
        - if:
          - condition: template
            value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_fan }}'
            data:
              value: '{{ selected_fan_only_fan_mode }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: fan_only
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ (state_attr(climate_list[0], ''fan_mode'') | string | trim) != (selected_fan_only_fan_mode
              | string | trim) and helper_last_fan_change not in [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_last_fan_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - service: climate.set_temperature
              target:
                entity_id: '{{ repeat.item }}'
              data:
                hvac_mode: fan_only
                temperature: '{{ target_temp }}'
              continue_on_error: true
            - delay:
                milliseconds: 500
            - service: climate.set_fan_mode
              target:
                entity_id: '{{ repeat.item }}'
              data:
                fan_mode: '{{ selected_fan_only_fan_mode }}'
              continue_on_error: true
            # v9.14.0 (bug 3): swing is a fixed input; only send it when the unit differs.
            - if:
              - condition: template
                value_template: '{{ validated_swing_mode != ''none'' and state_attr(repeat.item, ''swing_mode'') != validated_swing_mode }}'
              then:
              - service: climate.set_swing_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  swing_mode: '{{ validated_swing_mode }}'
                continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_last_command not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - variables:
              # LOW-sanity-stop-snapshot: snapshot/checksum MUST match the commands just
              # sent (hvac=fan_only, temp=target_temp, fan=selected_fan_only_fan_mode,
              # swing=validated_swing_mode); 5 = hvac_codes['fan_only']. Formula matches
              # every other snapshot site.
              fan_snapshot: hvac=fan_only,temp={{ target_temp | float(0) | round(1) }},fan={{
                selected_fan_only_fan_mode }},swing={{ validated_swing_mode }}
              fan_checksum: '{{ (((target_temp | float(0) | round(1)) * 1000) + (selected_fan_only_fan_mode
                | string | length) + (validated_swing_mode | string | length) + 5) | int(0) }}'
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_last_command }}'
            data:
              value: '{{ fan_snapshot }}'
            continue_on_error: true
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_state_checksum }}'
            data:
              value: '{{ fan_checksum }}'
            continue_on_error: true
      default:
      - if:
        - condition: template
          value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
            }}'
        then:
        - variables:
            update_snapshot: hvac=off,temp=0,fan=unknown,swing=unknown
            update_checksum: '0'
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_last_command }}'
          data:
            value: '{{ update_snapshot }}'
          continue_on_error: true
        - service: input_number.set_value
          target:
            entity_id: '{{ helper_state_checksum }}'
          data:
            value: '{{ update_checksum }}'
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_change not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F4F8 {{ room_name | upper }} SNAPSHOT UPDATED (Pre-command
                - Turn OFF)\n    • New Snapshot: {{ update_snapshot }}\n"
              level: warning
      - if:
        - condition: template
          value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
            ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_hvac }}'
          data:
            value: 'off'
          continue_on_error: true
      - service: climate.turn_off
        target:
          entity_id: !input climate_entities
        continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ enable_auto_off_conditions }}'
    - condition: template
      value_template: '{{ control_mode in [''Smart'', ''Auto''] }}'
    - condition: template
      value_template: '{{ auto_off_conditions_active | bool }}'
    sequence:
    # v9.20.0: "already done" only when the unit and the ceiling fan really match the action;
    # a run cut short after the mode was recorded (or a turn-off that failed) used to leave
    # the AC cooling all night behind this stop.
    - variables:
        auto_off_unit_on: "{{ climate_list | length > 0 and states(climate_list[0]) not in ['off', 'unavailable',
          'unknown'] }}"
        auto_off_fan_done: "{{ not ceiling_fan_configured or fan_override_active or not (ceiling_fan_is_on | bool) }}"
        auto_off_target_mode: "{% if auto_off_action == 'eco' and (auto_off_unit_on | bool) %}auto_off_eco{% elif
          auto_off_action == 'fan_only' and (auto_off_unit_on | bool) %}auto_off_fan_only{% else %}auto_off_off{% endif %}"
        # v9.7.13 FIX: cooling_target_temp/heating_target_temp are STRINGS (from
        # `{{ base_cooling_target | round(1) }}` templates) - adding int caused Jinja
        # to raise "string + int" error, eco_target rendered empty, input_number got
        # 0.0 (out of 10-35 range). Coerce to float before math.
        # M35: branch ECO relaxation on the season the system was actually fighting
        # (last_mode), falling back to the comfort-band comparison only when the mode
        # carries no direction. cooling test matches the file's own cooling-family
        # classification at the mode_is_cooling list (incl. bed_comfort modes).
        # v9.20.0 (round 3): computed here so "already done" can check the unit really took it.
        auto_off_eco_target: "{% if last_mode == 'auto_off_eco' and climate_list | length > 0 and states(climate_list[0])
          in ['heat', 'Heat'] %}\n  {{ (heating_target_temp | float(0)) - eco_mode_setpoint_offset }}\n{% elif
          last_mode == 'auto_off_eco' and enable_cooling %}\n  {{ (cooling_target_temp | float(0)) + eco_mode_setpoint_offset
          }}\n{% elif ('cooling' in last_mode) or last_mode in ['bed_comfort_eco',
          'bed_comfort_quiet', 'bed_eco_fan_only'] %}\n  {{ (cooling_target_temp
          | float(0)) + eco_mode_setpoint_offset }}\n{% elif 'heating' in last_mode
          %}\n  {{ (heating_target_temp | float(0)) - eco_mode_setpoint_offset }}\n{%
          elif current_temp > comfort_max_temp %}\n  {{ (cooling_target_temp | float(0))
          + eco_mode_setpoint_offset }}\n{% elif current_temp < comfort_min_temp %}\n
          \ {{ (heating_target_temp | float(0)) - eco_mode_setpoint_offset }}\n{% elif
          enable_cooling %}\n  {{ (cooling_target_temp | float(0)) + eco_mode_setpoint_offset
          }}\n{% else %}\n  {{ (heating_target_temp | float(0)) - eco_mode_setpoint_offset
          }}\n{% endif %}\n"
    # v9.20.0 (round 3): eco counts as done only when the unit holds the eco setpoint (a failed
    # or cut-short eco command left it at the pull-down setpoint and fan 5 all night).
    - if:
      - condition: template
        value_template: "{% set unit = states(climate_list[0]) if climate_list | length > 0 else 'off' %}{% set step
          = (state_attr(climate_list[0], 'target_temp_step') | float(0.5)) if climate_list | length > 0 else 0.5 %}{% set
          eco_ok = climate_list | length > 0 and ((state_attr(climate_list[0], 'temperature') | float(-99)) - (auto_off_eco_target
          | float(0))) | abs < ([0.3, step * 0.99] | max) %}{{ (auto_off_fan_done | bool) and ((last_mode == 'auto_off_off'
          and unit == 'off') or (last_mode == 'auto_off_eco' and unit != 'off' and eco_ok) or (last_mode == 'auto_off_fan_only'
          and unit in ['fan_only', 'dry'])) }}"
      then:
      - stop: Auto-off conditions still active, maintaining current state
    - if:
      - condition: template
        value_template: '{{ last_mode in active_modes and (time_in_current_mode |
          float(0)) < (runtime_min | float(0)) }}'
      then:
      - stop: Auto-off waiting for minimum runtime protection
    # v9.20.0: the mode and its clock before any command, and the ceiling fan goes off with
    # the AC (28/09 the Living Room's media-room fan ran unmanaged for 51 minutes after the
    # 21:00 auto-off, until a wall-switch press). Eco and fan-only leave a unit that is off,
    # off (they switched it on). Round 3: the label before the clock (a run cut between them
    # left 'cooling' with a fresh clock, and the runtime wait above then held the unit on).
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_mode }}'
      data:
        value: '{{ auto_off_target_mode }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] and last_mode
          != auto_off_target_mode }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: !input helper_mode_start_time
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and (ceiling_fan_is_on | bool) }}'
      then:
      - if:
        - condition: template
          value_template: '{{ event_logging_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "[EVENT] {{ room_name }} 🌀 | Ceiling Fan Off | Auto-Off, Room {{ current_temp }}°C"
            level: warning
      - if:
        - condition: template
          value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_ceiling_fan }}'
          data:
            value: 'off'
          continue_on_error: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - service: switch.turn_off
            target:
              entity_id:
              - '{{ ceiling_fan_low_switch }}'
              - '{{ ceiling_fan_medium_switch }}'
              - '{{ ceiling_fan_high_switch }}'
            continue_on_error: true
        default:
        - service: homeassistant.turn_off
          target:
            entity_id: '{{ ceiling_fan_entities }}'
          continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F319 {{ room_name | upper }}: Auto-Off Conditions Met \U0001F4A1
            Triggered by: {{ auto_off_trigger_reason }} \U0001F3AF Action: {{ auto_off_action
            | upper }} \U0001F4CB Technical: {{ time_in_current_mode | round(1) }}min
            in current mode, control_mode={{ control_mode }}, last_mode={{ last_mode
            }}\n"
          level: warning
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ auto_off_target_mode == ''auto_off_off'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_change not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_last_change
            data:
              datetime: '{{ now() }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: 'off'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_last_command not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_last_command }}'
            data:
              value: hvac=off,temp=0,fan=unknown,swing=unknown
            continue_on_error: true
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_state_checksum }}'
            data:
              value: '0'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ auto_off_unit_on | bool }}'
          then:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entities
            continue_on_error: true
        # v9.20.0 (round 3): only when the AC was on (a fan-only switch-off has its own line).
        - if:
          - condition: template
            value_template: '{{ event_logging_enabled and (auto_off_unit_on | bool) }}'
          then:
          - service: system_log.write
            data:
              message: "[EVENT] {{ room_name }} 🌙 | Auto-Off: Turned Off | {{ auto_off_trigger_reason
                }}, Room {{ current_temp }}°C"
              level: warning
        - if:
          - condition: template
            value_template: '{{ auto_off_unit_on | bool }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F319 {{ room_name | upper }} AUTO-OFF: Turned AC OFF Reason:
                {{ auto_off_trigger_reason }}\n"
              level: warning
      - conditions:
        - condition: template
          value_template: '{{ auto_off_target_mode == ''auto_off_eco'' }}'
        sequence:
        - variables:
            eco_target: '{{ auto_off_eco_target | float(0) }}'
        - service: input_number.set_value
          target:
            entity_id: '{{ helper_expected_temp }}'
          data:
            value: '{{ eco_target }}'
          continue_on_error: true
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_mode }}'
          data:
            value: auto_off_eco
          continue_on_error: true
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - variables:
                current_entity: '{{ repeat.item }}'
                available_modes: '{{ (state_attr(repeat.item, ''hvac_modes'') or []) | list
                  }}'
                # v9.20.0: heat/cool only when BOTH are enabled (a cooling-only room could
                # heat overnight in eco), and helpers before the command.
                selected_hvac_mode: "{% if enable_cooling and enable_heating and 'auto' in available_modes
                  %}auto{% elif enable_cooling and enable_heating and 'heat_cool' in available_modes %}heat_cool{%
                  elif enable_cooling and 'cool' in available_modes and not (enable_heating and current_temp
                  < comfort_min_temp) %}cool{% elif enable_heating and 'heat' in available_modes %}heat{% elif
                  enable_cooling and 'cool' in available_modes %}cool{% else %}off{% endif %}"
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_hvac }}'
              data:
                value: '{{ selected_hvac_mode }}'
              continue_on_error: true
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_fan }}'
              data:
                value: '{{ new_fan_mode }}'
              continue_on_error: true
            - service: climate.set_temperature
              target:
                entity_id: '{{ current_entity }}'
              data:
                temperature: '{{ eco_target }}'
                hvac_mode: '{{ selected_hvac_mode }}'
              continue_on_error: false
            - delay:
                milliseconds: 500
            - service: climate.set_fan_mode
              target:
                entity_id: '{{ current_entity }}'
              data:
                fan_mode: '{{ new_fan_mode }}'
              continue_on_error: false
            - delay:
                milliseconds: 500
            # v9.14.0 (bug 3): swing is a fixed input; only send it when the unit differs.
            - if:
              - condition: template
                value_template: '{{ validated_swing_mode != ''none'' and state_attr(current_entity, ''swing_mode'') != validated_swing_mode }}'
              then:
              - service: climate.set_swing_mode
                target:
                  entity_id: '{{ current_entity }}'
                data:
                  swing_mode: '{{ validated_swing_mode }}'
                continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and helper_last_fan_change not in
              [none, '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_last_fan_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ event_logging_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "[EVENT] {{ room_name }} 🌙 | Auto-Off: Eco Mode | {{ auto_off_trigger_reason
                }}, Room {{ current_temp }}°C, Eco target {{ eco_target | round(1) }}°C"
              level: warning
        - service: system_log.write
          data:
            message: "\U0001F319 {{ room_name | upper }} AUTO-OFF: Set AC to ECO ({{
              eco_target | round(1) }}°C) Reason: {{ auto_off_trigger_reason }}\n"
            level: warning
      - conditions:
        - condition: template
          value_template: '{{ auto_off_target_mode == ''auto_off_fan_only'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: fan_only
            continue_on_error: true
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_mode }}'
          data:
            value: auto_off_fan_only
          continue_on_error: true
        - variables:
            selected_fan_only_hvac: "{% set modes = (state_attr(climate_list[0], 'hvac_modes') or [])
              | list if climate_list | length > 0 else [] %} {% if 'fan_only' in modes
              %}\n  fan_only\n{% elif 'dry' in modes %}\n  dry\n{% else %}\n  off\n{%
              endif %}\n"
        - if:
          - condition: template
            value_template: '{{ selected_fan_only_hvac != ''off'' }}'
          then:
          - repeat:
              for_each: '{{ climate_list }}'
              sequence:
              - service: climate.set_temperature
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  temperature: '{{ target_temp }}'
                  hvac_mode: '{{ selected_fan_only_hvac }}'
                continue_on_error: false
              - delay:
                  milliseconds: 500
              - service: climate.set_fan_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  fan_mode: '{{ selected_fan_only_fan_mode }}'
                continue_on_error: false
          - if:
            - condition: template
              value_template: '{{ fan_mode_changed and helper_last_fan_change not
                in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_datetime.set_datetime
              target:
                entity_id: '{{ helper_last_fan_change }}'
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_fan }}'
              data:
                value: '{{ selected_fan_only_fan_mode }}'
              continue_on_error: true
          else:
          - if:
            - condition: template
              value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_hvac }}'
              data:
                value: 'off'
              continue_on_error: true
          - service: climate.turn_off
            target:
              entity_id: !input climate_entities
            continue_on_error: true
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_mode }}'
            data:
              value: auto_off_off
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ event_logging_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "[EVENT] {{ room_name }} 🌙 | Auto-Off: Fan Only | {{ auto_off_trigger_reason
                }}, Room {{ current_temp }}°C"
              level: warning
        - service: system_log.write
          data:
            message: "\U0001F319 {{ room_name | upper }} AUTO-OFF: Set AC to FAN ONLY
              ({{ selected_fan_only_hvac }}) Reason: {{ auto_off_trigger_reason }}\n"
            level: warning
    - if:
      - condition: template
        value_template: '{{ enable_notifications }}'
      then:
      - repeat:
          for_each: '{{ notify_services_all }}'
          sequence:
          - service: '{{ repeat.item }}'
            data:
              title: '{{ room_name }} Climate Control'
              message: 'Auto-Off: {{ auto_off_action }} ({{ auto_off_trigger_reason }},
                {{ current_temp }}°C)'
            continue_on_error: true
  - conditions:
    - condition: template
      value_template: '{{ should_activate }}'
    # v9.14.0 (bug 1): never START cooling on a phantom reading.
    - condition: template
      value_template: '{{ temp_sensor_available | bool }}'
    - condition: template
      value_template: "{# v9.8.0: Defer to pre-conditioning branch when approaching home #}\n
        {# v9.13.2: ALSO defer while the room is ALREADY in Pre-conditioning with the AC
        still off - that is the pre-conditioning branch's own manual_precond_needs_setup
        contract. Entering Pre-conditioning fires mode_change and mode:restart kills the
        run that issued it, so the AC command can only land on the NEXT run. Note the
        v9.8.0 term above disarms itself the moment is_precond_mode goes true, so without
        this second term THIS branch claims that next run: the unit then gets the plain
        cooling target instead of the pre-conditioning boost, last_mode reads 'cooling',
        and no TEMP SET: Pre-conditioning is ever written. It only leaks above the
        ceiling-fan zone (see the in_ceiling_fan_zone condition below) - i.e. on exactly
        the hot afternoons pre-conditioning exists for. #}\n
        {# v9.20.0: only when pre-conditioning will actually start (room past its trigger,
        trip not blocked, not Manual); otherwise a running unit was left unmanaged and an
        extreme-temperature start in Manual could never happen on the way home. #}\n
        {{ not (enable_pre_conditioning and approaching_home and not anyone_home and
        not is_precond_mode and (precond_start_due | bool) and not (precond_trip_blocked | bool)
        and control_mode != 'Manual')\n   and not (enable_pre_conditioning and is_precond_mode
        and actual_ac_state == 'off') }}\n"
    # v9.20.0: in bed (including a bathroom trip, bed_active) the start point is the Bed ECO
    # return point, and the fan zone does not hold it back there: the fan-zone entry is
    # blocked in bed, so the bedroom restarted at 24.1 instead of 23.5 with nothing between.
    # A recorded cooling run is maintained even with the unit off, so a start whose command
    # failed (or a run cancelled after the mode was written) is retried at once.
    # v9.20.0: out of bed the start follows cooling_with_hysteresis (the Hysteresis Tolerance
    # after a heating run; it was only ever read by the stop test).
    - condition: template
      value_template: '{% set bed_eco_active = bed_comfort_mode != ''off'' and bed_eco_fan_only_mode
        in [''enabled'', ''ceiling_fan''] and (bed_active | bool) and last_mode != ''cooling'' %} {{ (current_temp
        > (target_temp + bed_eco_return_threshold)) if bed_eco_active else (cooling_with_hysteresis | bool) }}'
    # v9.20.0: a Bed ECO mode in bed belongs to the bed branches (continue-cooling holds
    # bed_comfort_eco at any temperature, the return branch restarts the rest at the return
    # point); this branch must not pre-empt them.
    - condition: template
      value_template: '{{ not ((bed_active | bool) and last_mode in [''bed_comfort_eco'', ''bed_comfort_quiet'',
        ''bed_eco_fan_only'']) }}'
    - condition: template
      value_template: '{{ enable_cooling }}'
    - condition: template
      value_template: "{{ not in_ceiling_fan_zone\n   or ceiling_fan_should_escalate\n
        \  or last_mode == 'cooling'\n   or ((bed_active | bool) and bed_comfort_mode != 'off')\n   or (last_mode
        in ['bed_comfort_eco', 'bed_comfort_quiet'] and actual_ac_state == 'on') }}\n"
    - condition: template
      value_template: "{% set time_protection_met = (\n  last_mode in ['cooling',
        'cooling_low', 'cooling_medium', 'cooling_high', 'bed_comfort_eco', 'bed_comfort_quiet',
        'bed_eco_fan_only', 'comfort_fan_only', 'stability_fan_only']\n  and (time_in_current_mode
        | float(0)) >= (runtime_min | float(0))\n) or last_mode not in ['cooling',
        'cooling_low', 'cooling_medium', 'cooling_high', 'bed_comfort_eco', 'bed_comfort_quiet',
        'bed_eco_fan_only', 'comfort_fan_only', 'stability_fan_only'] %} {# v9.19.1: the minimum
        runtime guards a CHANGE of mode; it must not stop this branch maintaining a unit that is
        already cooling (04/10: Living Room left at 22 / fan 1 for 10 min after start). #} {{
        time_protection_met or last_mode == 'cooling' }}\n"
    # v9.20.0: in Smart the compressor is only STARTED for someone in the room, in bed or on
    # the way home. The presence grace keeps a running unit going; it must not start one.
    - condition: template
      # v9.20.0: with someone home (a phantom bed reading started the bedroom with nobody home,
      # 04/10 13:55), and only a unit really cooling/heating counts as already running.
      value_template: '{{ control_mode != ''Smart'' or states(climate_list[0]) in [''cool'', ''heat''] or
        (((room_presence_detected | bool) or (bed_active | bool)) and ((anyone_home | bool) or (persons | count)
        == 0)) or ((approaching_home | bool) and not (anyone_home | bool)) }}'
    # v9.20.0 (round 3): on the way home with pre-conditioning on, a room below its pre-conditioning
    # trigger waits for you (above it pre-conditioning starts, see the step-aside above). In Auto
    # the home radius counts as home, so the Living Room started plain cooling at 22.9 seven
    # minutes before arrival (04/10 replay). A unit already running carries on, and Manual's
    # extreme-temperature start is not affected.
    - condition: template
      value_template: '{{ not (enable_pre_conditioning and (approaching_home | bool) and not (anyone_home | bool)
        and control_mode in [''Smart'', ''Auto''] and not (precond_start_due | bool) and states(climate_list[0]) not
        in [''cool'', ''heat''] and not (room_presence_detected | bool) and not (bed_active | bool)) }}'
    sequence:
    - variables:
        selected_fan_mode: "{% if is_precond_mode and precond_validated_fan_mode !=
          'Dynamic' %}\n  {{ precond_validated_fan_mode }}\n{% else %}\n  {{ new_fan_mode
          }}\n{% endif %}\n"
        selected_hvac_mode: "{% set modes = (state_attr(climate_list[0], 'hvac_modes') or [])
          | list %} {% if 'cool' in modes %}\n  cool\n{% elif 'Cool' in modes %}\n
          \ Cool\n{% elif enable_heating and 'auto' in modes %}\n  auto\n{% elif enable_heating
          and 'Auto' in modes %}\n  Auto\n{% elif enable_heating and 'heat_cool' in
          modes %}\n  heat_cool\n{% elif enable_heating and 'Heat/Cool' in modes %}\n
          \ Heat/Cool\n{% else %}\n  {{ modes[0] if modes else 'cool' }}\n{% endif
          %}\n"
        selected_swing_mode: '{{ validated_swing_mode }}'
        # v9.19.0: this branch re-sent adjusted_target on EVERY run with no hold (the
        # continue-cooling branch has had one since v9.15.2), so once the room sat above
        # the comfort band the escalation flicker reached the unit unfiltered: 20 / 21 / 20
        # nine times in 50 min on the Office, 04/10. It also re-armed the integration's 45 s
        # command grace every run (the v9.14.0 bug 3 blindness, here). Same rule as
        # continue-cooling now: send on entry / wrong mode, or when setpoint_change_due.
        setpoint_send: "{% set ns = namespace(wrong=false) %}{% for e in climate_list %}{%
          if states(e) != selected_hvac_mode %}{% set ns.wrong = true %}{% endif %}{% endfor
          %}{{ ns.wrong or (setpoint_change_due | bool) }}"
        commanded_temp: "{% set exp_ok = helper_expected_temp not in [none, '', 'unavailable',
          'unknown'] and states(helper_expected_temp) not in ['unknown', 'unavailable', '']
          %}{{ (adjusted_target | float(0)) if (setpoint_send | bool) or not exp_ok else (states(helper_expected_temp)
          | float(adjusted_target)) }}"
        # v9.19.0: the fan command below is skipped while the unit is in Powerful; captured
        # BEFORE the boost block can change it, so the expected-fan write matches what was sent.
        fan_held_by_boost: "{{ state_attr(climate_list[0], 'preset_mode') == 'boost' if climate_list
          | length > 0 else False }}"
        # v9.20.0 (round 3): read before the commands, for an honest start/take-over [EVENT].
        unit_was_cooling: "{{ climate_list | length > 0 and states(climate_list[0]) in ['cool', 'Cool'] }}"
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "❄️ {{ room_name | upper }} COOLING - FAN CONTROL v7.0.0\n\U0001F4CA
            Temperature:\n    • Current: {{ current_temp }}°C → Target: {{ target_temp
            }}°C\n    • Distance: {{ distance_from_target | round(1) }}°C to go\n
            \   • Comfort zone: {{ comfort_min_temp }}°C - {{ comfort_max_temp }}°C\n\n\U0001F300
            Fan Control ({{ fan_control_mode | upper }}):\n    {% if fan_control_mode
            == 'static' %}\n    • Mode: STATIC - Fixed at {{ static_fan_speed }}\n
            \   {% elif fan_control_mode == 'temperature_band' %}\n    • Mode: TEMPERATURE
            BAND\n    • Band: {% if distance_from_target <= 1 %}0-1°C{% elif distance_from_target
            <= 2 %}1-2°C{% elif distance_from_target <= 3 %}2-3°C{% elif distance_from_target
            <= 4 %}3-4°C{% else %}4+°C{% endif %}\n    • Hold Time: {{ time_since_fan_change
            | round(1) }}/{{ fan_band_hold_time }} min\n    {% else %}\n    • Mode:
            DYNAMIC\n    • Stalling: {{ is_stalling }} | Good Progress: {{ good_progress
            }}\n    • Hold Time: {{ time_since_fan_change | round(1) }}/{{ dynamic_hold_time
            }} min\n    {% endif %}\n    • Base Level: {{ calculated_fan_level_int
            }} → Final: {{ final_fan_level_int }}\n    • Fan Mode: {{ selected_fan_mode
            }}\n\n⚡ Performance:\n    • Effectiveness: {{ current_effectiveness |
            round(0) }}%\n    • Rate: {{ temp_change_rate | round(2) }}°C/min\n    •
            Time in mode: {{ time_in_current_mode | round(1) }} min\n"
          level: warning
    # v9.20.0: mode clock, mode and expected mode first (fast helper writes), then the
    # ceiling fan, then the slow AC command. A run cancelled after the 'cooling' write used
    # to leave a fresh 'cooling' with no clock (the 04/10 12:55 "Cooling (101 min)").
    - if:
      - condition: template
        value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'',
          ''unknown''] and helper_last_mode_at_start != ''cooling'' }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_mode not in [none, '''', ''unavailable'', ''unknown'']
          and enable_cooling }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_mode }}'
        data:
          value: cooling
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: '{{ selected_hvac_mode }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_temp_history not in [none, '''', ''unavailable'',
          ''unknown''] and helper_last_mode_at_start != ''cooling'' }}'
      then:
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_temp_history }}'
        data:
          value: '{{ current_temp }}'
        continue_on_error: true
    # v9.20.0: recorded so the Hysteresis Tolerance applies to a later switch to heating
    # (it was only ever written by retired branches).
    - if:
      - condition: template
        value_template: '{{ helper_last_transition not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_last_transition }}'
        data:
          value: cooling
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and
          ceiling_fan_is_on and fan_with_ac_mode in [''off'', ''low''] and helper_expected_ceiling_fan
          not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_ceiling_fan }}'
        data:
          value: '{{ ''off'' if fan_with_ac_mode == ''off'' else ''on'' }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and
          ceiling_fan_is_on and fan_with_ac_mode == ''off'' }}'
      then:
      - if:
        - condition: template
          value_template: '{{ event_logging_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "[EVENT] {{ room_name }} 🌀 | Ceiling Fan Off | AC taking over, Room
              {{ current_temp }}°C"
            level: warning
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - service: switch.turn_off
            target:
              entity_id:
              - '{{ ceiling_fan_low_switch }}'
              - '{{ ceiling_fan_medium_switch }}'
              - '{{ ceiling_fan_high_switch }}'
            continue_on_error: true
        default:
        - service: homeassistant.turn_off
          target:
            entity_id: '{{ ceiling_fan_entities }}'
          continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and
          ceiling_fan_is_on and fan_with_ac_mode == ''low'' and (ceiling_fan_domain
          == ''fan'' or ceiling_fan_has_speed_switches) and (ceiling_fan_current_speed | trim) != ''low'' }}'
      then:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          # M38: break-before-make - release medium+high before energizing low
          - service: switch.turn_off
            target:
              entity_id:
              - '{{ ceiling_fan_medium_switch }}'
              - '{{ ceiling_fan_high_switch }}'
            continue_on_error: true
          - delay:
              milliseconds: 100
          - service: switch.turn_on
            target:
              entity_id: '{{ ceiling_fan_low_switch }}'
            continue_on_error: true
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_presets }}'
          sequence:
          - service: fan.set_preset_mode
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            data:
              preset_mode: low
            continue_on_error: true
        default:
        - service: fan.set_percentage
          target:
            entity_id: '{{ ceiling_fan_entities }}'
          data:
            percentage: 33
          continue_on_error: true
    # v9.20.0: with Fan With AC on, the ceiling fan runs at the speed the room calls for:
    # switched on if off, re-speeded only when the speed differs (the tracking lived only in
    # continue-cooling, so the Office fan stayed on HIGH from 25.3 all the way down, 04/10).
    # Not over a bed whose fan setting is off, not before arrival while pre-conditioning
    # skips the fan.
    - if:
      - condition: template
        # v9.20.0 (round 3): with pre-conditioning skipping fans, not on the way home in any mode
        # (an extreme-temperature start in Manual ran the fan on HIGH in an empty house), and after
        # arrival only once someone is in the room (or the room has no presence sensors).
        value_template: '{{ ceiling_fan_configured and not fan_override_active and fan_with_ac_mode == ''on''
          and not (ceiling_fan_bed_blocked | bool) and not ((is_precond_mode | bool) and fan_precondition_mode
          == ''skip'' and not ((precond_arrival_occurred | bool) and ((room_presence_detected | bool) or (bed_active
          | bool) or (room_sensors | count) == 0))) and not (enable_pre_conditioning and (approaching_home | bool)
          and not (anyone_home | bool) and fan_precondition_mode == ''skip'') and not (ceiling_fan_at_target_speed
          | bool) }}'
      then:
      - if:
        - condition: template
          value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_ceiling_fan }}'
          data:
            value: 'on'
          continue_on_error: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_has_speed_switches }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
            then:
            - if:
              - condition: template
                value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
              then:
              - service: switch.turn_off
                target:
                  entity_id: '{{ ceiling_fan_other_switches }}'
                continue_on_error: true
            - delay:
                milliseconds: 100
            - service: switch.turn_on
              target:
                entity_id: '{{ ceiling_fan_target_switch }}'
              continue_on_error: true
        - conditions:
          - condition: template
            value_template: '{{ ceiling_fan_domain == ''fan'' }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ not (ceiling_fan_is_on | bool) }}'
            then:
            - service: fan.turn_on
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
            - delay:
                milliseconds: 500
          - if:
            - condition: template
              value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
            then:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ ceiling_fan_has_presets }}'
                sequence:
                - service: fan.set_preset_mode
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  data:
                    preset_mode: '{{ ceiling_fan_target_speed }}'
                  continue_on_error: true
              default:
              - service: fan.set_percentage
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                data:
                  percentage: '{{ ceiling_fan_target_pct }}'
                continue_on_error: true
        default:
        - if:
          - condition: template
            value_template: '{{ not (ceiling_fan_is_on | bool) }}'
          then:
          - service: homeassistant.turn_on
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            continue_on_error: true
    - repeat:
        for_each: '{{ climate_list }}'
        sequence:
        # v9.19.0: send only when setpoint_send says so; the hold clock (expected-temp
        # helper) is written just BEFORE the command, as in continue-cooling (v9.15.5).
        - if:
          - condition: template
            value_template: '{{ (setpoint_send | bool) or states(repeat.item) != selected_hvac_mode
              }}'
          then:
          - if:
            - condition: template
              value_template: '{{ helper_expected_temp not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_number.set_value
              target:
                entity_id: '{{ helper_expected_temp }}'
              data:
                value: '{{ adjusted_target }}'
              continue_on_error: true
          - service: climate.set_temperature
            target:
              entity_id: '{{ repeat.item }}'
            data:
              temperature: '{{ adjusted_target }}'
              hvac_mode: '{{ selected_hvac_mode }}'
            continue_on_error: false
          - delay:
              milliseconds: 500
        # v9.19.0: never re-send a fan speed while the unit is in Powerful boost (a fan
        # command cancels Powerful on a Daikin), and stamp the fan-change clock first.
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and state_attr(repeat.item, ''preset_mode'')
              != ''boost'' }}'
          then:
          - if:
            - condition: template
              value_template: '{{ helper_last_fan_change not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_datetime.set_datetime
              target:
                entity_id: '{{ helper_last_fan_change }}'
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
          - service: climate.set_fan_mode
            target:
              entity_id: '{{ repeat.item }}'
            data:
              fan_mode: '{{ selected_fan_mode }}'
            continue_on_error: false
        # v9.20.0: swing on a start as well (it was computed and never sent); only when the
        # unit differs.
        - if:
          - condition: template
            value_template: '{{ validated_swing_mode not in [''none'', '''', ''unavailable'', ''unknown'']
              and state_attr(repeat.item, ''swing_mode'') != validated_swing_mode }}'
          then:
          - service: climate.set_swing_mode
            target:
              entity_id: '{{ repeat.item }}'
            data:
              swing_mode: '{{ validated_swing_mode }}'
            continue_on_error: true
    # v9.19.0: Powerful boost here too. It only lived in the continue-cooling branch,
    # which runs inside the comfort band; since the bands were narrowed a room far enough
    # off target to reach escalation Level 4 is always in THIS branch, so Powerful could
    # never engage. Same rules as there (v9.15.0).
    - if:
      - condition: template
        value_template: '{{ powerful_boost_enabled | bool }}'
      then:
      - repeat:
          for_each: '{{ climate_list }}'
          sequence:
          - variables:
              boost_supported: "{{ 'boost' in (state_attr(repeat.item, 'preset_modes') or []) }}"
              boost_active: "{{ state_attr(repeat.item, 'preset_mode') == 'boost' }}"
              # v9.19.0: once on, Powerful stays on through an established cooling run until
              # the room is within 0.5 of target, so it does not follow the escalation level's
              # run-to-run flicker (with or without Pull-down).
              boost_wanted: "{{ ((final_escalation_level | int(0)) >= 4 or ((boost_active | bool)
                and last_mode in ['cooling', 'bed_comfort_eco', 'bed_comfort_quiet', 'pre_conditioning'] and (current_temp
                - target_temp) > 0.5)) and ((powerful_boost_in_bed | bool) or not (bed_active
                | bool)) }}"
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ (boost_supported | bool) and (boost_wanted | bool) and not
                  (boost_active | bool) and states(repeat.item) != ''off'' }}'
              sequence:
              - service: climate.set_preset_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  preset_mode: boost
                continue_on_error: true
              - if:
                - condition: template
                  value_template: '{{ event_logging_enabled }}'
                then:
                - service: system_log.write
                  data:
                    message: "[EVENT] {{ room_name }} ⚡ | Powerful Boost ON | Escalation L{{ final_escalation_level }}, Room {{ current_temp }}°C, Target {{ target_temp }}°C, {{ distance_from_target | round(1) }}°C away | {{ repeat.item }}"
                    level: warning
            - conditions:
              - condition: template
                value_template: '{{ (boost_supported | bool) and (boost_active | bool) and not
                  (boost_wanted | bool) }}'
              sequence:
              - service: climate.set_preset_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  preset_mode: none
                continue_on_error: true
              - if:
                - condition: template
                  value_template: '{{ event_logging_enabled }}'
                then:
                - service: system_log.write
                  data:
                    message: "[EVENT] {{ room_name }} ⚡ | Powerful Boost OFF | Escalation L{{ final_escalation_level }}, Room {{ current_temp }}°C, Target {{ target_temp }}°C | {{ repeat.item }}"
                    level: warning
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled and (last_mode != ''cooling'' or not (unit_was_cooling | bool)) }}'
      then:
      - service: system_log.write
        data:
          message: "[EVENT] {{ room_name }} ❄️ | {{ 'Cooling Started' if not (unit_was_cooling | bool) else 'Cooling Taken
            Over (was ' ~ (last_mode | replace('_', ' ') | title) ~ ')' }} | Room {{ current_temp
            }}°C, Target {{ commanded_temp }}°C, Fan {{ selected_fan_mode }}, HVAC {{
            selected_hvac_mode }}"
          level: warning
    # v9.19.0: not while the unit is in Powerful boost: the fan command was skipped,
    # so the helper would claim a fan the unit was never told.
    - if:
      - condition: template
        value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
          ''unknown''] and not (fan_held_by_boost | bool) }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_fan }}'
        data:
          value: '{{ selected_fan_mode }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
          and ((setpoint_send | bool) or ((fan_mode_changed | bool) and not (fan_held_by_boost | bool))) }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_change }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - delay:
        milliseconds: 300
    - if:
      - condition: template
        value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - variables:
          snapshot_hvac: '{{ selected_hvac_mode }}'
          snapshot_temp: '{{ commanded_temp }}'
          snapshot_fan: '{{ selected_fan_mode }}'
          snapshot_swing: '{{ validated_swing_mode }}'
          update_snapshot: hvac={{ snapshot_hvac }},temp={{ snapshot_temp }},fan={{
            snapshot_fan }},swing={{ snapshot_swing }}
          update_checksum: '{% set hvac_codes = {''off'': 0, ''cool'': 1, ''heat'':
            2, ''auto'': 3, ''dry'': 4, ''fan_only'': 5, ''heat_cool'': 6} %} {{ ((snapshot_temp
            * 1000) + (snapshot_fan | string | length) + (snapshot_swing | string
            | length) + hvac_codes.get(snapshot_hvac, 99)) | int(0) }}

            '
      - parallel:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_last_command }}'
          data:
            value: '{{ update_snapshot }}'
          continue_on_error: true
        - service: input_number.set_value
          target:
            entity_id: '{{ helper_state_checksum }}'
          data:
            value: '{{ update_checksum }}'
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ debug_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "\U0001F4F8 {{ room_name | upper }} SNAPSHOT UPDATED (Unified
              Cooling - BEFORE service calls)\n    • New Snapshot: {{ update_snapshot
              }}\n    • New Checksum: {{ update_checksum }}\n    • HVAC: {{ snapshot_hvac
              }}\n    • Temp: {{ snapshot_temp }}°C\n    • Fan: {{ snapshot_fan }}\n
              \   • Swing: {{ snapshot_swing }}\n"
            level: warning
  - conditions:
    - condition: template
      value_template: "{# v8.9.4 FIX: Added explicit room_presence_detected check
        for Smart mode #} {# Defense-in-depth: should_activate covers this, but mode:restart
        race conditions #} {# can cause should_activate to evaluate inconsistently
        during state transitions #} {# v9.4.0: fan_presence_ok replaces dual Smart
        checks; instant mode bypasses should_activate #} {# v9.7.9 FIX: coerce
        boolean-template variables with `| bool` - they render as multi-line strings
        like '\\n  false\\n' which are TRUTHY in Jinja and bypass these guards #} {{
        ceiling_fan_configured\n   and not fan_override_active\n   and ((should_activate
        | bool) or (control_mode == 'Smart' and fan_presence_entry == 'instant'
        and (room_presence_detected | bool) and control_mode != 'Override' and not
        (manual_override_detection | bool) and ((anyone_home | bool) or (persons | count) == 0)))\n   and enable_cooling\n   and (in_ceiling_fan_zone
        | bool)\n   and not (ceiling_fan_should_escalate | bool)\n   and not (ceiling_fan_mode_active
        | bool)\n   and actual_ac_state != 'on'\n   and last_mode not in ['cooling',
        'heating']\n   and (fan_presence_ok | bool)\n   and not ((is_precond_mode
        | bool) and fan_precondition_mode == 'skip')\n   and not (enable_pre_conditioning
        and (approaching_home | bool) and not (anyone_home | bool) and not (is_precond_mode
        | bool) and fan_precondition_mode == 'skip')\n   and not ((bed_active | bool) and
        fan_bed_comfort_mode == 'off')\n   and not ((bed_active | bool) and bed_comfort_mode != 'off') }}\n"
    # v9.14.0 (bug 1): never START the ceiling fan on a phantom reading either.
    - condition: template
      value_template: '{{ temp_sensor_available | bool }}'
    sequence:
    # v9.20.0: the mode clock is stamped on entry like every other mode.
    - if:
      - condition: template
        value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'', ''unknown''] }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_mode_time }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_mode not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_mode }}'
        data:
          value: ceiling_fan_cooling
        continue_on_error: true
    # v9.14.0 (bug 4): snapshot the start-of-fan temperature for Fan Escalation.
    - if:
      - condition: template
        value_template: '{{ helper_fan_entry_temp not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_fan_entry_temp }}'
        data:
          value: '{{ current_temp }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_temp_history not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_temp_history }}'
        data:
          value: '{{ current_temp }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: '{{ helper_change }}'
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_ceiling_fan }}'
        data:
          value: 'on'
        continue_on_error: true
    - variables:
        ceiling_fan_temp_delta: '{{ (current_temp | float(0)) - (comfort_max_temp
          | float(0)) }}'
    # v9.20.0: relays only when the fan is not already at that speed (it re-sent them on
    # every entry, e.g. after a stop that left the fan on low).
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ ceiling_fan_has_speed_switches }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
          then:
          - if:
            - condition: template
              value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
            then:
            - service: switch.turn_off
              target:
                entity_id: '{{ ceiling_fan_other_switches }}'
              continue_on_error: true
          - delay:
              milliseconds: 100
          - service: switch.turn_on
            target:
              entity_id: '{{ ceiling_fan_target_switch }}'
            continue_on_error: true
      - conditions:
        - condition: template
          value_template: '{{ ceiling_fan_domain == ''fan'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ not (ceiling_fan_is_on | bool) }}'
          then:
          - service: fan.turn_on
            target:
              entity_id: '{{ ceiling_fan_entities }}'
            continue_on_error: true
          - delay:
              milliseconds: 500
        - if:
          - condition: template
            value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
          then:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_presets }}'
              sequence:
              - service: fan.set_preset_mode
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                data:
                  preset_mode: '{{ ceiling_fan_target_speed }}'
                continue_on_error: true
            default:
            - service: fan.set_percentage
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              data:
                percentage: '{{ ceiling_fan_target_pct }}'
              continue_on_error: true
      default:
      - if:
        - condition: template
          value_template: '{{ not (ceiling_fan_is_on | bool) }}'
        then:
        - service: homeassistant.turn_on
          target:
            entity_id: '{{ ceiling_fan_entities }}'
          continue_on_error: true
    - if:
      - condition: template
