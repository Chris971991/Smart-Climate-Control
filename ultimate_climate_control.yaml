  # since v9.11.0 allows Manual as a default it could silently stop a room automating.
  # The select below uses the return_to_mode variable captured at the top of this block,
  # not a re-read, so the local path is unaffected. M28 still holds: whichever run
  # survives consumes the snapshot.
  - if:
    - condition: template
      value_template: '{{ helper_mode_before_override not in [none, '''', ''unavailable'',
        ''unknown''] }}'
    then:
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_mode_before_override }}'
      data:
        value: ''
      continue_on_error: true
  - service: input_select.select_option
    target:
      entity_id: '{{ control_mode_helper }}'
    data:
      option: '{{ return_to_mode }}'
    continue_on_error: true
  - stop: Override timeout expired - mode restored
- if:
  - condition: template
    value_template: '{{ fan_override_active and control_mode != ''Override'' and override_timeout
      > 0 }}'
