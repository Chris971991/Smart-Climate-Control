trigger:
- platform: state
  entity_id: !input climate_entities
  attribute: current_temperature
  id: temp_change
- platform: state
  entity_id: !input climate_entities
  id: climate_state_change
- platform: state
  entity_id: !input temperature_sensor
  id: external_temp_change
- platform: time_pattern
  minutes: /1
  id: periodic_check
- platform: state
  entity_id: !input direction_sensor
  to: towards
  # v9.20.0: 'towards' must hold for a minute (GPS drift while parked flips it for
  # seconds at a time; approaching_home applies the same 60 s rule).
  for:
    seconds: 60
  id: heading_home
# v9.20.0: coming inside the pre-conditioning distance is checked straight away instead
# of waiting for the next periodic check.
- platform: numeric_state
  entity_id: !input proximity_sensor
  below: !input home_zone_distance
  id: approach_zone_entered
- platform: state
  entity_id: !input direction_sensor
  to: arrived
  id: arrived
- platform: state
  entity_id: !input presence_persons
  id: presence_change
- platform: state
  entity_id: !input presence_devices
  id: device_change
- platform: state
  entity_id: !input room_presence_sensors
  id: room_presence_change
- platform: state
  entity_id: !input auto_off_persons
  id: auto_off_person_change
- platform: state
  entity_id: !input auto_off_sensors_1_home
  id: auto_off_sensor_1_change
- platform: state
  entity_id: !input auto_off_sensors_all_home
  id: auto_off_sensor_all_change
- platform: state
  entity_id: !input helper_control_mode
  id: mode_change
- platform: state
  entity_id: !input helper_override_active
  from: 'on'
  to: 'off'
  id: override_cleared_by_user
- platform: state
  entity_id: !input ceiling_fan_entity
  id: ceiling_fan_state_change
- platform: event
  event_type: daikin_physical_remote_override
  id: physical_remote_override
- platform: state
  entity_id: !input window_sensors
  to: 'on'
  for:
    minutes: !input window_open_delay
  id: window_opened
- platform: state
  entity_id: !input window_sensors
  to: 'off'
  for:
    minutes: !input window_close_delay
  id: window_closed
condition:
- condition: template
  value_template: |
    {# v9.15.5: 'busy' = a run started less than 120 s ago is still in flight. Under
       mode: restart every accepted trigger cancels it, and a continue-cooling run on a
       BRP072C spends 40 to 70 s inside set-temperature and fan calls. Triggers that carry
       nothing the next check cannot pick up (the minute tick, the unit's own temperature
       reading, the room sensor's 0.1°C steps) no longer cancel a busy run. Observed
       05/09 19:41 to 19:47 on the Office: no continue-cooling run reached its helper
       writes, the setpoint-hold clock never advanced, and the setpoint changed four
       times in five minutes. Bounded to 120 s (the blueprint has no long delays or
       waits) so a stuck run can never suspend the periodic duties. #}
    {% set ns = namespace(busy=false) %}
    {% if this is defined and this.attributes is defined and (this.attributes.current | int(0)) > 0 and this.attributes.last_triggered is not none %}
      {% set ns.busy = (as_timestamp(now()) - (as_timestamp(this.attributes.last_triggered) | float(0))) < 120 %}
    {% endif %}
    {# v9.20.0: helper: is this state change this automation's OWN command echoing back?
       `this` is the automation's state at trigger time; its context is the run in flight
       (verified: the automation entity's state context equals its run context, and the
       units/relays it commands carry that id). #}
    {% set echo = this is defined and this.context is defined and this.context is not none
       and trigger.to_state is defined and trigger.to_state is not none
       and trigger.to_state.context is not none
       and (trigger.to_state.context.id == this.context.id
            or trigger.to_state.context.parent_id == this.context.id) %}
    {% if trigger.id == 'periodic_check' %}
      {# v9.15.5: the check-interval gate lived in the action (should_proceed), so every
         minute's tick restarted the run in flight and then bailed out. Gated here. #}
      {% set interval = check_interval_gate | int(1) %}
      {{ (not ns.busy) and (interval <= 0 or (now().minute % interval) == 0) }}
    {% elif trigger.id == 'temp_change' %}
      {# v9.20.0: the unit's own sensor only matters when no room sensor is configured
         (it restarted every room's run 120-185 times a day for nothing). #}
      {{ (not ns.busy) and not temp_sensor }}
    {% elif trigger.id == 'external_temp_change' %}
      {{ (not ns.busy) and (trigger.from_state is none or trigger.to_state is none or trigger.from_state.state != trigger.to_state.state) }}
    {% elif trigger.id == 'climate_state_change' %}
      {# Only accept if HVAC mode actually changed (off↔cool↔heat↔dry↔fan_only) #}
      {# v9.20.0: and not when the change is this automation's OWN command echoing back.
         Turning a unit off->cool fired this trigger and mode: restart cancelled the run
         that sent it, so every step after the command was lost. 04/10 12:55: the Office
         started cooling but its mode clock was never stamped, so the next check read
         "Cooling (101 min)" two minutes in and jumped to escalation Level 4 (the same
         clock drives the runtime and off-time protection). `this` is the automation's
         state at trigger time; its context is the run in flight, and that run's service
         calls carry it (HA's logbook attributes the change to the automation the same
         way). Changes from the remote, the app, HA's UI or another automation have a
         different context and still pass. #}
      {# Only counted as an echo when the unit shows the mode we commanded (the integration
         records expected_hvac_mode before every mode command). HA keeps a service call's
         context on the entity for 5 s, so a poll revealing a REMOTE press inside that
         window carries our context too; it must not be dropped. #}
      {% set exp = trigger.to_state.attributes.get('expected_hvac_mode')
         if trigger.to_state is not none and trigger.to_state.attributes is defined else none %}
      {% set own = echo and (exp is none or exp == '' or trigger.to_state.state == exp) %}
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != trigger.to_state.state and not own }}
    {% elif trigger.id == 'ceiling_fan_state_change' %}
      {# v9.0.0: Only accept if ceiling fan state actually changed (on↔off) #}
      {# H11: Ignore fan changes caused by our own service calls - prevents mode:restart
         from killing the override-activation sequence between fan shutdown and
         select_option Override #}
      {# v9.20.0: runs started by the minute tick have no parent context, so their own
         relay changes passed the parent test, restarted the run between "old relay off"
         and "new relay on" (fan left off) and were then read as a wall-switch override
         (5 false fan overrides in 10 days). Own echoes are now dropped explicitly. #}
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != trigger.to_state.state
         and (trigger.to_state.context.parent_id is none) and not echo }}
    {% elif trigger.id in ['presence_change', 'device_change', 'room_presence_change', 'auto_off_person_change', 'auto_off_sensor_1_change', 'auto_off_sensor_all_change', 'external_temp_change'] %}
      {# M30: Ignore attribute-only updates (GPS coords, RSSI) - only real state transitions.
         none-guards let entity-appeared/removed events pass through (startup behavior).
         v9.13.0: external_temp_change added - Zigbee temperature sensors re-report link
         quality every minute with an unchanged reading; each one restarted the run. #}
      {{ trigger.from_state is none or trigger.to_state is none or trigger.from_state.state != trigger.to_state.state }}
    {% elif trigger.id == 'mode_change' %}
      {# v9.20.0: only a real change of control mode (a no-op write re-ran the handler). #}
      {{ trigger.from_state is none or trigger.to_state is none
         or trigger.from_state.state != trigger.to_state.state }}
    {% elif trigger.id == 'physical_remote_override' %}
      {# v9.20.0: only this room's units (a press in one room restarted every room). #}
      {{ trigger.event.data.entity_id is defined and trigger.event.data.entity_id in climate_list }}
    {% else %}
      {# All other triggers pass through #}
      true
    {% endif %}
action:
- condition: template
  value_template: '{{ trigger is defined and trigger.id is defined }}'
- if:
  - condition: template
    value_template: "{{ trigger.id == 'climate_state_change'\n   and trigger.to_state.context.user_id
      is not none\n   and trigger.to_state.context.parent_id is none\n   and helper_last_ui_click
      not in [none, '', 'unavailable', 'unknown'] }}\n"
  then:
  - service: input_datetime.set_datetime
    target:
      entity_id: '{{ helper_last_ui_click }}'
    data:
      datetime: '{{ now().isoformat() }}'
    continue_on_error: true
- if:
  - condition: template
    value_template: '{{ helper_override_timeout_storage not in [none, '''', ''unavailable'',
      ''unknown''] }}'
  # v9.13.0: only write when the stored value differs. This ran on EVERY trigger of
  # every room (thousands of no-op state writes a day).
  - condition: template
    value_template: '{{ (states(helper_override_timeout_storage) | float(-1)) != (override_timeout
      | float(-2)) }}'
  then:
  - service: input_number.set_value
    target:
      entity_id: '{{ helper_override_timeout_storage }}'
    data:
      value: !input override_timeout
    continue_on_error: true
- choose:
  - conditions:
    - condition: template
      value_template: "{{ helper_state_machine not in [none, '', 'unavailable', 'unknown']
        and\n   states(helper_state_machine) in ['unknown', 'unavailable', ''] }}\n"
    sequence:
    - service: input_select.select_option
      target:
        entity_id: '{{ helper_state_machine }}'
      data:
        option: AUTOMATION_OFF
      continue_on_error: true
    - service: input_datetime.set_datetime
      target:
        entity_id: '{{ helper_state_start }}'
      data:
        datetime: '{{ now() }}'
      continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_last_command }}'
      data:
        value: ''
      continue_on_error: true
    - service: input_number.set_value
      target:
        entity_id: '{{ helper_state_checksum }}'
      data:
        value: 0
      continue_on_error: true
  default: []
# v9.20.0: the ONE place a control-mode change writes the room's last mode. Into Smart or
# Auto it records what the unit is really doing, so a running unit is adopted as a live
# run instead of 'off' (Override -> Smart read a cooling unit as 'off', re-armed the
# 5-minute off-time protection and held hot rooms for 5-8 minutes on 24-25/09; the
# v9.17.1 hand-back covered only Pre-conditioning -> Smart/Auto and was then overwritten
# by a second writer). Into Manual or Override it records 'off' (automation paused);
# into Pre-conditioning it is left to the start branch. The mode clock is stamped first
# and only when the recorded value actually changes.
- if:
  - condition: template
    # v9.20.0 (round 3): not when the control-mode helper itself drops out (it was recorded as
    # a switch to Manual, and on its return the Bed ECO rest label was lost).
    value_template: '{{ trigger.id == ''mode_change'' and helper_mode not in [none,
      '''', ''unavailable'', ''unknown''] and trigger.to_state is defined and trigger.to_state
      is not none and trigger.to_state.state not in [''unavailable'', ''unknown''] }}'
  then:
  - variables:
      # v9.20.0: Smart <-> Auto keeps the run as it is (a switch at night turned Bed ECO into
      # plain cooling and the ceiling-fan rest into 'off'); a unit cooling over an occupied bed
      # is adopted as Bed ECO so the night's rest cycle runs (04/10 01:14, an Override ending
      # with Chris in bed went to 'off' and the rest never ran); heating only when enabled.
      mode_change_record: "{% set to = trigger.to_state.state %}{% set frm = trigger.from_state.state if
        trigger.from_state is defined and trigger.from_state is not none else '' %}{% set cur = states(helper_mode)
        %}{% set unit = states(climate_list[0]) if climate_list | length > 0 else 'off' %}{% if to == 'Pre-conditioning'
        %}{{ cur }}{% elif to in ['Smart', 'Auto'] and frm in ['Smart', 'Auto', 'unavailable', 'unknown', ''] %}{{ cur }}{% elif to in ['Smart',
        'Auto'] and unit == 'cool' and (bed_occupied | bool) and bed_comfort_mode in ['eco', 'quiet'] %}bed_comfort_{{
        bed_comfort_mode }}{% elif to in ['Smart', 'Auto'] and unit == 'cool' %}cooling{% elif to in ['Smart', 'Auto']
        and unit == 'heat' and enable_heating %}heating{% else %}off{% endif %}"
  - if:
    - condition: template
