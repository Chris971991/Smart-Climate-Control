# v9.16.2: undoing the hand change ends the fan override. A fan override starts because the
# fan was put somewhere the automation did not expect; when the user then puts it back to
# the tracked state (what the automation last wanted, written at activation), there is
# nothing left to protect, so the override ends now instead of running out its timer.
# Independent mode only: in linked mode the room-wide Override may also carry an AC change
# this trigger cannot see. Only our own fan commands carry a parent_id, so a change with
# none is the user (wall switch, dashboard or app). Mirrors the manual-clear handler:
# 'both' keeps its AC half, the flag goes off only when nothing is left, flag LAST.
- if:
  - condition: template
    value_template: '{{ trigger.id == ''ceiling_fan_state_change'' }}'
  - condition: template
    value_template: '{{ fan_override_active and override_behavior == ''independent'' and
      ceiling_fan_configured }}'
  - condition: template
    value_template: "{{ trigger.to_state is defined and trigger.from_state is defined\n
      \  and trigger.from_state.state not in ['unavailable', 'unknown']\n   and trigger.to_state.state
      not in ['unavailable', 'unknown']\n   and (trigger.to_state.context.parent_id | default(none))
      is none\n   and helper_expected_ceiling_fan not in [none, '', 'unavailable', 'unknown']\n
      \  and states(helper_expected_ceiling_fan) in ['on', 'off']\n   and trigger.to_state.state
      == states(helper_expected_ceiling_fan) }}\n"
  then:
  - if:
    - condition: template
