  helper_last_transition: "{{ helper_last_transition_input if helper_last_transition_input is string else '' }}"
  hysteresis_tolerance: !input hysteresis_tolerance
  overshoot_strategy_input: !input target_overshoot_strategy
  # v9.20.0: an unquoted off/on/none in the automation's YAML arrives as a boolean or
