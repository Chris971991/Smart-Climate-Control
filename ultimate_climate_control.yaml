      or (fan_boost_dir == 'heat' and delta <= -5) %}{% set ns.b = 1 %}{% endif %}{% endif %}{% if enable_heat_source_fan_boost
      and enable_heat_source_compensation and fan_boost_dir == 'cool' and (heat_source_load | float(0)) >= (heat_source_threshold
      | float(50)) %}{% set ns.b = ns.b + (heat_source_fan_boost | int(0)) %}{% endif %}{{ ns.b }}"
    fan_boost_hold: "{% set ns = namespace(b=0) %}{% if enable_outside_temp_fan_boost %}{% set delta = (outdoor_temperature
