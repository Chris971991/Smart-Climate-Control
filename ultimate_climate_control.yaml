        comfort_max_temp }} = {{ current_temp >= comfort_min_temp and current_temp
        <= comfort_max_temp }}\n\n\U0001F504 Continue Cooling WHY NOT:\n    • last_mode in [cooling,bed_eco,bed_quiet]: {{ last_mode in ['cooling', 'bed_comfort_eco', 'bed_comfort_quiet'] }}\n    • current_temp({{ current_temp }}) > overshoot_target({{ target_temp - target_overshoot }}): {{ current_temp > (target_temp - target_overshoot) }}\n    • current_temp({{ current_temp }}) <= comfort_max({{ comfort_max_temp }}): {{ current_temp <= comfort_max_temp }}\n    • actual_ac_state: {{ actual_ac_state }}\n    • should_activate: {{ should_activate }}\n\n\U0001F525 Start Cooling WHY NOT:\n    {% set bed_eco_active_check = bed_comfort_mode != 'off' and bed_eco_fan_only_mode in ['enabled', 'ceiling_fan'] and (bed_active | bool) and last_mode != 'cooling' %}{% set bed_eco_max_check = target_temp + bed_eco_return_threshold if bed_eco_active_check else comfort_max_temp %}• current_temp({{ current_temp }}) > activation_threshold({{ bed_eco_max_check }}): {{ current_temp > bed_eco_max_check }}\n    • enable_cooling: {{ enable_cooling }}\n    • should_activate: {{ should_activate }}\n    • not in_ceiling_fan_zone OR escalating: {{ not in_ceiling_fan_zone or ceiling_fan_should_escalate }}\n\n\U0001F6CF️ Bed Eco Debug:\n    • bed_occupied: {{ bed_occupied }}\n    • bed_comfort_mode: {{ bed_comfort_mode }}\n    • bed_eco_at_target: {{ bed_eco_at_target }}\n    • bed_eco_should_fan_only: {{ bed_eco_should_fan_only }}\n    • bed_eco_should_return: {{ bed_eco_should_return }}\n    • bed_eco_fan_only_mode: {{ bed_eco_fan_only_mode }}\n    • bed_eco_fan_only_trigger: {{ bed_eco_fan_only_trigger }}\n    • bed_eco_temp_stable: {{ bed_eco_temp_stable }}\n    • bed_eco_stability_minutes: {{ bed_eco_stability_minutes }}min\n    • bed_eco_stability_rate: {{ bed_eco_stability_rate }}°C/min\n    • temp_change_rate: {{ temp_change_rate }}°C/min\n    • target_temp: {{ target_temp }}°C\n    • target_overshoot: {{ target_overshoot }}°C\n\n\U0001F6CF️ Bed Comfort Entry WHY NOT:\n    • bed_sensor_on: {{ bed_occupied }}\n    • temp_in_range({{ comfort_min_temp }}-{{ target_temp + bed_eco_return_threshold }}): {{ current_temp >= comfort_min_temp and current_temp <= (target_temp + bed_eco_return_threshold) }}\n    • ac_not_off: {{ actual_ac_state != 'off' }}\n    • time_in_mode({{ time_in_current_mode | round(1) }}) >= runtime({{ runtime_min }}) or cooling: {{ time_in_current_mode | float(0) >= runtime_min | float(0) or last_mode == 'cooling' }}\n    • last_mode_allows_entry: {% if last_mode == 'bed_eco_fan_only' %}false (in fan_only){% elif last_mode in ['bed_comfort_eco', 'bed_comfort_quiet'] %}false (already in bed comfort){% elif last_mode in ['cooling', 'heating'] %}{{ current_temp <= (target_temp - target_overshoot) if last_mode == 'cooling' else current_temp >= (target_temp + target_overshoot) }} (temp check){% else %}True{% endif %}\n\n\U0001F3E0 Comfort Zone WHY NOT:\n    • in_comfort_zone: {{ current_temp >= comfort_min_temp and current_temp <= comfort_max_temp }}\n    • overshoot_reached: {% if last_mode in ['cooling', 'bed_comfort_eco', 'bed_comfort_quiet'] %}{{ current_temp <= (target_temp - target_overshoot) }} ({{ current_temp }}°C <= {{ (target_temp - target_overshoot) | round(1) }}°C){% elif last_mode == 'heating' %}{{ current_temp >= (target_temp + target_overshoot) }} ({{ current_temp }}°C >= {{ (target_temp + target_overshoot) | round(1) }}°C){% else %}True (not a cooling or heating run){% endif %}\n    • time_since_change({{ time_since_change | round(1) }}) > runtime({{ runtime_min }}): {{ time_since_change > runtime_min | float(0) }}\n    • bed_blocking: {{ bed_comfort_mode != 'off' and (bed_active | bool) }}\n    • comfort_zone_action: {{ comfort_zone_action }}\n\n\U0001F6AA Vacancy WHY NOT:\n    • control_mode_smart: {{ control_mode == 'Smart' }}\n    • room_presence: {{ room_presence_detected }}\n    • smart_presence_active: {{ smart_presence_active }}\n    • minutes_since_presence: {{ minutes_since_presence | round(0) }}min (timeout: {{ presence_timeout }}min)\n    • grace_active: {{ minutes_since_presence < presence_timeout }}\n    • bed_occupied: {{ bed_occupied }}\n    • smart_behavior: {{ smart_behavior }}\n\n\U0001F6E1️ Override Debug:\n    • manual_override_detection: {{ manual_override_detection }}\n    • ceiling_fan_override_detection: {{ ceiling_fan_override_detection }}\n    • override_source: {{ override_source }}\n    • override_behavior: {{ override_behavior }}\n    • in_ceiling_fan_zone: {{ in_ceiling_fan_zone }}\n    • ceiling_fan_mode_active: {{ ceiling_fan_mode_active }}\n\n\U0001F3AF Ceiling Fan WHY NOT:\n    • configured: {{ ceiling_fan_configured }}\n    • fan_override_active: {{ fan_override_active }}\n    • current_temp({{ current_temp }}) in zone({{ comfort_max_temp }}-{{ ceiling_fan_zone_max }}°C): {{ in_ceiling_fan_zone }}\n    • ceiling_fan_zone_max: {{ ceiling_fan_zone_max }}°C\n    • runtime: {{ ceiling_fan_runtime_minutes | round(1) }}min (escalation_timeout: {{ fan_escalation_timeout }}min)\n    • ceiling_fan_should_escalate: {{ ceiling_fan_should_escalate }}\n    • ceiling_fan_mode_active: {{ ceiling_fan_mode_active }}\n    • fan_presence_ok: {{ fan_presence_ok }}\n"
      level: warning
# v9.20.0: the safety nets after the main logic are ONE choose: at most one acts per
# run, in this order. As separate blocks they could each send their own turn-off in the
# same run (presence net + no-presence net + Target Reached = three turn-offs).
- choose:
  - conditions:
    - condition: template
      value_template: "{{ live_ac_state == 'on' and control_mode == 'Smart' and smart_presence_active
        | string | lower in ['false', 'none', ''] and not room_presence_detected and not (bed_active | bool)
        and live_mode in ['cooling', 'heating', 'bed_comfort_eco', 'bed_comfort_quiet', 'bed_eco_fan_only',
        'comfort_fan_only', 'stability_fan_only'] and (live_mode_age | float(0)) >= (runtime_min | float(0)) }}"
    sequence:
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F6AA {{ room_name | upper }} SMART MODE - PRESENCE NOT CONFIRMED\n{%
            if room_presence_detected %} ⏳ Presence detected but confirmation delay
            not met:\n    • Control Mode: Smart\n    • Sensors detecting presence: YES\n
            \   • Time with presence: {{ minutes_with_presence | round(1) }} min\n    •
            Required confirmation delay: {{ presence_confirmation_delay }} min\n    •
            Grace period since last confirmed: {{ presence_timeout }} min\n    • Current
            Mode: {{ last_mode }}\n    • Action: Turning AC OFF (presence not confirmed
            for {{ presence_confirmation_delay }} min)\n{% else %} ✅ Turning Off After
            Grace Period:\n    • Control Mode: Smart\n    • Sensors detecting presence:
            NO\n    • Minutes since last confirmed: {{ minutes_since_presence | round(1)
            }} min\n    • Grace Period: {{ presence_timeout }} minutes\n    • Current
            Mode: {{ last_mode }}\n    • Action: Turning AC OFF (no presence after grace
            period)\n{% endif %}\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F534 {{ room_name | upper }} AC DEACTIVATED\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            \U0001F4CA USER INFO: ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Final
            Temperature: {{ current_temp }}°C (Target: {{ target_temp }}°C) Mode at
            Shutdown: {{ states(helper_mode) | default('unknown') }}\nReason: Smart
            mode - No presence detected (grace period expired) • Control Mode: {{ control_mode
            }}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ \U0001F50D DEBUG DATA (for
            troubleshooting): ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Deactivation
            Conditions:\n    • actual_ac_state: {{ actual_ac_state }}\n    • time_since_change:
            {{ time_since_change | round(1) }}min\n    • control_mode: {{ control_mode
            }}\n\nTrigger Info:\n    • trigger.id: {{ trigger.id }}\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: !input helper_last_change
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: 'off'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_last_command }}'
        data:
          value: hvac=off,temp=0,fan=unknown,swing=unknown
        continue_on_error: true
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_state_checksum }}'
        data:
          value: '0'
        continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: !input helper_last_mode
      data:
        value: 'off'
      continue_on_error: true
    - service: input_datetime.set_datetime
      target:
        entity_id: !input helper_mode_start_time
      data:
        datetime: '{{ now() }}'
      continue_on_error: true
    - service: climate.turn_off
      target:
        entity_id: !input climate_entities
      continue_on_error: true
    - delay:
        milliseconds: 500
    - repeat:
        for_each: '{{ climate_list }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ states(repeat.item) not in [''off'', ''unavailable'']
              }}'
          then:
          - service: climate.turn_off
            target:
              entity_id: '{{ repeat.item }}'
            continue_on_error: true
  # v9.14.0 (bug 7): this safety net issued climate.turn_off with NO minimum-runtime term,
  # overriding the runtime guard the vacancy branch above already applies. Mirror that
  # guard: idle/fan modes may stop at once, an established run must have met runtime_min.
  - conditions:
    - condition: template
      # v9.20.0: not the modes that keep a unit on deliberately (Room Empty eco/maintain, Away
      # eco), and not when a branch above already changed the mode this run.
      value_template: '{{ control_mode == ''Smart'' and not (smart_presence_active
        | bool) and not (bed_active | bool) and live_ac_state == ''on'' and live_mode == last_mode and live_mode not
        in [''auto_off_off'', ''auto_off_eco'', ''auto_off_fan_only'', ''smart_eco'', ''smart_maintain'', ''away_eco'',
        ''away_maintain'']
        and (live_mode in [''ceiling_fan_cooling'', ''smart_off'', ''off'', ''away_off'', ''auto_off_off''] or
        (live_mode_age | float(0)) >= (runtime_min | float(0))) }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "⏹️ {{ room_name | upper }} SMART MODE - TURNING OFF (NO PRESENCE)\n\U0001F4CA
            Status:\n    • Last Mode: {{ last_mode }}\n    • AC State: {{ actual_ac_state
            }}\n    • Presence: None ({{ minutes_since_presence | round(0) }}min ago)\n
            \   • Bed Occupied: {{ bed_occupied }}\n    • Action: Turning off AC\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_last_command }}'
        data:
          value: hvac=off,temp=0,fan=unknown,swing=unknown
        continue_on_error: true
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_state_checksum }}'
        data:
          value: '0'
        continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: !input helper_last_mode
      data:
        value: smart_off
      continue_on_error: true
    - service: input_datetime.set_datetime
      target:
        entity_id: !input helper_mode_start_time
      data:
        datetime: '{{ now() }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: 'off'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_temp not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_number.set_value
        target:
          entity_id: '{{ helper_expected_temp }}'
        data:
          # v9.7.13 FIX: was hardcoded `'0'` which is outside the helper's 10-35 range,
          # causing automation errors. Use target_temp (always valid) - turning off
          # AC doesn't really need a "no expected temp" sentinel; last valid value works.
          value: '{{ target_temp | float(22) }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_fan not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_fan }}'
        data:
          value: 'off'
        continue_on_error: true
    - service: input_datetime.set_datetime
      target:
        entity_id: !input helper_last_change
      data:
        datetime: '{{ now() }}'
      continue_on_error: true
    - service: climate.turn_off
      target:
        entity_id: '{{ climate_list }}'
      continue_on_error: true
    - delay:
        milliseconds: 500
    - repeat:
        for_each: '{{ climate_list }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ states(repeat.item) not in [''off'', ''unavailable'']
              }}'
          then:
          - service: climate.turn_off
            target:
              entity_id: '{{ repeat.item }}'
            continue_on_error: true
  - conditions:
    - condition: template
      value_template: "{{ live_ac_state == 'on' and ((live_mode == 'cooling' and current_temp <= (target_temp
        - target_overshoot)) or (live_mode == 'heating' and current_temp >= (target_temp + target_overshoot)))
        and not ((bed_active | bool) and bed_comfort_mode != 'off') }}"
    sequence:
    - if:
      - condition: template
        value_template: '{{ event_logging_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "[EVENT] {{ room_name }} 🎯 | Target Reached, Turning Off | {{ last_mode
            | replace('_', ' ') | title }} for {{ time_in_current_mode | round(1) }}min,
            Room {{ current_temp }}°C, Target {{ target_temp }}°C"
          level: warning
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F3AF {{ room_name | upper }} TARGET REACHED - TURNING OFF\n✅
            Conditions Met:\n    • Current: {{ current_temp }}°C\n    • Target: {{ cooling_target_temp
            if last_mode == 'cooling' else heating_target_temp }}°C\n    • Mode: {{
            last_mode }}\n    • Runtime: {{ time_in_current_mode | round(1) }}min (min:
            {{ runtime_min }}min)\n    • Action: Turning AC OFF (target achieved)\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
          }}'
      then:
      - service: input_datetime.set_datetime
        target:
          entity_id: !input helper_last_change
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
    - service: input_datetime.set_datetime
      target:
        entity_id: !input helper_mode_start_time
      data:
        datetime: '{{ now() }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
          ''unknown''] }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: '{{ helper_expected_hvac }}'
        data:
          value: 'off'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ ceiling_fan_configured and not fan_override_active and comfort_zone_action != ''fan_only'' and live_mode == ''cooling'' and (should_activate | bool) and control_mode != ''Manual'' and not (ceiling_fan_bed_blocked | bool) }}'
      then:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ fan_at_target_temp == ''replace_ac'' }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_ceiling_fan }}'
              data:
                value: 'on'
              continue_on_error: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_speed_switches }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - if:
                  - condition: template
                    value_template: '{{ ceiling_fan_other_switches | count > 0 }}'
                  then:
                  - service: switch.turn_off
                    target:
                      entity_id: '{{ ceiling_fan_other_switches }}'
                    continue_on_error: true
                - delay:
                    milliseconds: 100
                - service: switch.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_target_switch }}'
                  continue_on_error: true
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_domain == ''fan'' }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ not (ceiling_fan_is_on | bool) }}'
                then:
                - service: fan.turn_on
                  target:
                    entity_id: '{{ ceiling_fan_entities }}'
                  continue_on_error: true
                - delay:
                    milliseconds: 500
              - if:
                - condition: template
                  value_template: '{{ (ceiling_fan_current_speed | trim) != (ceiling_fan_target_speed | trim) }}'
                then:
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ ceiling_fan_has_presets }}'
                    sequence:
                    - service: fan.set_preset_mode
                      target:
                        entity_id: '{{ ceiling_fan_entities }}'
                      data:
                        preset_mode: '{{ ceiling_fan_target_speed }}'
                      continue_on_error: true
                  default:
                  - service: fan.set_percentage
                    target:
                      entity_id: '{{ ceiling_fan_entities }}'
                    data:
                      percentage: '{{ ceiling_fan_target_pct }}'
                    continue_on_error: true
            default:
            - if:
              - condition: template
                value_template: '{{ not (ceiling_fan_is_on | bool) }}'
              then:
              - service: homeassistant.turn_on
                target:
                  entity_id: '{{ ceiling_fan_entities }}'
                continue_on_error: true
        - conditions:
          - condition: template
            value_template: '{{ fan_at_target_temp == ''off'' and (ceiling_fan_is_on | bool) }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ helper_expected_ceiling_fan not in [none, '''', ''unavailable'', ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_expected_ceiling_fan }}'
              data:
                value: 'off'
              continue_on_error: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ceiling_fan_has_speed_switches }}'
              sequence:
              - service: switch.turn_off
                target:
                  entity_id:
                  - '{{ ceiling_fan_low_switch }}'
                  - '{{ ceiling_fan_medium_switch }}'
                  - '{{ ceiling_fan_high_switch }}'
                continue_on_error: true
            default:
            - service: homeassistant.turn_off
              target:
                entity_id: '{{ ceiling_fan_entities }}'
              continue_on_error: true
    - delay:
        milliseconds: 200
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ comfort_zone_action == ''fan_only'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F300 {{ room_name | upper }} SWITCHING TO FAN ONLY MODE\n\U0001F4CA
                Status:\n    • Target reached: {{ current_temp }}°C\n    • comfort_zone_action:
                fan_only\n    • Switching from {{ last_mode }} to fan_only mode\n"
              level: warning
        - if:
          - condition: template
            value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
              ''unknown''] }}'
          then:
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_expected_hvac }}'
            data:
              value: fan_only
            continue_on_error: true
        - service: input_text.set_value
          target:
            entity_id: !input helper_expected_fan
          data:
            value: '{{ selected_fan_only_fan_mode }}'
          continue_on_error: true
        - service: input_text.set_value
          target:
            entity_id: !input helper_last_mode
          data:
            value: comfort_fan_only
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
              }}'
          then:
          - variables:
              fan_snapshot: hvac=fan_only,temp=0,fan=unknown,swing=unknown
              fan_checksum: '5'
          - service: input_text.set_value
            target:
              entity_id: '{{ helper_last_command }}'
            data:
              value: '{{ fan_snapshot }}'
            continue_on_error: true
          - service: input_number.set_value
            target:
              entity_id: '{{ helper_state_checksum }}'
            data:
              value: '{{ fan_checksum }}'
            continue_on_error: true
        - repeat:
            for_each: '{{ climate_list }}'
            sequence:
            - service: climate.set_temperature
              target:
                entity_id: '{{ repeat.item }}'
              data:
                hvac_mode: fan_only
                temperature: '{{ target_temp }}'
              continue_on_error: false
            - delay:
                milliseconds: 500
            - service: climate.set_fan_mode
              target:
                entity_id: '{{ repeat.item }}'
              data:
                fan_mode: '{{ selected_fan_only_fan_mode }}'
              continue_on_error: false
            - delay:
                milliseconds: 500
            # v9.14.0 (bug 3): swing is a fixed input; only send it when the unit differs.
            - if:
              - condition: template
                value_template: '{{ validated_swing_mode != ''none'' and state_attr(repeat.item, ''swing_mode'') != validated_swing_mode }}'
              then:
              - service: climate.set_swing_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  swing_mode: '{{ validated_swing_mode }}'
                continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ fan_mode_changed and helper_last_fan_change not in [none,
              '''', ''unavailable'', ''unknown''] }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_last_fan_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
      default:
      - if:
        - condition: template
          value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
            ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_hvac }}'
          data:
            value: 'off'
          continue_on_error: true
      - service: input_text.set_value
        target:
          entity_id: !input helper_last_mode
        data:
          value: 'off'
        continue_on_error: true
      - service: input_datetime.set_datetime
        target:
          entity_id: !input helper_mode_start_time
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
            }}'
        then:
        - variables:
            update_snapshot: hvac=off,temp=0,fan=unknown,swing=unknown
            update_checksum: '0'
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_last_command }}'
          data:
            value: '{{ update_snapshot }}'
          continue_on_error: true
        - service: input_number.set_value
          target:
            entity_id: '{{ helper_state_checksum }}'
          data:
            value: '{{ update_checksum }}'
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
              }}'
          then:
          - service: input_datetime.set_datetime
            target:
              entity_id: '{{ helper_change }}'
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ debug_enabled }}'
          then:
          - service: system_log.write
            data:
              message: "\U0001F4F8 {{ room_name | upper }} SNAPSHOT UPDATED (Target
                Reached - Turn OFF)\n    • New Snapshot: {{ update_snapshot }}\n"
              level: warning
      - service: climate.turn_off
        target:
          entity_id: !input climate_entities
        continue_on_error: true
  - conditions:
    - condition: template
      value_template: "{% set actual_hvac = states(climate_list[0]) | default('off')
        %} {% set is_unsupported_mode = actual_hvac in ['fan_only', 'dry'] %} {% set
        helper_is_heating = last_mode == 'heating' %} {% set helper_is_cooling = last_mode
        == 'cooling' %} {% set ac_is_heating = actual_hvac in ['heat'] %} {% set ac_is_cooling
        = actual_hvac in ['cool'] %} {# v9.20.0: not in Manual, and not when a branch above has
        already changed the mode this run (a stop read back as running then got relabelled) #}
        {{\n  control_mode != 'Manual' and live_mode == last_mode and not is_unsupported_mode and (\n    (live_mode
        == 'off' and live_ac_state == 'on') or\n    (live_mode == 'heating' and ac_is_cooling)
        or\n    (live_mode == 'cooling' and ac_is_heating)\n  )\n}}\n"
    sequence:
    - variables:
        in_continue_mode_cooling_check: "{% set actual_hvac = states(climate_list[0])
          | default('off') %} {% set overshoot_target = target_temp - target_overshoot
          %} {{ enable_cooling\n   and actual_hvac in ['cool']\n   and current_temp
          > overshoot_target\n   and current_temp <= comfort_max_temp }}\n"
        in_continue_mode_heating_check: "{% set actual_hvac = states(climate_list[0])
          | default('off') %} {% set overshoot_target = target_temp + target_overshoot
          %} {{ enable_heating\n   and actual_hvac in ['heat']\n   and current_temp
          < overshoot_target\n   and current_temp >= comfort_min_temp }}\n"
        # v9.20.0: a unit cooling over an occupied bed is adopted as Bed ECO, at any
        # temperature, so the hand-over and the rest take it from there; it used to be switched
        # off and the night's Bed ECO cycle never started (04/10 01:15, after an Override ended).
        probable_mode: "{% if enable_cooling and (bed_active | bool) and bed_comfort_mode in ['eco', 'quiet']
          and states(climate_list[0]) == 'cool' %}\n  bed_comfort_{{ bed_comfort_mode }}\n{% elif enable_cooling
          and current_temp > comfort_max_temp %}\n  cooling\n{% elif enable_heating and current_temp < comfort_min_temp
          %}\n  heating\n{% elif in_continue_mode_cooling_check %}\n  {# v4.0.0: Simplified
          - just show 'cooling' (no tier modes) #}\n  cooling\n{% elif in_continue_mode_heating_check
          %}\n  {# v4.0.0: Simplified - just show 'heating' (no tier modes) #}\n  heating\n{%
          else %}\n  off\n{% endif %}\n"
        in_continue_mode_cooling: '{{ in_continue_mode_cooling_check }}'
        in_continue_mode_heating: '{{ in_continue_mode_heating_check }}'
        should_be_running: '{% set actual_hvac_mode = states(climate_list[0]) | default(''off'')
          %} {% set is_unsupported_mode = actual_hvac_mode in [''fan_only'', ''dry'']
          %} {{ (probable_mode != ''off'' or in_continue_mode_cooling or in_continue_mode_heating)
          and not is_unsupported_mode }}

          '
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F504 {{ room_name | upper }} STATE SYNC: Helper/AC mismatch
            detected\n\U0001F4CA Mismatch Details:\n    • Helper Mode: {{ last_mode
            }} (says AC should be OFF)\n    • Actual AC State: {{ actual_ac_state }}
            (AC is ON)\n    • Current Temp: {{ current_temp }}°C\n    • Target Temp:
            {{ target_temp }}°C\n    • Overshoot Target: {% if enable_cooling %}{{ (target_temp
            - target_overshoot) | round(1) }}°C (cooling){% elif enable_heating %}{{
            (target_temp + target_overshoot) | round(1) }}°C (heating){% else %}N/A{%
            endif %}\n    • Comfort Zone: {{ comfort_min_temp }}-{{ comfort_max_temp
            }}°C\n\n\U0001F914 Analysis:\n    • Probable Mode: {{ probable_mode }}\n
            \   • In Continue Mode (Cooling): {{ in_continue_mode_cooling }}\n    •
            In Continue Mode (Heating): {{ in_continue_mode_heating }}\n    • Should
            AC Be Running: {{ should_be_running }}\n\n\U0001F6E0️ Action: {{ 'Updating
            helper to match AC operation' if should_be_running else 'Turning OFF AC
            (overshoot target reached)' }} \U0001F4A1 Reason: {% if should_be_running
            %}Helper out of sync - AC running but helper says \"off\" (possible causes:
            HA restart, manual control, or helper update lag){% elif in_continue_mode_cooling
            or in_continue_mode_heating %}AC in continue mode - pursuing overshoot target{{
            ' (cooling to ' + (target_temp - target_overshoot) | round(1) | string +
            '°C)' if in_continue_mode_cooling else ' (heating to ' + (target_temp +
            target_overshoot) | round(1) | string + '°C)' if in_continue_mode_heating
            }}{% else %}AC is ON but overshoot target reached - no further cooling/heating
            needed (possible causes: manual turn-on, another automation, or lingering
            AC state){% endif %}\n"
          level: warning
    - if:
      - condition: template
        value_template: '{{ should_be_running }}'
      then:
      - service: input_text.set_value
        target:
          entity_id: !input helper_last_mode
        data:
          value: '{{ probable_mode }}'
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ helper_mode_time not in [none, '''', ''unavailable'',
            ''unknown''] }}'
        then:
        - service: input_datetime.set_datetime
          target:
            entity_id: !input helper_mode_start_time
          data:
            datetime: '{{ now() }}'
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ debug_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "✅ {{ room_name | upper }} STATE SYNC: Helper updated to {{ probable_mode
              }} \U0001F4CB AC running correctly for current temp ({{ current_temp }}°C)
              - helper synced, will continue operation {% if in_continue_mode_cooling
              %}\U0001F3AF Continue mode: Cooling to overshoot target {{ (target_temp
              - target_overshoot) | round(1) }}°C{% elif in_continue_mode_heating %}\U0001F3AF
              Continue mode: Heating to overshoot target {{ (target_temp + target_overshoot)
              | round(1) }}°C{% else %}\U0001F4A1 Helper was \"off\" but AC should be
              running - restored tracking{% endif %}\n"
            level: warning
    - if:
      - condition: template
        value_template: '{{ not should_be_running }}'
      then:
      - if:
        - condition: template
          value_template: '{{ helper_change not in [none, '''', ''unavailable'', ''unknown'']
            }}'
        then:
        - service: input_datetime.set_datetime
          target:
            entity_id: !input helper_last_change
          data:
            datetime: '{{ now() }}'
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ helper_expected_hvac not in [none, '''', ''unavailable'',
            ''unknown''] }}'
        then:
        - service: input_text.set_value
          target:
            entity_id: '{{ helper_expected_hvac }}'
          data:
            value: 'off'
          continue_on_error: true
      - service: input_text.set_value
        target:
          entity_id: !input helper_last_mode
        data:
          value: 'off'
        continue_on_error: true
      - service: input_datetime.set_datetime
        target:
          entity_id: !input helper_mode_start_time
        data:
          datetime: '{{ now() }}'
        continue_on_error: true
      - repeat:
          for_each: '{{ climate_list }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ helper_last_command not in [none, '''', ''unavailable'',
                ''unknown''] }}'
            then:
            - service: input_text.set_value
              target:
                entity_id: '{{ helper_last_command }}'
              data:
                value: hvac=off,temp=0,fan=unknown,swing=unknown
              continue_on_error: true
            - service: input_number.set_value
              target:
                entity_id: '{{ helper_state_checksum }}'
              data:
                value: '0'
              continue_on_error: true
          - service: climate.set_hvac_mode
            target:
              entity_id: '{{ repeat.item }}'
            data:
              hvac_mode: 'off'
            continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ debug_enabled }}'
        then:
        - service: system_log.write
          data:
            message: "✅ {{ room_name | upper }} STATE SYNC: AC turned OFF \U0001F4CB
              Temperature {{ current_temp }}°C - overshoot target reached \U0001F3AF
              Overshoot target: {% if enable_cooling %}{{ (target_temp - target_overshoot)
              | round(1) }}°C (cooling){% elif enable_heating %}{{ (target_temp + target_overshoot)
              | round(1) }}°C (heating){% else %}{{ target_temp }}°C{% endif %} \U0001F4A1
              Helper was \"off\" but AC was running - turned off after reaching overshoot
              target\n"
            level: warning
  - conditions:
    - condition: template
      # v9.20.0: not the Bed ECO ceiling-fan rest (the unit is off there by design; this ended
      # every rest 30 minutes in, so the compressor came back at the fan-zone top with no bed
      # cap instead of at the return point).
      value_template: '{{ live_mode in [''cooling'', ''heating'', ''eco'', ''bed_comfort_eco'',
        ''bed_comfort_quiet'', ''bed_eco_fan_only'', ''comfort_fan_only'', ''stability_fan_only'', ''away_eco'']
        and live_ac_state == ''off'' and (live_change_age | float(0)) > 30 and not (live_mode == ''bed_eco_fan_only''
        and bed_eco_fan_only_mode == ''ceiling_fan'') }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F504 {{ room_name | upper }} STATE SYNC REVERSE: Helper/AC
            mismatch detected (v3.9.44 FIX)\n\U0001F4CA Mismatch Details:\n    • Helper
            Mode: {{ last_mode }} (says AC should be running)\n    • Actual AC State:
            {{ actual_ac_state }} (AC is OFF)\n    • Current Temp: {{ current_temp }}°C\n
            \   • Target Temp: {{ target_temp }}°C\n    • Time since last change: {{
            time_since_change | round(1) }}min\n\n\U0001F527 Analysis:\n    • AC was
            probably turned off by automation (temperature reached)\n    • Helper stuck
            at \"{{ last_mode }}\" instead of \"off\"\n    • Without fix: Manual override
            keeps triggering on every check\n\n✅ Action: Syncing helper to \"off\" to
            match reality\n"
          level: warning
    - service: input_text.set_value
      target:
        entity_id: !input helper_last_mode
      data:
        value: 'off'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - service: system_log.write
        data:
          message: "✅ {{ room_name | upper }} STATE SYNC REVERSE: Helper updated to
            \"off\" \U0001F4CB Helper now matches AC state - manual override cleared
            automatically\n"
          level: warning
- if:
  - condition: template
    value_template: '{{ helper_state_machine not in [none, '''', ''unavailable'',
      ''unknown''] }}'
  then:
  - service: input_select.select_option
    target:
      entity_id: '{{ helper_state_machine }}'
    data:
      # v9.20.0: from the mode as it is now, not as it was when the run started.
      option: "{% set m = states(helper_mode) %}{% if any_ac_unavailable | bool %}LOCKED{% elif control_mode == 'Manual'
        %}MANUAL_CONTROL{% elif m in ['cooling', 'cooling_low', 'cooling_medium', 'cooling_high', 'bed_comfort_quiet']
        or (m == 'pre_conditioning' and states(climate_list[0]) != 'heat') %}AUTOMATION_COOLING{% elif m in ['heating',
        'heating_low', 'heating_medium', 'heating_high'] or m == 'pre_conditioning' %}AUTOMATION_HEATING{% elif m
        in ['eco', 'bed_comfort_eco', 'auto_off_eco', 'smart_eco', 'smart_maintain', 'away_eco', 'stability_eco']
        %}AUTOMATION_ECO{% elif m in ['stability_fan_only', 'auto_off_fan_only', 'comfort_fan_only', 'bed_eco_fan_only',
        'ceiling_fan_cooling'] %}AUTOMATION_FAN_ONLY{% else %}AUTOMATION_OFF{% endif %}"
    continue_on_error: true
- if:
  - condition: template
    value_template: "{{\n  trigger.id == 'periodic_check' and\n  helper_temp_history
      not in [none, '', 'unavailable', 'unknown']\n}}\n"
  then:
  - service: input_number.set_value
    target:
      entity_id: '{{ helper_temp_history }}'
    data:
      value: '{{ current_temp }}'
    continue_on_error: true
- if:
  - condition: template
    value_template: '{{ helper_last_command not in [none, '''', ''unavailable'', ''unknown'']
      and climate_list | length > 0 }}'
  then:
  - variables:
      final_actual_hvac: '{{ states(climate_list[0]) }}'
      final_actual_temp: '{{ state_attr(climate_list[0], ''temperature'') | float(0)
        | round(1) }}'
      final_actual_fan: '{{ state_attr(climate_list[0], ''fan_mode'') | default(''unknown'')
        }}'
      final_actual_swing: '{{ state_attr(climate_list[0], ''swing_mode'') | default(''unknown'')
        }}'
      final_snapshot: hvac={{ final_actual_hvac }},temp={{ final_actual_temp }},fan={{
        final_actual_fan }},swing={{ final_actual_swing }}
      final_checksum: '{% set hvac_codes = {''off'': 0, ''cool'': 1, ''heat'': 2,
        ''auto'': 3, ''dry'': 4, ''fan_only'': 5, ''heat_cool'': 6} %} {{ ((final_actual_temp
        * 1000) + (final_actual_fan | string | length) + (final_actual_swing | string
        | length) + hvac_codes.get(final_actual_hvac, 99)) | int(0) }}

        '
  - service: input_text.set_value
    target:
      entity_id: '{{ helper_last_command }}'
    data:
      value: '{{ final_snapshot }}'
    continue_on_error: true
  - service: input_number.set_value
    target:
      entity_id: '{{ helper_state_checksum }}'
    data:
      value: '{{ final_checksum }}'
    continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ debug_enabled }}'
    then:
    - service: system_log.write
      data:
        message: "\U0001F512 {{ room_name | upper }} FINAL SNAPSHOT SYNC\n    • Snapshot:
          {{ final_snapshot }}\n    • Checksum: {{ final_checksum }}\n    • Source:
          Actual AC state (safety net)\n"
        level: warning
- if:
  - condition: template
    value_template: "{{ event_logging_enabled and trigger.id in ['periodic_check',
      'climate_state_change', 'mode_change'] }}\n"
  then:
  - variables:
      evt_hvac: '{{ states(climate_list[0]) if climate_list | length > 0 else ''unknown''
        }}'
      evt_setpoint: '{{ state_attr(climate_list[0], ''temperature'') | default(''N/A'')
        if climate_list | length > 0 else ''N/A'' }}'
      evt_fan: '{{ state_attr(climate_list[0], ''fan_mode'') | default(''N/A'') if
        climate_list | length > 0 else ''N/A'' }}'
      evt_mode: '{{ states(helper_mode) if helper_mode not in [none, '''', ''unavailable'',
        ''unknown''] else ''unknown'' }}'
      evt_prev: '{{ last_mode }}'
      evt_changed: '{{ evt_mode != evt_prev }}'
      evt_is_active: '{{ evt_mode in [''cooling'', ''heating'', ''bed_comfort_eco'',
        ''bed_comfort_quiet''] }}'
      evt_esc: '{% if evt_is_active and final_escalation_level | int(0) > 0 %}L{{
        final_escalation_level }}{% else %}0{% endif %}'
      evt_eff: '{% if evt_is_active %}{{ current_effectiveness | int(0) }}{% else
        %}N/A{% endif %}'
      evt_adj_target: '{{ adjusted_target | round(1) if evt_is_active else target_temp
        }}'
      evt_cfan_speed: '{% if ceiling_fan_configured and is_state(ceiling_fan_entity, ''on'') %}{% if
        is_state(ceiling_fan_high_switch, ''on'') %}high{% elif is_state(ceiling_fan_medium_switch,
        ''on'') %}medium{% elif is_state(ceiling_fan_low_switch, ''on'') %}low{% else
        %}on{% endif %}{% elif ceiling_fan_configured %}off{% else %}N/A{% endif %}'
      evt_rate: '{{ temp_change_rate | round(3) if temp_change_rate is defined else
        0 }}'
      evt_dist: '{{ distance_from_target | round(1) if distance_from_target is defined
        else 0 }}'
      evt_deesc: '{{ deescalation_level | int(0) if deescalation_level is defined
        else 0 }}'
      evt_outside: '{{ outdoor_temperature | round(1) if outdoor_temperature is defined
        and outdoor_temperature | float(0) > 0 else ''N/A'' }}'
      evt_stalling: '{{ is_stalling if is_stalling is defined else false }}'
  - if:
    - condition: template
      value_template: "{{ evt_mode not in ['off', 'smart_off', 'away_off', 'auto_off_off',
        'stability_off', 'window_off'] or evt_changed }}"
    then:
    - service: system_log.write
      data:
        message: "[EVENT] {{ room_name }}{% if evt_changed %} ★{% endif %} | {{ evt_mode | replace('_', ' ') | title }} ({{ time_in_current_mode | round(0) }}min){% if evt_changed %}, was {{ evt_prev | replace('_', ' ') | title }}{% endif %} | Room {{ current_temp }}°C, {{ evt_rate }}°C/min{% if evt_outside != 'N/A' %}, outside {{ evt_outside }}°C{% endif %} | Target {{ target_temp }}°C{% if evt_is_active %}, {{ evt_dist }}°C away{% endif %}{% if evt_is_active and evt_adj_target | float(0) != target_temp | float(0) %} (esc L{{ final_escalation_level }} → {{ evt_adj_target }}°C){% elif evt_is_active and evt_deesc | int(0) > 0 %} (de-esc L{{ evt_deesc }}){% endif %} | AC: {{ evt_hvac }}{% if evt_setpoint not in ['N/A', 'None', none] %} @ {{ evt_setpoint }}°C{% endif %}, Fan {{ evt_fan }}{% if evt_is_active %}, {{ evt_eff }}% eff{% if evt_stalling | bool %}, STALLING{% endif %}{% endif %} | {{ control_mode }}{% if control_mode == 'Smart' %}, {{ 'present' if room_presence_detected else 'no presence' }}{% if not (smart_presence_active | bool) %}, INACTIVE{% endif %}{% endif %}{% if bed_occupied %}, in bed{% endif %}{% if ceiling_fan_configured %} | Ceiling fan {{ evt_cfan_speed }}{% endif %}{% if manual_override_detection | bool %} | ⚠️ OVERRIDE DETECTED{% endif %} | trigger={{ trigger.id }}"
        level: warning
- if:
  - condition: template
    value_template: '{{ debug_enabled }}'
  then:
  - service: system_log.write
    data:
      message: "[18/18] ✅ {{ room_name | upper }} CLIMATE CONTROL: All Good\n{% if
        (last_mode == 'cooling' or last_mode == 'heating') and actual_ac_state ==
        'on' %}\U0001F504 AC Status:\n    • Mode: {{ last_mode|title }} active\n    •
        Current Temperature: {{ current_temp }}°C\n{% if last_mode == 'cooling' %}
        \U0001F3AF Cooling Targets:\n    • Comfort Temperature: {{ target_temp }}°C{%
        if target_overshoot > 0 %}\n    • Overshoot Target: {{ (target_temp - target_overshoot)
        | round(1) }}°C\n    • Distance to Target: {{ (current_temp - (target_temp
        - target_overshoot)) | round(1) }}°C away{% endif %}\n{% elif last_mode ==
        'heating' %} \U0001F3AF Heating Targets:\n    • Comfort Temperature: {{ target_temp
        }}°C{% if target_overshoot > 0 %}\n    • Overshoot Target: {{ (target_temp
        + target_overshoot) | round(1) }}°C\n    • Distance to Target: {{ ((target_temp
        + target_overshoot) - current_temp) | round(1) }}°C away{% endif %}\n{% endif
        %}{% elif current_temp >= comfort_min_temp and current_temp <= comfort_max_temp
        and actual_ac_state == 'off' %}\U0001F3AF Status:\n    • Temperature: {{ current_temp
        }}°C is perfect\n    • AC State: Off{% else %}⏸️ Status:\n    • No action
        required right now{% endif %}\n\n\U0001F4CB Technical Details:\n    • Temperature:
        {{ current_temp }}°C\n    • Occupancy: {% if room_presence_detected %}Room
        occupied{% elif anyone_home %}Home but elsewhere{% elif approaching_home %}Approaching{%
        else %}Away{% endif %}\n    • Current Mode: {% if should_activate and (last_mode
        == 'cooling' or last_mode == 'heating') %}{{ last_mode|title }}{% if dynamic_enabled
        and (final_escalation_level | int(0)) > 0 %} - ESCALATING L{{ final_escalation_level
        }} \U0001F53C{% elif dynamic_enabled and deescalation_level > 0 %} - DE-ESCALATING
        L{{ deescalation_level }} \U0001F53D{% elif dynamic_enabled and current_effectiveness
        >= 80 %} - EFFECTIVE ({{ current_effectiveness }}%) ⚖️{% endif %}{% elif actual_ac_state
        == 'off' %}OFF ⚫{% elif current_temp >= comfort_min_temp and current_temp
        <= comfort_max_temp %}IDLE - COMFORT ZONE{% if dynamic_enabled and deescalation_level
        > 0 %} (DE-ESCALATED L{{ deescalation_level }}) \U0001F53D{% endif %} ✅{%
        elif should_activate %}MONITORING ⏸️{% else %}STANDBY{% if last_mode != 'off'
        %} - LAST: {{ last_mode|title }}{% endif %}{% endif %}\n"
      level: warning
mode: restart
