      %} {% set rate = temp_change_rate | float(0) %} {% set is_cooling = last_mode
      == ''cooling'' %} {% set is_heating = last_mode == ''heating'' %} {{ (is_cooling
      and rate < -(min_progress * 1.5)) or (is_heating and rate > (min_progress *
      1.5)) }}

      '
    # v9.20.0: the outside-temperature and heat-source fan boosts are added to the band level
    # BEFORE the slow-down hold. They were added after it, on top of a current fan speed that
    # already contained them, so the fan flipped 4/5 every hold period (Living Room replay,
    # 04/10 15:11 to 15:36: 7 fan commands in 25 min). A boost that is already applied (fan
    # above the unboosted level) only drops once the load or the outdoor temperature is a
    # margin below its threshold (1 degree, 20 % load), so a PC load hovering at 40 % no longer
    # flips the fan (13 Office commands on 04/10; round 3: the four-PC average swung 8 to 49 %
    # inside 85 minutes, so 10 points was still crossed 12 times). Cooling/heating is judged
    # from the room as well as the mode, so a start gets the boost on its first command. The
    # boost kept is never more than what is already applied (with the fan one step above base
    # and the outdoor hold at +2, the fan went to 5 before 35 degrees justified it).
    # v9.20.0 (round 3): none over an occupied bed whatever the label (a cooling start in bed got
    # fan 5 from the outdoor boost where the bed path sent 4).
