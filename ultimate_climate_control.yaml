      or (fan_boost_dir == 'heat' and delta <= -4) %}{% set ns.b = 1 %}{% endif %}{% endif %}{% if enable_heat_source_fan_boost
      and enable_heat_source_compensation and fan_boost_dir == 'cool' and (heat_source_load | float(0)) >= ((heat_source_threshold
      | float(50)) - 20) %}{% set ns.b = ns.b + (heat_source_fan_boost | int(0)) %}{% endif %}{{ ns.b }}"
    calculated_fan_level_int: >-
      {% macro lvl(f) %}{% set f = f | string | lower %}{% if '5' in f or f == 'high' %}5{% elif '4' in f %}4{% elif '3' in f
      or f == 'medium' %}3{% elif '2' in f %}2{% elif '1' in f or f in ['low', 'quiet', 'silence'] %}1{% else %}3{% endif %}{% endmacro %}
      {% set mode = fan_control_mode %}
      {% set distance = distance_from_target | float(0) %}
      {% set current_level = current_fan_level_int | int(3) %}
      {% set time_since = time_since_fan_change | float(60) %}
      {% if mode == 'static' %}
        {% set base = lvl(static_fan_speed) | int(3) %}
