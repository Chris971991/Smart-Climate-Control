        ''unknown''] }}'
    then:
    - service: input_text.set_value
      target:
        entity_id: '{{ helper_override_source }}'
      data:
        value: '{{ ''ac'' if states(helper_override_source) == ''both'' else ''none'' }}'
      continue_on_error: true
  - service: input_text.set_value
    target:
      entity_id: '{{ helper_expected_ceiling_fan }}'
    data:
      value: '{{ states(ceiling_fan_entity) }}'
    continue_on_error: true
  - service: system_log.write
    data:
      message: "✅ {{ room_name | upper }} FAN OVERRIDE CLEARED - FAN PUT BACK (INDEPENDENT
        MODE) • Fan changed: {{ trigger.from_state.state }} → {{ trigger.to_state.state
        }}, which is what the automation wanted • Ceiling fan automation resuming • AC
        {{ 'override still active' if states(helper_override_source) == 'ac' else 'was
        not affected' }}\n"
      level: warning
  - if:
    - condition: template
      value_template: '{{ helper_override_flag not in [none, '''', ''unavailable'', ''unknown'']
        and states(helper_override_source) != ''ac'' }}'
    then:
    - service: input_boolean.turn_off
      target:
        entity_id: '{{ helper_override_flag }}'
      continue_on_error: true
  - stop: Fan override cleared - fan put back to the expected state
- if:
  - condition: template
    value_template: '{{ enable_ceiling_fan_override_detection }}'
  - condition: template
    value_template: "{{\n  ceiling_fan_override_detection | bool\n  and control_mode
      not in ['Manual']\n  and override_timeout > 0\n  and not (control_mode == 'Override'
      and override_behavior != 'independent')\n  and not fan_override_active\n}}\n"
  - condition: template
