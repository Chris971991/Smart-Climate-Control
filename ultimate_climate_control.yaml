  helper_temp_stable_since: "{{ helper_temp_stable_since_input if helper_temp_stable_since_input is string else '' }}"
  helper_last_transition_input: !input helper_last_transition
  # v9.20.0: an empty optional helper arrives as {} or [] (its default); states() of
  # either raises and aborted every run. Normalised to '' so every existing
