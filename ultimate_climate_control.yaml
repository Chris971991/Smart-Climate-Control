  then:
  # v9.20.0: the entry [EVENT] and push live in the Pre-conditioning transitions block
  # (after the variables), so they use the room sensor and fire once per real entry.
  - if:
    - condition: template
      value_template: '{{ helper_precond_previous_mode not in [none, '''', ''unavailable'',
