        {% set hold_time = fan_band_hold_time | float(5) %}
        {% if distance <= 1.0 %}{% set band_fan = fan_band_0_1 %}{% elif distance <= 2.0 %}{% set band_fan = fan_band_1_2
        %}{% elif distance <= 3.0 %}{% set band_fan = fan_band_2_3 %}{% elif distance <= 4.0 %}{% set band_fan = fan_band_3_4
        %}{% else %}{% set band_fan = fan_band_4_plus %}{% endif %}
        {# v9.20.0 (round 3): a band is only left downwards 0.15 inside its lower edge (the bedroom
           flickering 23.0/23.1 on the 1.0 edge stepped the fan 3, 4, 3 within 12 minutes). #}
        {% set dd = distance + 0.15 %}
        {% if dd <= 1.0 %}{% set band_down = fan_band_0_1 %}{% elif dd <= 2.0 %}{% set band_down = fan_band_1_2
        %}{% elif dd <= 3.0 %}{% set band_down = fan_band_2_3 %}{% elif dd <= 4.0 %}{% set band_down = fan_band_3_4
        %}{% else %}{% set band_down = fan_band_4_plus %}{% endif %}
        {% set base = lvl(band_fan) | int(3) %}
        {% set boost = [fan_boost_on | int(0), [fan_boost_hold | int(0), current_level - base] | min] | max %}
        {% set target_level = [base + boost, 5] | min %}
        {% set target_down = [[lvl(band_down) | int(3), base] | max + boost, 5] | min %}
        {# v9.20.0 (round 3): a PC-load boost is released only after 15 minutes (the four-PC average
           dips below the hold level between bursts; 5 fan commands in 14 minutes on 04/10). #}
        {% set hs_release = enable_heat_source_fan_boost and enable_heat_source_compensation and (heat_source_fan_boost
           | int(0)) > 0 and fan_boost_dir == 'cool' and boost == 0 and current_level > base %}
        {% set wait = ([hold_time, 15] | max) if hs_release else hold_time %}
        {# v7.4.1: fast escalation (30 s debounce), slow de-escalation (Fan Band Hold Time) #}
        {% if current_level == target_level %}{{ target_level }}
        {% elif target_level > current_level %}{{ current_level if time_since < 0.5 else target_level }}
        {% else %}{{ current_level if (time_since < wait or target_down >= current_level) else target_down }}{% endif %}
      {% else %}
        {% set hold_time = dynamic_hold_time | float(10) %}
        {% set max_level = dynamic_max_level_int | int(5) %}
        {% set start_level = dynamic_starting_level_int | int(2) %}
        {% if last_mode in ['off', 'eco', 'fan_only', 'smart_off', 'away_off', 'auto_off_off', 'window_off', 'adaptive_off',
          'stability_off', 'ceiling_fan_cooling', 'bed_eco_fan_only'] %}{{ [start_level + (fan_boost_on | int(0)), max_level] | min }}
        {% elif time_since < hold_time %}{{ current_level }}
        {% elif is_stalling and current_level < max_level %}{{ current_level + 1 }}
        {% elif dynamic_enable_deescalation and good_progress and current_level > start_level and distance < 2.0 %}{{ current_level - 1 }}
        {% else %}{{ current_level }}{% endif %}
      {% endif %}
    configured_band_fan: >-
      {% set mode = fan_control_mode %}
      {% if mode == 'static' %}
        {{ static_fan_speed }}
      {% elif mode == 'temperature_band' %}
        {% set distance = distance_from_target | float(0) %}
        {% if distance <= 1.0 %}{{ fan_band_0_1 }}
        {% elif distance <= 2.0 %}{{ fan_band_1_2 }}
        {% elif distance <= 3.0 %}{{ fan_band_2_3 }}
        {% elif distance <= 4.0 %}{{ fan_band_3_4 }}
        {% else %}{{ fan_band_4_plus }}{% endif %}
      {% else %}{% endif %}
    # v9.20.0: the boosts are inside calculated_fan_level_int now (see there).
    final_fan_level_int: '{{ calculated_fan_level_int | int(3) }}'
    verbatim_fan: >-
      {% set fans = (state_attr(climate_list[0], 'fan_modes') or []) | list if
        climate_list | length > 0 else [] %}
      {% set choice = configured_band_fan | trim %}
      {% set cl = choice | lower %}
      {# M24 option (a): only emit verbatim once the integer pipeline has settled on
         the configured band's level, so fan_band_hold_time/debounce is respected. #}
      {% if '5' in cl or cl == 'high' %}{% set choice_level = 5 %}
      {% elif '4' in cl %}{% set choice_level = 4 %}
      {% elif '3' in cl or cl == 'medium' %}{% set choice_level = 3 %}
      {% elif '2' in cl %}{% set choice_level = 2 %}
      {% elif '1' in cl or cl in ['low', 'quiet', 'silence'] %}{% set choice_level = 1 %}
      {% elif cl == 'auto' %}{% set choice_level = 3 %}
      {% else %}{% set choice_level = -1 %}{% endif %}
      {% set settled = (calculated_fan_level_int | int(3)) == choice_level %}
      {% if cl in ['auto', 'quiet', 'silence'] and settled %}
        {% if choice in fans %}{{ choice }}
        {% elif cl in fans %}{{ cl }}
        {% elif (cl | title) in fans %}{{ cl | title }}
        {% else %}{% endif %}
      {% else %}{% endif %}
    new_fan_mode: "{% set fans = (state_attr(climate_list[0], 'fan_modes') or [])
      | list if climate_list | length > 0 else [] %} {% set is_precond = control_mode_helper
      and states(control_mode_helper) == 'Pre-conditioning' %} {% set desired_precond_fan
      = precond_fan_mode | default('Dynamic') %} {% set has_numbered = '5' in fans
      or '4' in fans %} {% if is_precond and desired_precond_fan != 'Dynamic' %}\n
      \ {% if desired_precond_fan | lower in fans %}\n    {{ desired_precond_fan |
      lower }}\n  {% elif desired_precond_fan in fans %}\n    {{ desired_precond_fan
      }}\n  {% elif desired_precond_fan == 'Low' %}\n    {% if has_numbered and '1'
      in fans %}1{% elif 'low' in fans %}low{% elif 'Low' in fans %}Low{% elif 'silence'
      in fans %}silence{% elif 'Silence' in fans %}Silence{% elif 'Quiet' in fans
      %}Quiet{% else %}{{ fans[0] | default('auto') }}{% endif %}\n  {% elif desired_precond_fan
      == 'Medium' %}\n    {% if has_numbered and '3' in fans %}3{% elif 'mid' in fans
      %}mid{% elif 'Mid' in fans %}Mid{% elif 'medium' in fans %}medium{% elif 'Medium'
      in fans %}Medium{% else %}{{ fans[0] | default('auto') }}{% endif %}\n  {% elif
      desired_precond_fan == 'High' %}\n    {% if has_numbered and '5' in fans %}5{%
      elif 'high' in fans %}high{% elif 'High' in fans %}High{% else %}{{ fans[-1]
      | default('auto') }}{% endif %}\n  {% else %}\n    {{ fans[0] | default('auto')
      }}\n  {% endif %}\n{% else %} {% set level = final_fan_level_int | int(3) %}\n{%
      if (verbatim_fan | trim) != '' %}\n  {{ verbatim_fan | trim }}\n{% else %}\n{%
      if ('Level ' ~ level) in fans %}\n  Level {{ level }}\n{% elif level | string
      in fans %}\n  {{ level }}\n{% elif level == 1 and 'Silence' in fans %}\n  Silence\n{%
      elif level == 1 and 'silence' in fans %}\n  silence\n{% elif level == 1 and
      'Quiet' in fans %}\n  Quiet\n{% elif level == 1 and 'quiet' in fans %}\n  quiet\n{%
      elif level == 1 and 'low' in fans %}\n  low\n{% elif level == 1 and 'Low' in
      fans %}\n  Low\n{% elif level == 2 and 'medium-low' in fans %}\n  medium-low\n{%
      elif level == 3 and 'medium' in fans %}\n  medium\n{% elif level == 3 and 'Medium'
      in fans %}\n  Medium\n{% elif level == 4 and 'medium-high' in fans %}\n  medium-high\n{%
      elif level == 5 and 'high' in fans %}\n  high\n{% elif level == 5 and 'High'
      in fans %}\n  High\n{% elif 'Auto' in fans %}\n  Auto\n{% elif 'auto' in fans
      %}\n  auto\n{% else %}\n  {{ fans[0] if fans else 'Auto' }}\n{% endif %}\n{% endif
      %} {% endif %}\n"
    # v9.20.0: compared as text. HA turns a variable that renders "5" into the number 5 while
    # the unit reports the text "5", so this was always True for numeric fan modes: a fan
    # command every run, the fan clock re-stamped every run (the fan could never slow down;
    # 137 stamps on the Office in 3.5 h on 04/10) and the integration's remote-press grace
    # re-armed constantly.
    fan_mode_changed: "{% set current = (state_attr(climate_list[0], 'fan_mode') | default('', true)) if climate_list
      | length > 0 else '' %}{{ (current | string | trim) != (new_fan_mode | string | trim) }}"
    # v9.19.0: the setpoint is driven by how far the room is from target, held while the
    # room is still warm, and rounded to the unit's step. Before this the only push below
    # target was the escalation ladder (offset x level, recomputed from scratch every run).
    # The ladder flips between levels as the room creeps, so the Office was told 20, 21,
    # 20, 21 (nine changes in 50 min, 04/10) and spent its last degree at a setpoint its own
    # sensor already read as reached, at fan 5 with the compressor throttled back.
    #   setpoint_direction  cool / heat / none, the same rule the v4.0.0 template used inline,
    #                       plus a unit that is cooling/heating in Pre-conditioning (inside the
    #                       comfort band that used to read 'none', so the setpoint fell back to
    #                       the plain target every hold period and the PRE-CONDITIONING
    #                       CORRECTION branch put the boost back: a 5-minute flip-flop, v9.15.5)
    #   setpoint_hold_active  the pull-down hold applies (Pull-down > 0 only, room > 0.5 away)
    #                       A target raised mid pull-down therefore takes effect once the
    #                       room is within 0.5 of it (a bound based on the current room gap
    #                       released the hold about 1 degree early, audit 04/10).
    #   setpoint_drive      pull-down x room gap + level x level offset (capped at
    #                       bed_eco_max_overshoot in bed comfort modes), plus the unit sensor
    #                       offset on top (v9.20.0: the offset corrects the AC's own sensor; inside
    #                       the cap it pinned the bedroom at target - 1.0 with a 1.5 offset)
    setpoint_direction: "{% set mode_is_cooling = last_mode in ['cooling', 'bed_comfort_eco', 'bed_comfort_quiet']
      or (last_mode == 'bed_eco_fan_only' and current_temp > target_temp) %}{% set mode_is_heating = last_mode
      == 'heating' %}{% set precond_active = states(control_mode_helper) == 'Pre-conditioning' %}{% set precond_unit
      = (states(climate_list[0]) if climate_list | length > 0 else 'off') if precond_active else 'off' %}{% if mode_is_cooling
      %}cool{% elif mode_is_heating %}heat{% elif precond_unit == 'cool' %}cool{% elif precond_unit
      == 'heat' %}heat{% elif precond_active and enable_cooling and current_temp > (precond_target
      | float(22)) %}cool{% elif precond_active and enable_heating and current_temp < (precond_target
      | float(22)) %}heat{% elif current_temp > comfort_max_temp %}cool{% elif current_temp
      < comfort_min_temp %}heat{% else %}none{% endif %}"
    # v9.20.0: any cooling with someone in bed counts (bed_active, Bed Comfort on). A run that
    # started before bed, or a restart in bed, used the full pull-down over an occupied bed
    # until the bed entry took over at the target.
    setpoint_in_bed_comfort: "{{ last_mode in ['bed_comfort_eco', 'bed_comfort_quiet', 'bed_eco_fan_only']
      or ((bed_active | bool) and bed_comfort_mode != 'off' and setpoint_direction == 'cool') }}"
    # v9.20.0: measured from the point where the run STOPS (target minus overshoot; in Bed ECO
    # the Stop Point Below Target when larger). Measured from the target, the push fell to
    # nothing at 22.0 in bed while the rest only starts at 21.5, so the unit could idle a
    # few tenths short of the hand-over.
    setpoint_room_gap: "{% set below = ((target_temp | float(22)) - (bed_stop_point | float(0)))
      if ((setpoint_in_bed_comfort | bool) and bed_eco_fan_only_mode in ['enabled', 'ceiling_fan']) else (target_overshoot
      | float(0)) %}{% if setpoint_direction == 'cool' %}{% set g = current_temp - (target_temp - below) %}{% elif
      setpoint_direction == 'heat' %}{% set g = (target_temp + (target_overshoot | float(0))) - current_temp %}{% else
      %}{% set g = 0 %}{% endif %}{{ [g, 0] | max | round(2) }}"
    setpoint_drive_proportional: "{{ ((pulldown_per_degree | float(0)) * (setpoint_room_gap
      | float(0))) | round(2) }}"
    setpoint_drive_stall: "{{ ((final_escalation_level | int(0)) * (effective_escalation_offset
      | float(0))) | round(2) }}"
    # v9.20.0: the unit sensor offset is a sensor correction, not a push, so it applies in bed
    # even when Bed ECO is not allowed to push (asking for the target on the unit's own sensor
    # left the room that offset above target).
    setpoint_drive: "{% if (enable_dynamic_target | bool) and setpoint_direction != 'none' %}{% set
      d = 0 %}{% if not (setpoint_in_bed_comfort | bool) or (bed_eco_allow_escalation | bool) %}{% set d
      = (setpoint_drive_proportional | float(0)) + (setpoint_drive_stall | float(0)) %}{% if setpoint_in_bed_comfort
      | bool %}{% set d = [d, bed_eco_max_overshoot | float(1.0)] | min %}{% endif %}{% endif %}{{ (d
      + (unit_sensor_offset | float(0))) | round(2) }}{% else %}0{% endif %}"
    # v9.20.0 (round 3/4): held for the whole run when the run stops at its stop point (it eased a
    # step just above the stop and could re-harden a minute later; easing only helps a run that
    # settles on its setpoint instead of stopping). Was: also held in the last 0.35 before the stop point when the run stops
    # there (every run eased the setpoint a step a minute or two before it was switched off:
    # four extra BRP072C calls a night in the bedroom, each one revving the fan). Not in a
    # continuous Bed ECO (no rest phase), which settles on the setpoint instead of stopping.
    setpoint_hold_active: "{% set exp_ok = helper_expected_temp not in [none, '', 'unavailable',
      'unknown'] and states(helper_expected_temp) not in ['unknown', 'unavailable', ''] %}{%
      set running = climate_list | length > 0 and states(climate_list[0]) in ['cool', 'heat',
      'auto', 'heat_cool', 'dry'] %}{% set on = (enable_dynamic_target | bool) and (pulldown_per_degree
      | float(0)) > 0 and exp_ok and running %}{% set near_stop = not
      ((setpoint_in_bed_comfort | bool) and bed_eco_fan_only_mode not in ['enabled', 'ceiling_fan']) %}{% if on
      and setpoint_direction == 'cool' %}{{ last_mode in ['cooling', 'bed_comfort_eco', 'bed_comfort_quiet'] and
      ((current_temp - target_temp) > 0.5 or near_stop) }}{% elif on and setpoint_direction == 'heat' %}{{ last_mode
      == 'heating' and ((target_temp - current_temp) > 0.5 or near_stop) }}{% else %}False{% endif %}"
    adjusted_target: >-
      {% set is_cooling = setpoint_direction == 'cool' %}
      {% set is_heating = setpoint_direction == 'heat' %}
      {% set in_bed_comfort = setpoint_in_bed_comfort | bool %}
      {% set base = target_temp %}
      {# Step 1: outside temperature compensation, scaled by the distance from target
         (v9.3.7), skipped in bed comfort modes (v7.2.0) #}
      {% if enable_outside_temp_compensation and (is_cooling or is_heating) and not in_bed_comfort %}
        {% set outdoor = outdoor_temperature | float(25) %}
        {% set outdoor_delta = outdoor - outside_compensation_base_temp %}
        {% if is_cooling and outdoor_delta > 0 %}
          {% set temp_gap = current_temp - target_temp %}
          {% if temp_gap > 0 %}
            {% set comfort_range = (comfort_max_temp | float(0)) - target_temp %}
            {% set scale = ([temp_gap / comfort_range, 1.0] | min) if comfort_range > 0 else 0.0 %}
            {% set base = base - (outside_temp_compensation_amount * scale) %}
          {% endif %}
        {% elif is_heating and outdoor_delta < 0 %}
          {% set temp_gap = target_temp - current_temp %}
          {% if temp_gap > 0 %}
            {% set comfort_range = target_temp - (comfort_min_temp | float(0)) %}
            {% set scale = ([temp_gap / comfort_range, 1.0] | min) if comfort_range > 0 else 0.0 %}
            {% set base = base + (outside_temp_compensation_amount * scale) %}
          {% endif %}
        {% endif %}
      {% endif %}
      {# Step 2 (v9.19.0): the drive. With Pull-down 0 and Unit Sensor Offset 0 this is
         exactly the old escalation adjustment (level x offset per level). #}
      {% set drive = setpoint_drive | float(0) %}
      {% if is_cooling %}{% set base = base - drive %}{% elif is_heating %}{% set base = base + drive %}{% endif %}
      {# Step 3: heat source compensation (v6.5.0) #}
      {% if heat_source_active and is_cooling and not in_bed_comfort %}
        {% set base = base - heat_source_compensation_amount %}
      {% endif %}
      {# Step 4: pre-conditioning (v7.1.3) #}
      {% set precond_mode_check = states(control_mode_helper) == 'Pre-conditioning' %}
      {% set precond_boost = precond_mode_check and precond_boost_enabled %}
      {% if precond_boost and is_cooling %}
        {% set base = ac_min_resolved | float(18) %}
      {% elif precond_boost and is_heating %}
        {% set base = ac_max_resolved | float(30) %}
      {% elif precond_mode_check and is_cooling %}
        {% set base = [base, precond_target | float(22)] | min %}
      {% elif precond_mode_check and is_heating %}
        {% set base = [base, precond_target | float(22)] | max %}
      {% endif %}
      {# Step 5 (v9.19.0): AC limits, the unit's step (rounded toward the harder side, so
         what we send is what the unit shows), and the hold (setpoint_hold_active, i.e.
         Pull-down > 0): while the room is still more than 0.5 from target the setpoint never
         moves to the easier side of the last one SENT (the expected-temp helper), so a
         flicker in the escalation level or a 0.1 wobble on the room sensor can no longer
         back the unit off mid pull-down. Inside 0.5 it eases (easier moves still wait for
         the Setpoint Hold). #}
      {% set ac_min_temp = ac_min_resolved | float(16) %}
      {% set ac_max_temp = ac_max_resolved | float(30) %}
      {% set step = (state_attr(climate_list[0], 'target_temp_step') | float(0.5)) if climate_list | length > 0 else 0.5 %}
      {% set step = step if step > 0 else 0.5 %}
      {% set exp_ok = helper_expected_temp not in [none, '', 'unavailable', 'unknown']
         and states(helper_expected_temp) not in ['unknown', 'unavailable', ''] %}
      {% set hold = setpoint_hold_active | bool %}
      {% set last_sent = (states(helper_expected_temp) | float(0)) if exp_ok else 0 %}
      {% set bed_floor = target_temp - ((bed_eco_max_overshoot | float(1.0)) if (bed_eco_allow_escalation | bool)
         else 0) - (unit_sensor_offset | float(0)) %}
      {% if is_cooling %}
        {% set base = [ac_min_temp, base] | max %}
        {# +/- 0.0001: 15.999999999999998 must not floor a whole step down #}
        {% set base = [ac_min_temp, ((base / step + 0.0001) | round(0, 'floor')) * step] | max %}
        {% if hold and last_sent >= ac_min_temp and last_sent < base
           and (not in_bed_comfort or last_sent >= bed_floor) %}
          {% set base = last_sent %}
        {% endif %}
        {{ base | round(1) }}
      {% elif is_heating %}
        {% set base = [base, ac_max_temp] | min %}
        {% set base = [((base / step - 0.0001) | round(0, 'ceil')) * step, ac_max_temp] | min %}
        {% if hold and last_sent <= ac_max_temp and last_sent > base %}
          {% set base = last_sent %}
        {% endif %}
        {{ base | round(1) }}
      {% else %}
        {{ target_temp }}
      {% endif %}
    # v9.19.0: ONE send decision for every branch that holds a running unit at a setpoint
    # (cooling entry/active, continue-cooling, heating entry/active, continue-heating).
    # The two "active" branches used to re-send adjusted_target on every run with no hold,
    # which is where the 20/21 churn came from once the room sat above the comfort band.
    # True when a unit's reported setpoint differs from adjusted_target by 0.3 or more
    # (not clipped at its min/max) AND the move is to the harder side, or the hold since the
    # last sent setpoint has elapsed. While the pull-down hold is active, harder moves go at
    # once: the hold means they only ever step one way per pull-down. Otherwise every move
    # waits for the Setpoint Hold, exactly as v9.15.3.
    # A unit that is off or in the wrong mode is handled by each branch's own mode check.
    # v9.20.0 (round 3): an EASIER move waits twice the Setpoint Hold. On the Living Room's slow
    # sensors the stall level came and went, and the setpoint went 18, 19, 18, 20 in 25 minutes.
    setpoint_change_due: "{% set exp_ok = helper_expected_temp not in [none, '', 'unavailable',
      'unknown'] and states(helper_expected_temp) not in ['unknown', 'unavailable', ''] %}{%
      set held_min = ((as_timestamp(now()) - as_timestamp(states[helper_expected_temp].last_changed))
      / 60) if exp_ok else 999 %}{% set want = adjusted_target | float(0) %}{% set ns = namespace(due=false)
      %}{% for e in climate_list %}{% set dev = state_attr(e, 'temperature') %}{% if dev is none
      %}{% set ns.due = true %}{% else %}{% set dev = dev | float(0) %}{% set lo = state_attr(e,
      'min_temp') | float(16) %}{% set hi = state_attr(e, 'max_temp') | float(30) %}{% set clipped
      = (want < dev and dev <= lo + 0.01) or (want > dev and dev >= hi - 0.01) %}{% set harder
      = (setpoint_direction == 'cool' and want < dev) or (setpoint_direction == 'heat' and want
      > dev) %}{% if ((dev - want) | abs) >= 0.3 and not clipped and ((harder and (setpoint_hold_active
      | bool)) or not exp_ok or held_min >= ((setpoint_hold | float(5)) * (1 if harder else 2))) %}{% set ns.due = true
      %}{% endif %}{% endif %}{% endfor %}{{ ns.due }}"
    # v9.20.0 (round 3): the comfort-zone eco setpoint (target corrected for the AC sensor
    # offset, on the unit's step), shared by the branch and its re-entry test: a unit that did
    # not take it (failed command) is re-sent instead of being left at the pull-down setpoint.
    # Round 4: a room with both cooling and heating holds the plain target (the unit runs in
    # auto there, and an offset in either direction would cool a room it had just heated).
    comfort_eco_setpoint: "{% set off = (unit_sensor_offset | float(0)) if (enable_dynamic_target | bool) else 0
      %}{% set step = (state_attr(climate_list[0], 'target_temp_step') | float(0.5)) if climate_list | length > 0
      else 0.5 %}{% set step = step if step > 0 else 0.5 %}{% set t = target_temp | float(22) %}{% if enable_cooling
      and enable_heating %}{{ ((t / step) | round(0)) * step }}{% elif enable_cooling %}{{ ((((t - off) / step) - 0.0001)
      | round(0, 'ceil')) * step }}{% else %}{{ ((((t + off) / step) + 0.0001) | round(0, 'floor')) * step }}{% endif %}"
    comfort_eco_needs_send: "{% set ns = namespace(s=false) %}{% for e in climate_list %}{% set step = state_attr(e,
      'target_temp_step') | float(0.5) %}{% if states(e) not in ['off', 'unavailable', 'unknown'] and ((state_attr(e,
      'temperature') | float(-99)) - (comfort_eco_setpoint | float(0))) | abs >= ([0.3, step * 0.99] | max) %}{% set
      ns.s = true %}{% endif %}{% endfor %}{{ ns.s }}"
    # v9.20.0 (round 3): the Away eco setpoint, here so the Away branch can re-send it to a unit
    # that did not take it. A cooling-only house is held at the cooling target plus the offset.
    away_eco_target: "{% if enable_cooling and (current_temp >= (target_temp | float(22)) or not enable_heating)
      %}{{ (cooling_target_temp | float(0)) + eco_mode_setpoint_offset }}{% else %}{{ (heating_target_temp
      | float(0)) - eco_mode_setpoint_offset }}{% endif %}"
    away_eco_needs_send: "{% set ns = namespace(s=false) %}{% for e in climate_list %}{% set step = state_attr(e,
      'target_temp_step') | float(0.5) %}{% if states(e) not in ['off', 'unavailable', 'unknown'] and ((state_attr(e,
      'temperature') | float(-99)) - (away_eco_target | float(0))) | abs >= ([0.3, step * 0.99] | max) %}{% set
      ns.s = true %}{% endif %}{% endfor %}{{ ns.s }}"
    last_transition: "{% if helper_last_transition %}\n  {% set transition_state =
      states(helper_last_transition) | default('none') %}\n  {{ 'none' if transition_state
      in ['unknown', 'unavailable', ''] else transition_state }}\n{% else %}\n  none\n{%
      endif %}\n"
    cooling_with_hysteresis: "{% if last_transition == 'heating' %}\n  {# Coming from
      heating - need extra margin to switch to cooling #}\n  {{ current_temp > (comfort_max_temp
      + hysteresis_tolerance) }}\n{% else %}\n  {# Standard cooling threshold #}\n
      \ {{ current_temp > comfort_max_temp }}\n{% endif %}\n"
    heating_with_hysteresis: "{% if last_transition == 'cooling' %}\n  {# Coming from
